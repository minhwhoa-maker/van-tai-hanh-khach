<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử chuyến</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-card {
            margin: 16px 16px 0; padding: 16px; background: var(--white); border-radius: var(--radius);
            box-shadow: var(--shadow); cursor: pointer;
        }
        .chuyen-card:active { background: var(--bg); }
        .chuyen-card .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
        .chuyen-card .row-top .ngay { font-weight: 400; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
        .chuyen-card .stats { margin-top: 6px; font-size: 13px; color: var(--text-muted); }
        .chuyen-card .cod-warn { margin-top: 4px; font-size: 13px; color: var(--warning); font-weight: 600; }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">🕐 Lịch sử chuyến</span>
        </h2>
        <div></div>
    </div>

    <div id="list-wrap"></div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script>
        const sb = createSb()

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        function renderGroupHeader(text) {
            const h = document.createElement('p')
            h.style.cssText = 'padding:16px 16px 4px; font-weight:600; font-size:13px; color:var(--text-muted);'
            h.textContent = text
            return h
        }

        // chuyen(id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at) — lấy cả 'dang_chay'
        // lẫn 'xong' (50 gần nhất), tách 2 nhóm để crew vừa xem lại chuyến đã xong vừa
        // theo dõi nhanh chuyến đang chạy mà không cần qua hang.html.
        // kien(chuyen_id, tien_thu, tien_thu_ho) — group theo chuyen_id ở client, data nhỏ
        // (vài chục kiện/chuyến) nên không cần RPC/view riêng.
        async function loadLichSu() {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''

            const { data: chuyenList, error: chuyenErr } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .order('khoi_hanh', { ascending: false })
                .limit(50)
            if (chuyenErr) { showToast('Lỗi tải lịch sử: ' + chuyenErr.message, 'error'); return }
            if (!chuyenList.length) { wrap.innerHTML = '<div class="empty">Chưa có chuyến nào</div>'; return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('chuyen_id, tien_thu, tien_thu_ho')
                .in('chuyen_id', chuyenList.map(c => c.id))
                .neq('trang_thai', 'huy')
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }

            const dangChay = chuyenList.filter(c => c.trang_thai === 'dang_chay')
            const daXong = chuyenList.filter(c => c.trang_thai === 'xong')

            if (dangChay.length) {
                wrap.appendChild(renderGroupHeader('Chuyến đang chạy'))
                dangChay.forEach(c => {
                    const kiensCuaChuyen = kienList.filter(k => k.chuyen_id === c.id)
                    wrap.appendChild(createChuyenCard(c, kiensCuaChuyen))
                })
            }
            if (daXong.length) {
                wrap.appendChild(renderGroupHeader('Chuyến đã hoàn thành'))
                daXong.forEach(c => {
                    const kiensCuaChuyen = kienList.filter(k => k.chuyen_id === c.id)
                    wrap.appendChild(createChuyenCard(c, kiensCuaChuyen))
                })
            }
        }

        function createChuyenCard(c, kiens) {
            const chieuLabel = c.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
            const tongKien = kiens.length
            const tongThu = kiens.reduce((s, k) => s + Number(k.tien_thu || 0), 0)
            const codChuaDu = kiens.filter(k => k.tien_thu_ho != null && k.tien_thu_ho > 0 && Number(k.tien_thu || 0) < Number(k.tien_thu_ho))

            const card = document.createElement('div')
            card.className = 'chuyen-card'
            card.innerHTML = `
                <div class="row-top">
                    <span>${chieuLabel}</span>
                    <span class="ngay">${formatDate(c.khoi_hanh)}</span>
                </div>
                <div class="stats">${tongKien} kiện · Đã thu: ${formatMoney(tongThu)}${c.ghi_chu ? ' · ' + c.ghi_chu : ''}</div>
                ${codChuaDu.length ? `<div class="cod-warn">⚠ Còn ${codChuaDu.length} kiện chưa thu đủ COD</div>` : ''}
            `
            card.addEventListener('click', () => {
                window.location.href = `manifest-hang.html?chuyen_id=${c.id}`
            })
            return card
        }

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            await loadLichSu()
        }

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
