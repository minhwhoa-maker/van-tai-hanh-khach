<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Lịch sử chuyến</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-card {
            margin: 16px 16px 0; padding: 16px; background: var(--white); border-radius: var(--radius);
            box-shadow: var(--shadow); cursor: pointer;
        }
        .chuyen-card:active { background: var(--bg); }
        .chuyen-card .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-weight: 600; }
        .chuyen-card .row-top .ngay { font-weight: 400; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
        .chuyen-card .stats { margin-top: 6px; font-size: 13px; color: var(--text-muted); }
        .chuyen-card .cod-warn { margin-top: 4px; font-size: 13px; color: var(--warning); font-weight: 600; }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">🕐 Lịch sử chuyến</span>
        </h2>
        <div></div>
    </div>

    <div id="list-wrap"></div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script>
        const sb = createSb()
        let currentNhaXeId = null  // resolveNhaXeId(sb, user.id) — xem CLAUDE.md mục "Multi-tenant"

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        function renderGroupHeader(text) {
            const h = document.createElement('p')
            h.style.cssText = 'padding:16px 16px 4px; font-weight:600; font-size:13px; color:var(--text-muted);'
            h.textContent = text
            return h
        }

        // chuyen(id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at) — lấy cả 'dat_truoc'/
        // 'dang_chay'/'xong' (50 gần nhất), tách 3 nhóm để crew vừa xem lại chuyến đã xong, vừa
        // theo dõi nhanh chuyến đang chạy, vừa thấy chuyến khách đã đặt trước (lịch chạy cố định,
        // xem SPEC "Lịch chạy cố định theo ngày chẵn âm lịch" CLAUDE.md) mà không cần qua hang.html.
        // kien(chuyen_id, tien_thu, tien_thu_ho) — group theo chuyen_id ở client, data nhỏ
        // (vài chục kiện/chuyến) nên không cần RPC/view riêng.
        async function loadLichSu() {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''

            const { data: chuyenList, error: chuyenErr } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .eq('nha_xe_id', currentNhaXeId)
                .order('khoi_hanh', { ascending: false })
                .limit(50)
            if (chuyenErr) { showToast('Lỗi tải lịch sử: ' + chuyenErr.message, 'error'); return }
            if (!chuyenList.length) { wrap.innerHTML = '<div class="empty">Chưa có chuyến nào</div>'; return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('chuyen_id, tien_thu, tien_thu_ho')
                .in('chuyen_id', chuyenList.map(c => c.id))
                .not('trang_thai', 'in', '(huy,tra_lai)')
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }

            // Vé đã đặt online cho chuyến 'dat_truoc' — hiện số lượng ngay trên card để crew biết
            // có cần chuẩn bị sớm hay không trước khi bấm "Bắt đầu chuyến".
            const datTruoc = chuyenList.filter(c => c.trang_thai === 'dat_truoc')
            let veCountMap = new Map()
            if (datTruoc.length) {
                const { data: veList, error: veErr } = await sb
                    .from('ve').select('chuyen_id').in('chuyen_id', datTruoc.map(c => c.id)).eq('trang_thai', 'da_dat')
                if (veErr) { showToast('Lỗi tải vé: ' + veErr.message, 'error') }
                else veList.forEach(v => veCountMap.set(v.chuyen_id, (veCountMap.get(v.chuyen_id) || 0) + 1))
            }

            const dangChay = chuyenList.filter(c => c.trang_thai === 'dang_chay')
            const daXong = chuyenList.filter(c => c.trang_thai === 'xong')

            if (datTruoc.length) {
                wrap.appendChild(renderGroupHeader('📅 Chuyến đã đặt trước'))
                datTruoc.sort((a, b) => new Date(a.khoi_hanh) - new Date(b.khoi_hanh)).forEach(c => {
                    wrap.appendChild(createChuyenDatTruocCard(c, veCountMap.get(c.id) || 0))
                })
            }
            if (dangChay.length) {
                wrap.appendChild(renderGroupHeader('Chuyến đang chạy'))
                dangChay.forEach(c => {
                    const kiensCuaChuyen = kienList.filter(k => k.chuyen_id === c.id)
                    wrap.appendChild(createChuyenCard(c, kiensCuaChuyen))
                })
            }
            if (daXong.length) {
                wrap.appendChild(renderGroupHeader('Chuyến đã hoàn thành'))
                daXong.forEach(c => {
                    const kiensCuaChuyen = kienList.filter(k => k.chuyen_id === c.id)
                    wrap.appendChild(createChuyenCard(c, kiensCuaChuyen))
                })
            }
        }

        // Card riêng cho 'dat_truoc' — KHÔNG điều hướng khi bấm vào thân card (chưa "Bắt đầu
        // chuyến" thì hang.html/manifest-hang.html chưa cho thao tác nhập kiện mới cho chuyến
        // này), chỉ nút "🚀 Bắt đầu chuyến" mới có hành động: UPDATE trang_thai='dang_chay' rồi
        // tải lại danh sách — từ đó chuyến này thấy y hệt 1 chuyến crew tự tạo tay ở mọi trang.
        function createChuyenDatTruocCard(c, soVe) {
            const chieuLabel = c.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
            const card = document.createElement('div')
            card.className = 'chuyen-card'
            card.innerHTML = `
                <div class="row-top">
                    <span>${chieuLabel}</span>
                    <span class="ngay">${formatDate(c.khoi_hanh)}</span>
                </div>
                <div class="stats">${soVe} khách đã đặt online</div>
                <button type="button" class="btn-bat-dau-chuyen" style="margin-top:8px;width:100%;padding:10px;border:none;border-radius:var(--radius-sm);background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">🚀 Bắt đầu chuyến</button>
            `
            card.querySelector('.btn-bat-dau-chuyen').addEventListener('click', async (e) => {
                e.stopPropagation()
                const ok = await confirmDialog(`Bắt đầu chuyến ${chieuLabel} — ${formatDate(c.khoi_hanh)}?`)
                if (!ok) return
                const { error } = await sb.from('chuyen').update({ trang_thai: 'dang_chay' }).eq('id', c.id)
                if (error) { showToast('Lỗi: ' + error.message, 'error'); return }
                showToast('Đã bắt đầu chuyến', 'success')
                loadLichSu()
            })
            return card
        }

        function createChuyenCard(c, kiens) {
            const chieuLabel = c.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
            const tongKien = kiens.length
            const tongThu = kiens.reduce((s, k) => s + Number(k.tien_thu || 0), 0)
            const codChuaDu = kiens.filter(k => k.tien_thu_ho != null && k.tien_thu_ho > 0 && Number(k.tien_thu || 0) < Number(k.tien_thu_ho))

            const card = document.createElement('div')
            card.className = 'chuyen-card'
            card.innerHTML = `
                <div class="row-top">
                    <span>${chieuLabel}</span>
                    <span class="ngay">${formatDate(c.khoi_hanh)}</span>
                </div>
                <div class="stats">${tongKien} kiện · Đã thu: ${formatMoney(tongThu)}${c.ghi_chu ? ' · ' + c.ghi_chu : ''}</div>
                ${codChuaDu.length ? `<div class="cod-warn">⚠ Còn ${codChuaDu.length} kiện chưa thu đủ COD</div>` : ''}
            `
            card.addEventListener('click', () => {
                window.location.href = `manifest-hang.html?chuyen_id=${c.id}`
            })
            return card
        }

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            currentNhaXeId = await resolveNhaXeId(sb, auth.user.id)
            if (!currentNhaXeId) {
                showToast('Tài khoản chưa được gán vào nhà xe nào — liên hệ quản trị viên', 'error')
                return
            }
            await loadLichSu()
        }

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        setupLogoutListener(sb)
        initPage()
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW register failed:', err))
            })
        }
    </script>
</body>
</html>
