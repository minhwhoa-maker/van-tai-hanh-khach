<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Hành khách</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-select-wrap { padding: 10px 16px 8px; }
        .chuyen-select-wrap select#chuyen-select { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doanhthu-ve-summary {
            display: none; margin: 0 16px 8px; padding: 8px 14px; border-radius: var(--radius-sm);
            background: #e9f7ef; border: 1.5px solid var(--success); color: var(--success);
            font-size: 13px; font-weight: 600;
        }
        /* 2026-09-16: ĐẢO NGƯỢC quyết định 2026-09-15 (đổi từ "2 tầng cạnh nhau" sang "1
           tầng/lượt qua tab" theo design handoff mockup) — owner xem tham chiếu Vexere thật,
           muốn quay lại layout 2 cột song song, luôn thấy cả 2 tầng cùng lúc. KHÔNG phải revert
           lỗi, là quyết định mới đè lên quyết định cũ. Icon giường vẫn là SVG thật (khung + gối)
           + trạng thái "Đang chọn" giữ nguyên từ 2026-09-15, chỉ đổi phần layout tầng + icon vô
           lăng. Cột không còn khoá cứng max-width:260px (đó là bề rộng cho 1 tầng full-width) —
           giờ 2 cột chia đôi màn hình, icon giường tự co theo `minmax(0, 1fr)` thay vì px cố
           định, để không tràn ngang trên màn hình hẹp. */
        .availability-caption { text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 4px; }
        .chu-thich-giuong { display: flex; justify-content: center; gap: 14px; padding: 8px 16px 8px; }
        .chu-thich-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); }
        .chu-thich-item svg { flex-shrink: 0; }
        /* Vách ngăn giữa 2 tầng (border-left trên cột thứ 2) + cỡ ghế CỐ ĐỊNH thay vì co theo
           `1fr` — trước đó mỗi hàng tự giãn lấp đầy 190px nên hàng 3 ghế (vi_tri 1,3,5) hiện
           icon to hẳn, hàng 5 ghế (hàng cuối) hiện icon nhỏ hơn hẳn, khiến 2 tầng nhìn LỆCH
           nhau dù cùng 1 layout giường — không phải do bố cục sai, mà do icon co giãn không đều
           giữa các hàng. Cố định `--seat-cell` (28px) + `justify-content:center` cho mọi hàng
           thì hàng 3/5 ghế đều dùng đúng 1 cỡ icon, tự căn giữa trong cột — hàng tương ứng giữa
           2 tầng (cùng số ghế/vi_tri, seed đối xứng) khi đó tự thẳng hàng, đối xứng qua vách. */
        .tang-cols { display: flex; padding: 0 10px 12px; align-items: flex-start; position: relative; }
        .tang-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 0 6px; }
        .tang-col + .tang-col { border-left: 2px solid var(--border); }
        .tang-title {
            font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-muted);
            margin-bottom: 2px; text-transform: uppercase;
        }
        .seat-grid-wrap { display: flex; flex-direction: column; gap: 6px; padding: 0 4px 12px; width: 100%; align-items: center; }
        .giuong-hang {
            --seat-cell: 28px;
            display: grid; column-gap: 6px; justify-content: center;
        }
        /* Vô lăng kiểu Vexere: khối tròn nền xám đặc, vô lăng trắng nổi bên trong — màu nằm hẳn
           trong SVG (fill/stroke), CSS chỉ còn lo định vị. Chỉ đặt trong cột "Tầng dưới" (tài xế
           ngồi tầng dưới của xe giường nằm 2 tầng), cố định trong khối HTML của cột đó thay vì
           toggle theo currentFloor như trước (đã bỏ khái niệm tầng-đang-xem). */
        .driver-icon { align-self: flex-start; margin: 4px 0 8px 6px; }
        .driver-icon.hidden-visual svg { visibility: hidden; }
        .giuong-icon {
            width: var(--seat-cell, 28px); aspect-ratio: 3/4; border-radius: 8px; border: 2px solid var(--border);
            background: var(--white); display: flex; align-items: center; justify-content: center;
            padding: 3px; cursor: pointer; color: var(--text-muted); font-family: inherit;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        .giuong-icon svg { width: 100%; height: 100%; display: block; }
        .giuong-icon.da-dat { background: var(--success-light); border-color: var(--success); color: var(--success); }
        .giuong-icon.dang-chon { background: var(--primary); border-color: var(--primary); color: #fff; }
        .giuong-icon.offline {
            background: repeating-linear-gradient(45deg, #eee, #eee 4px, #f7f7f7 4px, #f7f7f7 8px);
            border-color: #ddd; color: #bbb; cursor: not-allowed;
        }
        /* Badge "🌐 Đặt online" (vé nguon='khach_tu_dat', xem SPEC "dat-ve.html") — chấm nhỏ góc
           trên-phải icon giường, không chiếm chỗ layout (position:absolute trên .giuong-icon vốn
           đã position:relative qua flex container cha... nên gán relative trực tiếp ở đây). */
        .giuong-icon { position: relative; }
        .giuong-icon .badge-online {
            position: absolute; top: -5px; right: -5px; font-size: 10px; line-height: 1;
            background: #fff; border-radius: 50%; width: 14px; height: 14px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 0 1.5px var(--white);
        }
        .ve-modal, .diemkhach-modal {
            display: none; position: fixed; inset: 0; z-index: 1000; align-items: flex-end; justify-content: center;
        }
        .ve-modal.open, .diemkhach-modal.open { display: flex; }
        .ve-modal-backdrop, .diemkhach-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
        .ve-modal-card, .diemkhach-modal-card {
            position: relative; width: 100%; max-width: 480px; background: var(--white);
            border-radius: var(--radius) var(--radius) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
            max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow);
        }
        .ve-modal-card h3, .diemkhach-modal-card h3 { margin: 0 0 14px; font-size: 17px; }
        .ve-modal-card label, .diemkhach-modal-card label { display: block; font-size: 13px; color: var(--text-muted); margin: 12px 0 4px; }
        .ve-modal-card input, .ve-modal-card select, .diemkhach-modal-card input, .diemkhach-modal-card select {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 16px; font-family: inherit; box-sizing: border-box;
        }
        .diem-row { display: flex; gap: 8px; align-items: flex-end; }
        .diem-row select { flex: 1; }
        .btn-them-diem {
            flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--radius-sm);
            border: 1.5px solid var(--primary); background: var(--white); color: var(--primary);
            font-size: 20px; cursor: pointer; font-family: inherit;
        }
        .tien-chu { font-size: 12px; color: var(--text-muted); margin-top: 4px; min-height: 16px; }
        .ve-modal-actions, .diemkhach-modal-actions { display: flex; gap: 10px; margin-top: 18px; }
        .ve-modal-actions button, .diemkhach-modal-actions button {
            flex: 1; padding: 12px; border-radius: var(--radius-sm); border: none; font-size: 15px;
            font-weight: 600; cursor: pointer; font-family: inherit;
        }
        .btn-ve-luu { background: var(--primary); color: #fff; }
        .btn-ve-huy-ve { background: var(--danger); color: #fff; }
        .btn-ve-dong { background: var(--border); color: var(--text); }
        .btn-ve-luu:disabled { background: #90a4ae; cursor: not-allowed; }
        .ve-cancel-banner { background: #f8d7da; color: #721c24; border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; }

        /* Toggle Sơ đồ ⇄ Danh sách (2026-09-16) — cùng pattern segmented-control 2 nút như
           "Tầng dưới/Tầng trên" cũ, nhưng đây là toggle VIEW (2 khối UI riêng #view-so-do/
           #view-danh-sach), không phải toggle tầng. Chuyển view chỉ ẩn/hiện, không fetch lại —
           cả 2 khối đọc chung veMap/giuongMap/diemKhachList đã tải cho chuyến đang chọn. */
        .view-toggle { display: flex; gap: 6px; padding: 8px 16px 6px; max-width: 260px; margin: 0 auto; }
        .view-tab {
            flex: 1; padding: 7px 0; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
            background: var(--white); color: var(--text); font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        .view-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .ve-list-empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 32px 16px; }
        .ve-list-wrap { margin: 0 16px 16px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: var(--white); }
        .ve-row { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .ve-row:last-child { border-bottom: none; }
        .ve-row-ten { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
        .ve-row-giuong { font-size: 12px; color: var(--primary); font-weight: 700; flex-shrink: 0; }
        .ve-row .mota { color: var(--text-muted); font-size: 13px; margin-top: 3px; }
        .ve-row-actions { display: flex; gap: 8px; margin-top: 10px; }
        .ve-row-btn {
            flex: 1; padding: 9px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
            background: var(--white); color: var(--text); font-size: 13px; font-weight: 600;
            cursor: pointer; font-family: inherit;
        }
        .ve-row-btn.danger { border-color: var(--danger); color: var(--danger); }
        .ve-row-btn.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
        .ve-row-edit-label { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
        .ve-row input, .ve-row select {
            width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; font-family: inherit; box-sizing: border-box; margin-bottom: 8px;
        }
        /* Bảng giá theo tỉnh (2026-09-19) — modal bottom-sheet cùng pattern .ve-modal/
           .diemkhach-modal ở trên (list 17 tỉnh, mỗi dòng 1 ô nhập nghìn đồng + chữ đọc số, 1 nút
           Lưu duy nhất cho cả bảng — xem CLAUDE.md). */
        .gia-tinh-modal {
            display: none; position: fixed; inset: 0; z-index: 1000; align-items: flex-end; justify-content: center;
        }
        .gia-tinh-modal.open { display: flex; }
        .gia-tinh-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
        .gia-tinh-modal-card {
            position: relative; width: 100%; max-width: 480px; background: var(--white);
            border-radius: var(--radius) var(--radius) 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
            max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow);
        }
        .gia-tinh-modal-card h3 { margin: 0 0 14px; font-size: 17px; }
        .gia-tinh-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
        .gia-tinh-row:last-of-type { border-bottom: none; }
        .gia-tinh-row-ten { font-weight: 600; margin-bottom: 6px; }
        .gia-tinh-row input {
            width: 100%; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 16px; font-family: inherit; box-sizing: border-box;
        }
        .gia-tinh-modal-actions { display: flex; gap: 10px; margin-top: 18px; position: sticky; bottom: 0; background: var(--white); padding-top: 8px; }
        .btn-gia-tinh-mo {
            display: block; margin: 8px 16px 0; padding: 9px; width: calc(100% - 32px);
            border: 1.5px solid var(--primary); border-radius: var(--radius-sm); background: var(--white);
            color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">💺 Hành khách</span>
        </h2>
        <div></div>
    </div>

    <div class="chuyen-select-wrap">
        <select id="chuyen-select" style="width:100%; padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:#1a1a2e;background:white"></select>
    </div>

    <div class="doanhthu-ve-summary" id="doanhthu-ve-summary"></div>

    <button type="button" class="btn-gia-tinh-mo" id="btn-gia-tinh-mo">💰 Giá vé theo tỉnh</button>

    <div class="view-toggle">
        <button type="button" class="view-tab active" id="tab-view-so-do">🗺️ Sơ đồ</button>
        <button type="button" class="view-tab" id="tab-view-danh-sach">📋 Danh sách</button>
    </div>

    <div id="view-so-do">
        <div class="chu-thich-giuong">
            <div class="chu-thich-item">
                <svg viewBox="0 0 40 64" width="16" height="24" style="color:var(--text-muted)"><rect x="3" y="3" width="34" height="58" rx="10" fill="none" stroke="currentColor" stroke-width="4"></rect><rect x="11" y="41" width="18" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="4"></rect></svg>
                Trống
            </div>
            <div class="chu-thich-item">
                <svg viewBox="0 0 40 64" width="16" height="24" style="color:#fff"><rect x="3" y="3" width="34" height="58" rx="10" fill="var(--primary)" stroke="var(--primary)" stroke-width="4"></rect><rect x="11" y="41" width="18" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="4"></rect></svg>
                Đang chọn
            </div>
            <div class="chu-thich-item">
                <svg viewBox="0 0 40 64" width="16" height="24" style="color:var(--success)"><rect x="3" y="3" width="34" height="58" rx="10" fill="var(--success-light)" stroke="var(--success)" stroke-width="4"></rect><rect x="11" y="41" width="18" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="4"></rect></svg>
                Đã đặt
            </div>
            <div class="chu-thich-item">
                <svg viewBox="0 0 40 64" width="16" height="24" style="color:#bbb"><rect x="3" y="3" width="34" height="58" rx="10" fill="#eee" stroke="#ddd" stroke-width="4"></rect><rect x="11" y="41" width="18" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="4"></rect></svg>
                Ngưng phục vụ
            </div>
        </div>

        <div class="tang-cols">
            <div class="tang-col">
                <div class="tang-title">Tầng dưới</div>
                <div class="availability-caption" id="availability-caption-1"></div>
                <div class="driver-icon" id="driver-icon">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <circle cx="20" cy="20" r="19" fill="#9aa3af"/>
                        <circle cx="20" cy="20" r="12" fill="none" stroke="#ffffff" stroke-width="2.2"/>
                        <circle cx="20" cy="20" r="3" fill="#ffffff"/>
                        <line x1="20" y1="9" x2="20" y2="15" stroke="#ffffff" stroke-width="2.2"/>
                        <line x1="12" y1="26" x2="17" y2="22" stroke="#ffffff" stroke-width="2.2"/>
                        <line x1="28" y1="26" x2="23" y2="22" stroke="#ffffff" stroke-width="2.2"/>
                    </svg>
                </div>
                <div class="seat-grid-wrap" id="seat-grid-wrap-1"></div>
            </div>
            <div class="tang-col">
                <div class="tang-title">Tầng trên</div>
                <div class="availability-caption" id="availability-caption-2"></div>
                <div class="driver-icon hidden-visual">
                    <svg viewBox="0 0 40 40" width="36" height="36">
                        <circle cx="20" cy="20" r="19" fill="#9aa3af"/>
                        <circle cx="20" cy="20" r="12" fill="none" stroke="#ffffff" stroke-width="2.2"/>
                        <circle cx="20" cy="20" r="3" fill="#ffffff"/>
                        <line x1="20" y1="9" x2="20" y2="15" stroke="#ffffff" stroke-width="2.2"/>
                        <line x1="12" y1="26" x2="17" y2="22" stroke="#ffffff" stroke-width="2.2"/>
                        <line x1="28" y1="26" x2="23" y2="22" stroke="#ffffff" stroke-width="2.2"/>
                    </svg>
                </div>
                <div class="seat-grid-wrap" id="seat-grid-wrap-2"></div>
            </div>
        </div>
    </div>

    <div id="view-danh-sach" style="display:none;">
        <div class="ve-list-empty" id="ve-list-empty" style="display:none;">Chưa có vé nào cho chuyến này.</div>
        <div class="ve-list-wrap" id="ve-list-wrap"></div>
    </div>

    <div class="ve-modal" id="ve-modal">
        <div class="ve-modal-backdrop"></div>
        <div class="ve-modal-card">
            <h3 id="ve-modal-title">Đặt giường</h3>
            <div id="ve-form-section">
                <label>Tên khách</label>
                <input type="text" id="ve-ten-khach" placeholder="Tên khách">
                <label>SĐT khách</label>
                <input type="tel" id="ve-sdt-khach" placeholder="SĐT khách">
                <label>Điểm lên</label>
                <div class="diem-row">
                    <select id="ve-diem-len"><option value="">— Chọn điểm lên —</option></select>
                    <button type="button" class="btn-them-diem" id="btn-them-diem-len">+</button>
                </div>
                <label>Điểm xuống</label>
                <div class="diem-row">
                    <select id="ve-diem-xuong"><option value="">— Chọn điểm xuống —</option></select>
                    <button type="button" class="btn-them-diem" id="btn-them-diem-xuong">+</button>
                </div>
                <label>Giá vé (nhập theo nghìn đồng, vd 200 = 200.000đ)</label>
                <input type="number" inputmode="numeric" id="ve-gia" placeholder="vd 200">
                <div class="tien-chu" id="ve-gia-chu"></div>
                <div class="ve-modal-actions">
                    <button type="button" class="btn-ve-dong" id="btn-ve-dong">Đóng</button>
                    <button type="button" class="btn-ve-huy-ve" id="btn-ve-huy-ve" style="display:none;">Huỷ vé</button>
                    <button type="button" class="btn-ve-luu" id="btn-ve-luu">Lưu</button>
                </div>
            </div>
            <div id="ve-cancel-section" style="display:none;">
                <div class="ve-cancel-banner" id="ve-cancel-banner-text"></div>
                <div class="ve-modal-actions">
                    <button type="button" class="btn-ve-dong" id="btn-ve-cancel-back">Không</button>
                    <button type="button" class="btn-ve-huy-ve" id="btn-ve-cancel-confirm">Xác nhận huỷ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="diemkhach-modal" id="diemkhach-modal">
        <div class="diemkhach-modal-backdrop"></div>
        <div class="diemkhach-modal-card">
            <h3>Thêm điểm đón/trả mới</h3>
            <label>Tên điểm</label>
            <input type="text" id="diemkhach-ten" placeholder="vd Bến xe Hải Dương">
            <label>Tỉnh</label>
            <select id="diemkhach-tinh"></select>
            <div class="diemkhach-modal-actions">
                <button type="button" class="btn-ve-dong" id="btn-diemkhach-dong">Đóng</button>
                <button type="button" class="btn-ve-luu" id="btn-diemkhach-luu">Lưu</button>
            </div>
        </div>
    </div>

    <div class="gia-tinh-modal" id="gia-tinh-modal">
        <div class="gia-tinh-modal-backdrop"></div>
        <div class="gia-tinh-modal-card">
            <h3>💰 Giá vé theo tỉnh</h3>
            <div id="gia-tinh-list"></div>
            <div class="gia-tinh-modal-actions">
                <button type="button" class="btn-ve-dong" id="btn-gia-tinh-dong">Đóng</button>
                <button type="button" class="btn-ve-luu" id="btn-gia-tinh-luu">💾 Lưu bảng giá</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script>
        const sb = createSb()
        let currentNhaXeId = null  // resolveNhaXeId(sb, user.id) — xem CLAUDE.md mục "Multi-tenant"
        let chuyenList = []
        let giuongList = []
        let giuongMap = new Map()      // giuong.id -> giuong {tang,hang,vi_tri,ma} — tra cứu O(1) cho Danh sách
        let tinhList = []
        let diemKhachList = []
        let veMap = new Map()          // giuong_id -> vé 'da_dat' hiện tại của chuyến đang chọn
        let currentChuyen = null
        let editingVeId = null         // null = đang tạo vé mới; có giá trị = đang sửa vé đó
        let selectedGiuongId = null    // giường đang mở form (dùng cả cho highlight "Đang chọn")
        let diemKhachTarget = null     // 'len' | 'xuong' — select nào sẽ nhận điểm vừa thêm
        let currentView = 'so_do'      // 'so_do' | 'danh_sach' — toggle 2 khối UI, dùng chung veMap/giuongMap

        // SVG icon giường dùng chung cho mọi ô — khung viền + gối, cả 2 nét đều stroke=currentColor
        // để màu đổi theo CSS `color` của .giuong-icon (trống/đã đặt/đang chọn), không cần build
        // lại markup theo từng trạng thái.
        const SEAT_SVG = '<svg viewBox="0 0 40 64" width="60%" style="display:block"><rect x="3" y="3" width="34" height="58" rx="10" fill="none" stroke="currentColor" stroke-width="3"></rect><rect x="11" y="41" width="18" height="9" rx="4.5" fill="none" stroke="currentColor" stroke-width="3"></rect></svg>'

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        async function loadGiuongList() {
            const { data, error } = await sb.from('giuong').select('id, tang, hang, vi_tri, ma, hoat_dong').eq('nha_xe_id', currentNhaXeId).order('tang').order('hang').order('vi_tri')
            if (error) { showToast('Lỗi tải sơ đồ giường: ' + error.message, 'error'); return }
            giuongList = data || []
            giuongMap = new Map(giuongList.map(g => [g.id, g]))
        }

        async function loadTinhList() {
            // tuyen_tinh(nha_xe_id, tinh_ma FK -> tinh, thu_tu, gia_moc) join tinh(ma, ten) — thay
            // tinh_tuyen (bảng cũ, đơn-tenant) từ Giai đoạn 4 multi-tenant. gia_moc — mốc giá theo
            // tỉnh (đồng, nullable), dùng tính giá vé = |mốc đến − mốc đi| ở dat-ve.html — xem SPEC
            // "Bảng giá theo tỉnh" trong CLAUDE.md. Sửa qua modal #gia-tinh-modal bên dưới, KHÔNG có
            // UI riêng ở hang.html/manifest-hang.html.
            const { data, error } = await sb.from('tuyen_tinh').select('tinh_ma, thu_tu, gia_moc, tinh:tinh_ma(ma, ten)').eq('nha_xe_id', currentNhaXeId).order('thu_tu')
            if (error) { showToast('Lỗi tải tỉnh: ' + error.message, 'error'); return }
            tinhList = (data || []).map(r => ({ ma: r.tinh_ma, ten: r.tinh.ten, thu_tu: r.thu_tu, gia_moc: r.gia_moc }))
        }

        async function loadDiemKhachList() {
            const { data, error } = await sb.from('diem_khach').select('id, ten, tinh_ma, thu_tu').eq('nha_xe_id', currentNhaXeId)
            if (error) { showToast('Lỗi tải điểm đón: ' + error.message, 'error'); return }
            diemKhachList = data || []
        }

        // Sắp điểm đón theo thứ tự tuyến (tinh_tuyen.thu_tu), đảo chiều theo chuyen.chieu — cùng
        // quy ước với sapXepTrongTinh bên hàng hoá (bac = ASC, nam = DESC).
        function renderDiemKhachOptions(selectEl, chieu, selectedId) {
            const thuTuMap = new Map(tinhList.map(t => [t.ma, t.thu_tu]))
            const sorted = [...diemKhachList].sort((a, b) => {
                const ta = thuTuMap.get(a.tinh_ma) ?? 0
                const tb = thuTuMap.get(b.tinh_ma) ?? 0
                const d = chieu === 'nam' ? tb - ta : ta - tb
                if (d !== 0) return d
                return (a.thu_tu ?? 999) - (b.thu_tu ?? 999) || a.ten.localeCompare(b.ten, 'vi')
            })
            selectEl.textContent = ''
            const optEmpty = document.createElement('option')
            optEmpty.value = ''
            optEmpty.textContent = '— Chọn điểm —'
            selectEl.appendChild(optEmpty)
            sorted.forEach(d => {
                const tinh = tinhList.find(t => t.ma === d.tinh_ma)
                const opt = document.createElement('option')
                opt.value = d.id
                opt.textContent = `${d.ten}${tinh ? ' — ' + tinh.ten : ''}`
                selectEl.appendChild(opt)
            })
            selectEl.value = selectedId || ''
        }

        // Vẽ 1 tầng vào đúng wrap/caption của nó — gọi 2 lần (dưới in tầng 1, trên in tầng 2)
        // để cả 2 tầng luôn hiện cùng lúc (2026-09-16, đảo ngược layout "1 tầng/lượt qua tab" của
        // 2026-09-15). "Đang chọn" (selectedGiuongId) là trạng thái tạm trong lúc form đang mở
        // cho đúng giường đó — mất khi đóng modal (xem closeVeModal), không phụ thuộc tầng nào.
        function renderMotTang(tang, wrapId, captionId) {
            const wrap = document.getElementById(wrapId)
            wrap.textContent = ''
            const giuongTang = giuongList.filter(g => g.tang === tang)
            const soHang = Math.max(0, ...giuongTang.map(g => g.hang))
            for (let hang = 1; hang <= soHang; hang++) {
                const giuongHang = giuongTang.filter(g => g.hang === hang).sort((a, b) => a.vi_tri - b.vi_tri)
                const row = document.createElement('div')
                row.className = 'giuong-hang'
                // Số cột = vi_tri LỚN NHẤT trong hàng (không phải số giường thực tế) — mỗi giường
                // đặt đúng ô grid-column = vi_tri của nó, để hàng có khoảng trống thật (vd hàng 6:
                // giường ở vi_tri 1 và 3, KHÔNG có vi_tri 2 — lối cầu thang, 2026-09-15) hiện đúng
                // ô trống ở giữa thay vì 2 giường bị dồn sát nhau. Hàng bình thường/không có
                // khoảng trống (vi_tri liên tục 1..N) thì hành vi y hệt trước (cột = số giường).
                // Cột dùng cỡ CỐ ĐỊNH (--seat-cell) + justify-content:center thay vì 1fr — 1fr
                // khiến icon co giãn khác nhau giữa hàng 3 ghế và hàng 5 ghế (hàng cuối), làm 2
                // tầng nhìn lệch nhau dù cùng bố cục; cố định cỡ thì mọi hàng tự thẳng hàng.
                const soCot = Math.max(...giuongHang.map(g => g.vi_tri))
                row.style.gridTemplateColumns = `repeat(${soCot}, var(--seat-cell, 28px))`
                giuongHang.forEach(g => {
                    const ve = veMap.get(g.id)
                    const dangChon = selectedGiuongId === g.id
                    // Mã giường (g.ma, vd "T1-05") không còn hiện trên mặt icon — chỉ ở tiêu đề
                    // form lúc tap vào (xem openVeModal), giữ qua title (tooltip) để vẫn đối
                    // chiếu được nếu cần mà không hover được trên mobile.
                    const btn = document.createElement('button')
                    btn.type = 'button'
                    btn.className = 'giuong-icon' + (!g.hoat_dong ? ' offline' : dangChon ? ' dang-chon' : ve ? ' da-dat' : '')
                    btn.dataset.giuongId = g.id
                    btn.style.gridColumn = String(g.vi_tri)
                    btn.title = !g.hoat_dong ? `Giường ${g.ma} — Ngưng phục vụ`
                        : ve ? `Giường ${g.ma} — ${ve.ten_khach || '(chưa có tên)'}${ve.sdt_khach ? ' — ' + ve.sdt_khach : ''}${ve.nguon === 'khach_tu_dat' ? ' — 🌐 Đặt online' : ''}` : `Giường ${g.ma} — còn trống`
                    btn.innerHTML = SEAT_SVG + (ve?.nguon === 'khach_tu_dat' ? '<span class="badge-online">🌐</span>' : '')
                    btn.addEventListener('click', () => openVeModal(g))
                    row.appendChild(btn)
                })
                wrap.appendChild(row)
            }

            // Giường hoat_dong=false (vd hỏng/ngưng bán) KHÔNG tính vào "trống" lẫn "đã đặt" —
            // loại hẳn khỏi mẫu số availability của tầng, xem thêm bullet "Ngưng phục vụ 1 giường"
            // ở CLAUDE.md.
            const giuongBanDuoc = giuongTang.filter(g => g.hoat_dong)
            const daDatTang = giuongBanDuoc.filter(g => veMap.has(g.id)).length
            document.getElementById(captionId).textContent =
                `${giuongBanDuoc.length - daDatTang} giường trống · ${daDatTang} đã đặt`
        }

        function renderGiuongGrid() {
            renderMotTang(1, 'seat-grid-wrap-1', 'availability-caption-1')
            renderMotTang(2, 'seat-grid-wrap-2', 'availability-caption-2')
        }

        function renderDoanhThuVe(veList) {
            const el = document.getElementById('doanhthu-ve-summary')
            const daDat = veList.filter(v => v.trang_thai === 'da_dat')
            const tong = daDat.reduce((s, v) => s + Number(v.gia || 0), 0)
            // Mẫu số = số giường đang bán được (loại giường hoat_dong=false), KHÔNG cố định 44 —
            // xem bullet "Ngưng phục vụ 1 giường" ở CLAUDE.md.
            const tongGiuongBanDuoc = giuongList.filter(g => g.hoat_dong).length
            el.style.display = 'block'
            el.textContent = `💺 ${daDat.length}/${tongGiuongBanDuoc} khách — Tổng doanh thu vé: ${formatMoney(tong)}`
        }

        async function loadVeChoChuyen(chuyen) {
            const { data, error } = await sb.from('ve')
                .select('id, chuyen_id, giuong_id, diem_len_id, diem_xuong_id, ten_khach, sdt_khach, gia, trang_thai, ghi_chu, nguon, hinh_thuc_thanh_toan')
                .eq('chuyen_id', chuyen.id)
                .neq('trang_thai', 'huy')
            if (error) { showToast('Lỗi tải vé: ' + error.message, 'error'); return }
            veMap = new Map((data || []).map(v => [v.giuong_id, v]))
            renderDoanhThuVe(data || [])
            renderGiuongGrid()
            renderDanhSachVe()
        }

        async function loadChuyenOptions() {
            const { data, error } = await sb.from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .eq('nha_xe_id', currentNhaXeId)
                .order('created_at', { ascending: false })
                .limit(50)
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            chuyenList = data || []
            const sel = document.getElementById('chuyen-select')
            sel.textContent = ''
            if (!chuyenList.length) {
                sel.innerHTML = '<option value="">Chưa có chuyến nào</option>'
                document.getElementById('doanhthu-ve-summary').style.display = 'none'
                return
            }
            chuyenList.forEach(c => {
                const chieuLabel = c.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
                const opt = document.createElement('option')
                opt.value = c.id
                opt.textContent = `${chieuLabel} — ${formatDate(c.khoi_hanh)}${c.trang_thai === 'xong' ? ' (đã xong)' : ''}`
                sel.appendChild(opt)
            })
            const preselectId = new URLSearchParams(location.search).get('chuyen_id')
            const preselect = preselectId && chuyenList.find(c => c.id === preselectId)
            const initial = preselect || chuyenList[0]
            sel.value = initial.id
            currentChuyen = initial
            await loadVeChoChuyen(initial)
        }

        document.getElementById('chuyen-select').addEventListener('change', e => {
            const chuyen = chuyenList.find(c => c.id === e.target.value)
            if (chuyen) { currentChuyen = chuyen; loadVeChoChuyen(chuyen) }
        })

        // === Toggle Sơ đồ ⇄ Danh sách ===
        function capNhatView() {
            document.getElementById('tab-view-so-do').classList.toggle('active', currentView === 'so_do')
            document.getElementById('tab-view-danh-sach').classList.toggle('active', currentView === 'danh_sach')
            document.getElementById('view-so-do').style.display = currentView === 'so_do' ? '' : 'none'
            document.getElementById('view-danh-sach').style.display = currentView === 'danh_sach' ? '' : 'none'
        }
        document.getElementById('tab-view-so-do').addEventListener('click', () => { currentView = 'so_do'; capNhatView() })
        document.getElementById('tab-view-danh-sach').addEventListener('click', () => { currentView = 'danh_sach'; capNhatView() })

        // === Danh sách vé (view thay thế cho Sơ đồ, đọc CHUNG veMap/giuongMap/diemKhachList —
        // không fetch riêng, không có state riêng) ===
        function nhanGiuong(giuong) {
            if (!giuong) return '(?)'
            return giuong.ma || `Tầng ${giuong.tang} · Hàng ${giuong.hang} · VT ${giuong.vi_tri}`
        }
        function tenDiemKhach(id) {
            if (!id) return '—'
            const d = diemKhachList.find(x => x.id === id)
            if (!d) return '—'
            const tinh = tinhList.find(t => t.ma === d.tinh_ma)
            return `${d.ten}${tinh ? ' — ' + tinh.ten : ''}`
        }

        // Chỉ hiện vé 'da_dat' — veMap vốn chỉ chứa vé 'da_dat' (query nguồn ở loadVeChoChuyen
        // đã .neq('trang_thai', 'huy')) nhưng lọc lại ở đây cho rõ ý, phòng sau này veMap đổi
        // cách nạp mà quên sửa chỗ này. Sắp theo tầng/hàng/vị trí VẬT LÝ trên xe (không phải
        // thời gian đặt) để crew dễ đối chiếu lúc điểm danh lên xe.
        function renderDanhSachVe() {
            const wrap = document.getElementById('ve-list-wrap')
            const emptyEl = document.getElementById('ve-list-empty')
            wrap.textContent = ''
            const list = [...veMap.values()].filter(v => v.trang_thai === 'da_dat')
            if (!list.length) {
                emptyEl.style.display = 'block'
                wrap.style.display = 'none'
                return
            }
            emptyEl.style.display = 'none'
            wrap.style.display = 'block'
            list.sort((a, b) => {
                const ga = giuongMap.get(a.giuong_id), gb = giuongMap.get(b.giuong_id)
                if (!ga || !gb) return 0
                return (ga.tang - gb.tang) || (ga.hang - gb.hang) || (ga.vi_tri - gb.vi_tri)
            })
            list.forEach(ve => {
                const row = document.createElement('div')
                row.className = 've-row'
                renderVeRowView(row, ve)
                wrap.appendChild(row)
            })
        }

        function renderVeRowView(row, ve) {
            const giuong = giuongMap.get(ve.giuong_id)
            row.innerHTML = `
                <div class="ve-row-ten">
                    <span>${ve.ten_khach || '(chưa có tên)'}${ve.nguon === 'khach_tu_dat' ? ' <span title="Đặt online">🌐</span>' : ''}</span>
                    <span class="ve-row-giuong">${nhanGiuong(giuong)}</span>
                </div>
                <div class="mota">${ve.sdt_khach || '(chưa có SĐT)'}</div>
                <div class="mota">${tenDiemKhach(ve.diem_len_id)} → ${tenDiemKhach(ve.diem_xuong_id)}</div>
                <div class="mota">${ve.gia != null ? formatMoney(ve.gia) : '(chưa có giá)'}</div>
                ${ve.nguon === 'khach_tu_dat' ? `<div class="mota">🌐 Đặt online${ve.hinh_thuc_thanh_toan === 'chuyen_khoan_truoc' ? ' — Chuyển khoản trước (cần đối chiếu)' : ve.hinh_thuc_thanh_toan === 'tien_mat_len_xe' ? ' — Tiền mặt lúc lên xe' : ''}</div>` : ''}
                <div class="ve-row-actions">
                    <button type="button" class="ve-row-btn ve-row-sua">Sửa</button>
                    <button type="button" class="ve-row-btn danger ve-row-huy">Huỷ vé</button>
                </div>
            `
            row.querySelector('.ve-row-sua').addEventListener('click', () => renderVeRowEdit(row, ve))
            row.querySelector('.ve-row-huy').addEventListener('click', () => huyVeODanhSach(row, ve))
        }

        function renderVeRowEdit(row, ve) {
            const giuong = giuongMap.get(ve.giuong_id)
            row.innerHTML = `
                <div class="ve-row-edit-label">${nhanGiuong(giuong)}</div>
                <input type="text" class="edit-ten" placeholder="Tên khách" value="${ve.ten_khach || ''}">
                <input type="tel" class="edit-sdt" placeholder="SĐT khách" value="${ve.sdt_khach || ''}">
                <select class="edit-diem-len"></select>
                <select class="edit-diem-xuong"></select>
                <input type="number" inputmode="numeric" class="edit-gia" placeholder="vd 200 = 200.000đ" value="${ve.gia != null ? ve.gia / 1000 : ''}">
                <div class="tien-chu edit-gia-chu"></div>
                <div class="ve-row-actions">
                    <button type="button" class="ve-row-btn ve-row-huy-sua">Hủy sửa</button>
                    <button type="button" class="ve-row-btn primary ve-row-luu">Lưu</button>
                </div>
            `
            renderDiemKhachOptions(row.querySelector('.edit-diem-len'), currentChuyen?.chieu, ve.diem_len_id)
            renderDiemKhachOptions(row.querySelector('.edit-diem-xuong'), currentChuyen?.chieu, ve.diem_xuong_id)
            const giaInput = row.querySelector('.edit-gia')
            const giaChuEl = row.querySelector('.edit-gia-chu')
            function capNhatGiaChuRow() {
                const raw = giaInput.value.trim()
                const so = raw === '' ? null : Number(raw) * 1000
                giaChuEl.textContent = so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
            }
            giaInput.addEventListener('input', capNhatGiaChuRow)
            capNhatGiaChuRow()
            row.querySelector('.ve-row-huy-sua').addEventListener('click', () => renderVeRowView(row, ve))
            row.querySelector('.ve-row-luu').addEventListener('click', async () => {
                const tenKhach = row.querySelector('.edit-ten').value.trim() || null
                const sdtKhach = row.querySelector('.edit-sdt').value.trim() || null
                const diemLenId = row.querySelector('.edit-diem-len').value || null
                const diemXuongId = row.querySelector('.edit-diem-xuong').value || null
                const giaRaw = giaInput.value.trim()
                const gia = giaRaw === '' ? null : Number(giaRaw) * 1000
                if (gia !== null && (!Number.isFinite(gia) || gia < 0)) { showToast('Giá vé không hợp lệ', 'error'); return }
                const { error } = await sb.from('ve').update({
                    ten_khach: tenKhach, sdt_khach: sdtKhach,
                    diem_len_id: diemLenId, diem_xuong_id: diemXuongId, gia
                }).eq('id', ve.id)
                if (error) { showToast('Lỗi lưu vé: ' + error.message, 'error'); return }
                Object.assign(ve, { ten_khach: tenKhach, sdt_khach: sdtKhach, diem_len_id: diemLenId, diem_xuong_id: diemXuongId, gia })
                veMap.set(ve.giuong_id, ve)
                renderVeRowView(row, ve)
                renderDoanhThuVe([...veMap.values()])
                renderGiuongGrid()
                showToast('Đã lưu vé', 'success')
            })
        }

        // confirmDialog() (không phải banner-trong-modal như ở Sơ đồ) — đây KHÔNG phải 2 lớp
        // modal chồng nhau (danh sách là 1 trang thường, không phải modal), nên giữ đúng convention
        // chung của app: mọi hành động không hoàn tác được đều qua confirmDialog().
        async function huyVeODanhSach(row, ve) {
            const giuong = giuongMap.get(ve.giuong_id)
            const ok = await confirmDialog(
                `Huỷ vé giường ${nhanGiuong(giuong)} — ${ve.ten_khach || '(chưa có tên)'}? Giường sẽ trống lại để đặt cho khách khác.`,
                { danger: true, okText: 'Xác nhận huỷ' }
            )
            if (!ok) return
            const { error } = await sb.from('ve').update({ trang_thai: 'huy' }).eq('id', ve.id)
            if (error) { showToast('Lỗi huỷ vé: ' + error.message, 'error'); return }
            veMap.delete(ve.giuong_id)
            row.remove()
            renderDoanhThuVe([...veMap.values()])
            renderGiuongGrid()
            if (![...veMap.values()].some(v => v.trang_thai === 'da_dat')) {
                document.getElementById('ve-list-empty').style.display = 'block'
                document.getElementById('ve-list-wrap').style.display = 'none'
            }
            showToast('Đã huỷ vé', 'success')
        }

        // === Modal đặt/sửa/huỷ vé ===
        function capNhatGiaChu() {
            const raw = document.getElementById('ve-gia').value.trim()
            const el = document.getElementById('ve-gia-chu')
            const so = raw === '' ? null : Number(raw) * 1000
            el.textContent = so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
        }
        document.getElementById('ve-gia').addEventListener('input', capNhatGiaChu)

        // 2026-09-16: bỏ ràng buộc bắt buộc tên+SĐT lúc TẠO vé mới (theo yêu cầu) — nút "Lưu"
        // luôn bấm được kể cả thiếu tên/SĐT, không còn phân biệt tạo mới hay sửa vé đã có.
        function capNhatTrangThaiNutLuu() {
            document.getElementById('btn-ve-luu').disabled = false
        }
        document.getElementById('ve-ten-khach').addEventListener('input', capNhatTrangThaiNutLuu)
        document.getElementById('ve-sdt-khach').addEventListener('input', capNhatTrangThaiNutLuu)

        function openVeModal(giuong) {
            if (!currentChuyen) { showToast('Chưa chọn chuyến', 'error'); return }
            if (!giuong.hoat_dong) { showToast(`Giường ${giuong.ma} đang ngưng phục vụ`, 'error'); return }
            selectedGiuongId = giuong.id
            const ve = veMap.get(giuong.id)
            editingVeId = ve ? ve.id : null
            document.getElementById('ve-modal-title').textContent = ve
                ? `Giường ${giuong.ma} — ${ve.ten_khach || '(chưa có tên)'}${ve.nguon === 'khach_tu_dat' ? ' 🌐' : ''}`
                : `Đặt giường ${giuong.ma}`
            document.getElementById('ve-ten-khach').value = ve?.ten_khach || ''
            document.getElementById('ve-sdt-khach').value = ve?.sdt_khach || ''
            document.getElementById('ve-gia').value = ve?.gia != null ? ve.gia / 1000 : ''
            capNhatGiaChu()
            capNhatTrangThaiNutLuu()
            renderDiemKhachOptions(document.getElementById('ve-diem-len'), currentChuyen.chieu, ve?.diem_len_id)
            renderDiemKhachOptions(document.getElementById('ve-diem-xuong'), currentChuyen.chieu, ve?.diem_xuong_id)
            document.getElementById('btn-ve-huy-ve').style.display = ve ? 'block' : 'none'
            document.getElementById('ve-form-section').style.display = 'block'
            document.getElementById('ve-cancel-section').style.display = 'none'
            document.getElementById('ve-modal').classList.add('open')
            renderGiuongGrid()   // hiện highlight "Đang chọn" ngay trên giường vừa tap
        }
        function closeVeModal() {
            document.getElementById('ve-modal').classList.remove('open')
            editingVeId = null
            selectedGiuongId = null
            renderGiuongGrid()   // bỏ highlight "Đang chọn"
        }
        document.querySelector('#ve-modal .ve-modal-backdrop').addEventListener('click', closeVeModal)
        document.getElementById('btn-ve-dong').addEventListener('click', closeVeModal)

        document.getElementById('btn-ve-luu').addEventListener('click', async () => {
            const tenKhach = document.getElementById('ve-ten-khach').value.trim() || null
            const sdtKhach = document.getElementById('ve-sdt-khach').value.trim() || null
            const diemLenId = document.getElementById('ve-diem-len').value || null
            const diemXuongId = document.getElementById('ve-diem-xuong').value || null
            const giaRaw = document.getElementById('ve-gia').value.trim()
            const gia = giaRaw === '' ? null : Number(giaRaw) * 1000
            if (gia !== null && (!Number.isFinite(gia) || gia < 0)) { showToast('Giá vé không hợp lệ', 'error'); return }

            if (editingVeId) {
                const { error } = await sb.from('ve').update({
                    ten_khach: tenKhach, sdt_khach: sdtKhach,
                    diem_len_id: diemLenId, diem_xuong_id: diemXuongId, gia
                }).eq('id', editingVeId)
                if (error) { showToast('Lỗi lưu vé: ' + error.message, 'error'); return }
            } else {
                const { error } = await sb.from('ve').insert({
                    chuyen_id: currentChuyen.id, giuong_id: selectedGiuongId,
                    ten_khach: tenKhach, sdt_khach: sdtKhach,
                    diem_len_id: diemLenId, diem_xuong_id: diemXuongId, gia,
                    nha_xe_id: currentNhaXeId
                })
                if (error) {
                    // Trùng giường active (race condition 2 crew cùng bấm 1 giường gần như đồng thời)
                    if (error.code === '23505') showToast('Giường này vừa được đặt bởi thao tác khác — tải lại', 'error')
                    else showToast('Lỗi lưu vé: ' + error.message, 'error')
                    return
                }
            }
            showToast('Đã lưu vé', 'success')
            closeVeModal()
            loadVeChoChuyen(currentChuyen)
        })

        // Bước xác nhận huỷ nằm NGAY TRONG modal (banner đỏ + Không/Xác nhận huỷ), không dùng
        // confirmDialog() toàn cục — theo đúng mẫu design handoff (tránh chồng 2 lớp modal lên
        // nhau), khác các thao tác huỷ khác trong app (vẫn dùng confirmDialog chung).
        document.getElementById('btn-ve-huy-ve').addEventListener('click', () => {
            if (!editingVeId) return
            const giuong = giuongList.find(g => g.id === selectedGiuongId)
            document.getElementById('ve-cancel-banner-text').textContent =
                `Huỷ vé giường ${giuong?.ma || ''}? Giường sẽ trống lại để đặt cho khách khác.`
            document.getElementById('ve-form-section').style.display = 'none'
            document.getElementById('ve-cancel-section').style.display = 'block'
        })
        document.getElementById('btn-ve-cancel-back').addEventListener('click', () => {
            document.getElementById('ve-cancel-section').style.display = 'none'
            document.getElementById('ve-form-section').style.display = 'block'
        })
        document.getElementById('btn-ve-cancel-confirm').addEventListener('click', async () => {
            if (!editingVeId) return
            const { error } = await sb.from('ve').update({ trang_thai: 'huy' }).eq('id', editingVeId)
            if (error) { showToast('Lỗi huỷ vé: ' + error.message, 'error'); return }
            showToast('Đã huỷ vé', 'success')
            closeVeModal()
            loadVeChoChuyen(currentChuyen)
        })

        // === Modal thêm điểm đón/trả mới ===
        function renderDiemKhachTinhOptions() {
            const sel = document.getElementById('diemkhach-tinh')
            sel.textContent = ''
            tinhList.forEach(t => {
                const opt = document.createElement('option')
                opt.value = t.ma
                opt.textContent = t.ten
                sel.appendChild(opt)
            })
        }
        function openDiemKhachModal(target) {
            diemKhachTarget = target
            document.getElementById('diemkhach-ten').value = ''
            renderDiemKhachTinhOptions()
            document.getElementById('diemkhach-modal').classList.add('open')
        }
        function closeDiemKhachModal() {
            document.getElementById('diemkhach-modal').classList.remove('open')
            diemKhachTarget = null
        }
        document.getElementById('btn-them-diem-len').addEventListener('click', () => openDiemKhachModal('len'))
        document.getElementById('btn-them-diem-xuong').addEventListener('click', () => openDiemKhachModal('xuong'))
        document.querySelector('#diemkhach-modal .diemkhach-modal-backdrop').addEventListener('click', closeDiemKhachModal)
        document.getElementById('btn-diemkhach-dong').addEventListener('click', closeDiemKhachModal)

        document.getElementById('btn-diemkhach-luu').addEventListener('click', async () => {
            const ten = document.getElementById('diemkhach-ten').value.trim()
            const tinhMa = document.getElementById('diemkhach-tinh').value
            if (!ten) { showToast('Nhập tên điểm', 'error'); return }
            const { data, error } = await sb.from('diem_khach').insert({ ten, tinh_ma: tinhMa, nha_xe_id: currentNhaXeId }).select('id, ten, tinh_ma, thu_tu').single()
            if (error) { showToast('Lỗi thêm điểm: ' + error.message, 'error'); return }
            diemKhachList.push(data)
            const target = diemKhachTarget === 'len' ? document.getElementById('ve-diem-len') : document.getElementById('ve-diem-xuong')
            renderDiemKhachOptions(target, currentChuyen.chieu, data.id)
            showToast('Đã thêm điểm', 'success')
            closeDiemKhachModal()
        })

        // === Modal "Giá vé theo tỉnh" ===
        // 17 tỉnh (loại Khánh Hòa, xe không qua — cùng filter đã dùng ở hang.html's loadTinh()),
        // mỗi dòng 1 ô nhập giá theo NGHÌN ĐỒNG (cùng quy ước tien_thu/tien_thu_ho/ve.gia toàn
        // app) + chữ đọc số bên dưới, prefill giá trị hiện có. `giaTinhOriginal` chụp lại
        // gia_moc lúc MỞ modal (đồng, có thể null) để lúc Lưu chỉ UPDATE đúng dòng đã đổi giá trị.
        let giaTinhOriginal = new Map()
        function renderGiaTinhList() {
            const wrap = document.getElementById('gia-tinh-list')
            wrap.textContent = ''
            giaTinhOriginal = new Map()
            tinhList.filter(t => t.ma !== 'KHH').forEach(t => {
                giaTinhOriginal.set(t.ma, t.gia_moc ?? null)
                const row = document.createElement('div')
                row.className = 'gia-tinh-row'
                row.innerHTML = `
                    <div class="gia-tinh-row-ten">${t.ten}</div>
                    <input type="number" inputmode="numeric" class="gia-tinh-input" data-ma="${t.ma}"
                        placeholder="vd 550 = 550.000đ" value="${t.gia_moc != null ? t.gia_moc / 1000 : ''}">
                    <div class="tien-chu gia-tinh-chu"></div>
                `
                wrap.appendChild(row)
                const input = row.querySelector('.gia-tinh-input')
                const chuEl = row.querySelector('.gia-tinh-chu')
                const capNhatChu = () => {
                    const raw = input.value.trim()
                    const so = raw === '' ? null : Number(raw) * 1000
                    chuEl.textContent = so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
                }
                capNhatChu()
                input.addEventListener('input', capNhatChu)
            })
        }
        function openGiaTinhModal() {
            renderGiaTinhList()
            document.getElementById('gia-tinh-modal').classList.add('open')
        }
        function closeGiaTinhModal() {
            document.getElementById('gia-tinh-modal').classList.remove('open')
        }
        document.getElementById('btn-gia-tinh-mo').addEventListener('click', openGiaTinhModal)
        document.querySelector('#gia-tinh-modal .gia-tinh-modal-backdrop').addEventListener('click', closeGiaTinhModal)
        document.getElementById('btn-gia-tinh-dong').addEventListener('click', closeGiaTinhModal)

        // Chỉ đây là nơi DUY NHẤT ghi `tuyen_tinh.gia_moc` trong app (đổi từ `tinh_tuyen.gia_moc`
        // ở Giai đoạn 4 multi-tenant — gia_moc giờ RIÊNG từng nhà xe) — không phải hành động phá
        // huỷ (chỉ chỉnh cấu hình giá) nên KHÔNG dùng confirmDialog(), khác quy ước "Kết thúc
        // chuyến"/"Hủy đơn". Chỉ UPDATE các dòng có giá trị THAY ĐỔI so với `giaTinhOriginal` —
        // tránh ghi lại 17 dòng mỗi lần bấm Lưu dù phần lớn không đổi gì.
        document.getElementById('btn-gia-tinh-luu').addEventListener('click', async () => {
            const inputs = [...document.querySelectorAll('.gia-tinh-input')]
            const thayDoi = []
            for (const input of inputs) {
                const ma = input.dataset.ma
                const raw = input.value.trim()
                const giaMoi = raw === '' ? null : Number(raw) * 1000
                if (giaMoi !== null && (!Number.isFinite(giaMoi) || giaMoi < 0)) {
                    showToast(`Giá không hợp lệ: ${ma}`, 'error'); return
                }
                if (giaMoi !== (giaTinhOriginal.get(ma) ?? null)) thayDoi.push({ ma, giaMoi })
            }
            if (!thayDoi.length) { closeGiaTinhModal(); return }
            for (const { ma, giaMoi } of thayDoi) {
                const { error } = await sb.from('tuyen_tinh').update({ gia_moc: giaMoi }).eq('nha_xe_id', currentNhaXeId).eq('tinh_ma', ma)
                if (error) { showToast(`Lỗi lưu giá ${ma}: ${error.message}`, 'error'); return }
                const t = tinhList.find(x => x.ma === ma)
                if (t) t.gia_moc = giaMoi
            }
            showToast('Đã lưu bảng giá', 'success')
            closeGiaTinhModal()
        })

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            currentNhaXeId = await resolveNhaXeId(sb, auth.user.id)
            if (!currentNhaXeId) {
                showToast('Tài khoản chưa được gán vào nhà xe nào — liên hệ quản trị viên', 'error')
                return
            }
            // ?view=danh_sach — cho phép trang khác (vd link "Xem trong Danh sách →" ở
            // manifest-hang.html) mở thẳng tab Danh sách thay vì luôn về Sơ đồ mặc định, cùng
            // quy ước ?chuyen_id= đã có sẵn.
            if (new URLSearchParams(location.search).get('view') === 'danh_sach') {
                currentView = 'danh_sach'
                capNhatView()
            }
            await Promise.all([loadGiuongList(), loadTinhList(), loadDiemKhachList()])
            await loadChuyenOptions()
        }

        setupLogoutListener(sb)
        initPage()
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW register failed:', err))
            })
        }
    </script>
</body>
</html>
