<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Danh sách kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-select-wrap { padding: 16px; }
        .chuyen-select-wrap select#chuyen-select { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tinh-group { margin: 0 16px 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .tinh-group h3 { margin: 0; padding: 12px 16px; background: var(--bg); font-size: 16px; }
        .kien-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            border-top: 1px solid var(--border); font-size: 14px;
        }
        .kien-row.kien-row-da-giao { background: var(--success-light); }
        .kien-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: pointer; }
        .lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 1000; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; cursor: default; }
        .kien-row .info { flex: 1; min-width: 0; }
        .kien-row .diem { font-weight: 600; }
        .kien-row .so-luong { color: var(--primary); font-weight: 600; font-size: 13px; }
        .kien-row .mota { color: var(--text-muted); font-size: 13px; }
        .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
        .badge.chua_giao { background: #fdecea; color: var(--danger); }
        .badge.da_giao { background: #eafaf1; color: var(--success); }
        .kien-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .btn-sm {
            padding: 6px 10px; font-size: 12px; border-radius: 6px;
            border: 1.5px solid var(--border); background: var(--white); cursor: pointer; white-space: nowrap;
        }
        .btn-sm.btn-done { border-color: var(--success); color: var(--success); }
        .btn-sm.btn-undone { border-color: var(--text-muted); color: var(--text-muted); }
        .btn-sm.btn-save { border-color: var(--success); background: var(--success); color: #fff; }
        .btn-sm.btn-thu { border-color: var(--primary); color: var(--primary); }
        .btn-sm.btn-vitri { border-color: var(--text-muted); color: var(--text-muted); }
        /* Hành động chính (1 nút to, hay bấm nhất) + menu "⋯" gộp hành động phụ ít dùng —
           tránh nhồi nhiều nút cùng cỡ dễ bấm nhầm khi crew thao tác 1 tay trên xe rung lắc. */
        .btn-primary-action {
            padding: 10px 16px; min-height: 44px; font-size: 14px; font-weight: 600;
            border-radius: 8px; border: none; background: var(--success); color: #fff;
            cursor: pointer; white-space: nowrap;
        }
        .btn-menu-more {
            width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--white);
            font-size: 20px; line-height: 1; cursor: pointer; color: var(--text-muted);
        }
        /* position:fixed + toạ độ tính bằng JS (xem openKienMenu) thay vì absolute/top/right
           tương đối theo .kien-actions — .tinh-group cha có overflow:hidden (bo góc header)
           sẽ cắt mất menu nếu dùng absolute thông thường. */
        .kien-menu {
            display: none; position: fixed; z-index: 20;
            background: var(--white); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: var(--shadow); min-width: 150px; overflow: hidden;
        }
        .kien-menu.open { display: block; }
        .kien-menu button {
            display: block; width: 100%; text-align: left; padding: 12px 14px; min-height: 44px;
            border: none; background: none; font-size: 14px; cursor: pointer; color: var(--text);
            white-space: nowrap; font-family: inherit;
        }
        .kien-menu button:hover { background: var(--bg); }
        .mota.tien-thu { color: var(--success); font-weight: 600; }
        .mota.cod { color: var(--warning); font-weight: 600; }
        .cod-summary {
            display: none; margin: 0 16px 16px; padding: 12px 16px; border-radius: var(--radius-sm);
            background: #fdf3e5; border: 1.5px solid var(--warning); color: var(--warning);
            font-size: 14px; font-weight: 600;
        }
        .kien-row-edit input, .kien-row-edit textarea {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 16px; font-family: inherit;
        }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }

        /* Dưới 600px: img+info+badge dùng chung 1 hàng, nút hành động (kể cả nút chính +
           menu "⋯" của renderKienRowView, kể cả form Lưu/Hủy) luôn xuống hàng riêng chiếm
           hết chiều rộng — .info có flex:1 + min-width:0 nên nếu để kien-actions chung
           hàng với info, info sẽ bị bóp gần như bằng 0 thay vì tự xuống dòng (flex-wrap chỉ
           ngắt dòng theo từng flex-item, không cứu được item co giãn được), khiến tên
           điểm/SĐT/ghi chú vỡ chữ chồng chéo lên nhau. */
        @media (max-width: 600px) {
            .kien-row { flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; padding: 14px 16px; }
            .kien-row img { width: 56px; height: 56px; }
            .kien-actions { flex-basis: 100%; flex-wrap: wrap; gap: 8px; }
            .btn-primary-action { flex: 1; padding: 12px 14px; font-size: 15px; }
            .btn-menu-more { width: 48px; height: 48px; font-size: 22px; }
            .kien-row-edit .btn-sm { flex: 1 1 calc(50% - 4px); padding: 12px 8px; font-size: 14px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📋 Danh sách kiện hàng</span>
        </h2>
        <div></div>
    </div>

    <div class="chuyen-select-wrap">
        <select id="chuyen-select" style="width:100%; padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:#1a1a2e;background:white"></select>
    </div>

    <div class="cod-summary" id="cod-summary"></div>

    <div id="list-wrap"></div>

    <div style="padding:8px 16px 16px;">
        <button id="btn-ket-thuc-chuyen" type="button" class="btn-sm btn-undone" style="display:none; width:100%; padding:12px 14px; font-size:14px;">🏁 Kết thúc chuyến</button>
    </div>

    <div class="toast" id="toast"></div>
    <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script src="km-moc.js"></script>
    <script>
        const sb = createSb()
        let chuyenList = []
        let currentKienList = []   // kiện của chuyến đang chọn — dùng để bật/ẩn nút "Kết thúc chuyến" khi trạng thái giao đổi tại chỗ

        // Gọi lại sau mỗi lần đổi trạng thái 1 kiện tại chỗ (không reload cả manifest) để nút
        // "Kết thúc chuyến" cập nhật đúng ngay, không phải đợi F5/đổi chuyến.
        function refreshEndTripButton() {
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            updateEndTripButton(chuyen, currentKienList)
        }
        loadTuyenChuanData().catch(() => {}) // nạp trước để cache sẵn cho khi bấm "Đã giao"

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        // chuyen(id, chieu, khoi_hanh, trang_thai, ghi_chu, tao_boi, created_at)
        async function loadChuyenOptions() {
            const { data, error } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .order('created_at', { ascending: false })
                .limit(50)
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            chuyenList = data || []
            const sel = document.getElementById('chuyen-select')
            sel.textContent = ''
            if (!chuyenList.length) {
                sel.innerHTML = '<option value="">Chưa có chuyến nào</option>'
                document.getElementById('list-wrap').innerHTML = '<div class="empty">Chưa có chuyến nào</div>'
                return
            }
            chuyenList.forEach(c => {
                const chieuLabel = c.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
                const opt = document.createElement('option')
                opt.value = c.id
                opt.textContent = `${chieuLabel} — ${formatDate(c.khoi_hanh)}${c.trang_thai === 'xong' ? ' (đã xong)' : ''}`
                sel.appendChild(opt)
            })
            // Cho phép trang lịch-sử-chuyến điều hướng thẳng tới 1 chuyến cụ thể qua ?chuyen_id=
            const preselectId = new URLSearchParams(location.search).get('chuyen_id')
            const preselect = preselectId && chuyenList.find(c => c.id === preselectId)
            const initial = preselect || chuyenList[0]
            sel.value = initial.id
            loadManifest(initial)
        }

        document.getElementById('chuyen-select').addEventListener('change', e => {
            const chuyen = chuyenList.find(c => c.id === e.target.value)
            if (chuyen) loadManifest(chuyen)
        })

        // Chỉ hiện nút khi chuyến chưa xong VÀ không còn kiện nào ở trạng thái 'chua_giao' —
        // ép giao hết hàng rồi mới kết thúc được chuyến, tránh bấm nhầm khi còn hàng chưa
        // giao xong. `kienList` optional: khi gọi sớm lúc chưa kịp tải kiện thì ẩn nút, chờ
        // `loadManifest` gọi lại lần 2 kèm kienList thật.
        function updateEndTripButton(chuyen, kienList) {
            const btn = document.getElementById('btn-ket-thuc-chuyen')
            const daXongHet = kienList && kienList.every(k => k.trang_thai === 'da_giao')
            btn.style.display = chuyen && chuyen.trang_thai !== 'xong' && daXongHet ? 'block' : 'none'
        }

        document.getElementById('btn-ket-thuc-chuyen').addEventListener('click', async () => {
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (!chuyen) return
            if (!(await confirmDialog('Kết thúc chuyến này? Sẽ không thể nhập thêm kiện mới cho chuyến này ở trang "Nhập kiện" nữa.'))) return
            const { error } = await sb.from('chuyen').update({ trang_thai: 'xong' }).eq('id', chuyen.id)
            if (error) { showToast('Lỗi kết thúc chuyến: ' + error.message, 'error'); return }
            chuyen.trang_thai = 'xong'
            const opt = document.querySelector(`#chuyen-select option[value="${chuyen.id}"]`)
            if (opt) {
                const chieuLabel = chuyen.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
                opt.textContent = `${chieuLabel} — ${formatDate(chuyen.khoi_hanh)} (đã xong)`
            }
            updateEndTripButton(chuyen)
            showToast('Đã kết thúc chuyến', 'success')
        })

        // tinh_tuyen(ma PK, ten, thu_tu). diem(id, ten, tinh_ma). kien(id, chuyen_id, diem_id,
        // anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at).
        // Chiều bac = ASC thu_tu, nam = DESC thu_tu.
        async function loadManifest(chuyen) {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''
            updateEndTripButton(chuyen)   // ẩn nút trong lúc chờ tải kiện — bật lại đúng điều kiện bên dưới khi có kienList

            const { data: tinhList, error: tinhErr } = await sb
                .from('tinh_tuyen')
                .select('ma, ten, thu_tu')
                .order('thu_tu', { ascending: chuyen.chieu === 'bac' })
            if (tinhErr) { showToast('Lỗi tải tỉnh: ' + tinhErr.message, 'error'); return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('id, diem_id, anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, so_luong, loai_hang, tien_thu, hinh_thuc_thu, tien_thu_ho, created_at, diem(id, ten, tinh_ma, lat, lng, km_moc)')
                .eq('chuyen_id', chuyen.id)
                .neq('trang_thai', 'huy')
                .order('created_at', { ascending: true })
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }
            currentKienList = kienList
            updateEndTripButton(chuyen, kienList)

            // Dùng chung 1 object diem cho mọi kiện cùng diem_id — cập nhật 1 lần (vd sau khi
            // bắt GPS) thì mọi dòng kiện cùng điểm tự thấy giá trị mới ngay, tránh xin quyền
            // GPS lặp lại nhiều lần trong 1 phiên khi bấm "Đã giao" liên tiếp cùng 1 điểm.
            const diemMap = new Map()
            kienList.forEach(k => {
                if (!k.diem) return
                if (diemMap.has(k.diem_id)) k.diem = diemMap.get(k.diem_id)
                else diemMap.set(k.diem_id, k.diem)
            })

            renderCodSummary(kienList)

            let any = false
            tinhList.forEach(tinh => {
                const kiensCuaTinh = sapXepTrongTinh(kienList.filter(k => k.diem?.tinh_ma === tinh.ma), chuyen.chieu)
                if (!kiensCuaTinh.length) return
                any = true

                const group = document.createElement('div')
                group.className = 'tinh-group'
                const h3 = document.createElement('h3')
                h3.textContent = `${tinh.ten} (${kiensCuaTinh.length})`
                group.appendChild(h3)

                kiensCuaTinh.forEach(k => {
                    group.appendChild(createKienRow(k))
                })
                wrap.appendChild(group)
            })

            if (!any) wrap.innerHTML = '<div class="empty">Chuyến này chưa có kiện hàng nào</div>'
        }

        // Cảnh báo tổng tiền thu hộ (COD) của cả chuyến — kien.tien_thu_ho là số tiền người
        // gửi yêu cầu thu hộ khi giao, nhập lúc chụp ảnh ở hang.html. So với tien_thu (số tiền
        // thực thu, nhập lúc "Hoàn thành") để biết còn kiện nào thu hộ chưa thu đủ.
        function renderCodSummary(kienList) {
            const el = document.getElementById('cod-summary')
            const codKiens = kienList.filter(k => k.tien_thu_ho != null && k.tien_thu_ho > 0)
            const chuaThuDu = codKiens.filter(k => Number(k.tien_thu || 0) < Number(k.tien_thu_ho))
            // Chỉ cảnh báo khi còn kiện thu hộ chưa thu đủ — đã thu đủ hết thì tắt banner,
            // không còn gì để cảnh báo nữa.
            if (!chuaThuDu.length) { el.style.display = 'none'; return }
            const tongThuHo = codKiens.reduce((s, k) => s + Number(k.tien_thu_ho), 0)
            const tongDaThu = codKiens.reduce((s, k) => s + Number(k.tien_thu || 0), 0)
            el.style.display = 'block'
            el.textContent = `⚠️ ${codKiens.length} kiện thu hộ (COD) — cần thu ${formatMoney(tongThuHo)}, đã thu ${formatMoney(tongDaThu)}, còn ${chuaThuDu.length} kiện chưa thu đủ`
        }

        // kien(id, diem_id, anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at, diem(ten, tinh_ma))
        function createKienRow(k) {
            const row = document.createElement('div')
            row.className = 'kien-row'
            renderKienRowView(row, k)
            return row
        }

        // Đặt .kien-menu (position:fixed) ngay dưới nút "⋯" vừa bấm, neo theo mép phải —
        // tính bằng getBoundingClientRect() vì .tinh-group cha có overflow:hidden, dùng
        // absolute thông thường sẽ bị cắt mất phần menu tràn ra ngoài khung.
        function openKienMenu(btn, menu) {
            // Hiện trước rồi mới đo offsetWidth/offsetHeight thật — trên mobile nút "⋯" đứng
            // 1 mình (flex-start) thường nằm sát mép trái, nếu chỉ neo theo mép phải của nút
            // (không kẹp trong viewport) menu sẽ bị đẩy tràn ra ngoài mép trái màn hình, nhìn
            // như 1 khối trắng trống không có chữ (đã gặp thực tế trên điện thoại).
            menu.classList.add('open')
            const rect = btn.getBoundingClientRect()
            const margin = 8
            let left = rect.right - menu.offsetWidth
            left = Math.max(margin, Math.min(left, window.innerWidth - menu.offsetWidth - margin))
            // Dòng kiện cuối cùng của danh sách thường nằm sát đáy màn hình — nếu mở menu
            // xuống dưới như bình thường sẽ bị tràn khỏi viewport (chữ "Hủy giao" bị cắt nửa
            // dòng, cũng đã gặp thực tế). Không đủ chỗ phía dưới thì mở ngược lên trên nút.
            let top = rect.bottom + 4
            if (top + menu.offsetHeight > window.innerHeight - margin) {
                top = rect.top - menu.offsetHeight - 4
            }
            top = Math.max(margin, top)
            menu.style.left = left + 'px'
            menu.style.top = top + 'px'
        }

        // Mỗi dòng chỉ 1 hành động chính (to, dễ bấm 1 tay khi xe đang chạy) — hành động
        // phụ ít dùng hơn gộp vào menu "⋯" thay vì nhồi nhiều nút cùng cỡ dễ bấm nhầm.
        // Chưa giao: chính = "Hoàn thành", menu chỉ có "Sửa". Đã giao: không có hành động
        // gấp nào (mọi thao tác ở đây là sửa sai, tần suất thấp) nên chỉ còn menu, gộp cả
        // "Sửa" / "Hủy giao" / "Sửa tiền".
        function renderKienRowView(row, k) {
            row.classList.remove('kien-row-edit')
            const daGiao = k.trang_thai === 'da_giao'
            row.classList.toggle('kien-row-da-giao', daGiao)
            const coTien = k.tien_thu !== null && k.tien_thu !== undefined
            const thuTruocKhiGiao = coTien && !daGiao
            const coThuHo = k.tien_thu_ho != null && k.tien_thu_ho > 0
            const thuHoConThieu = coThuHo && Number(k.tien_thu || 0) < Number(k.tien_thu_ho)
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}${k.so_luong > 1 && !k.loai_hang ? ` <span class="so-luong">×${k.so_luong}</span>` : ''}</div>
                    ${k.loai_hang ? `<div class="mota">${k.loai_hang}</div>` : ''}
                    ${k.nguoi_nhan_sdt ? `<div class="mota">SĐT: ${k.nguoi_nhan_sdt}</div>` : ''}
                    ${k.ghi_chu ? `<div class="mota">${k.ghi_chu}</div>` : ''}
                    ${coThuHo ? `<div class="mota cod">💰 Thu hộ: ${formatMoney(k.tien_thu_ho)}${thuHoConThieu ? ' ⚠ chưa thu đủ' : ''}</div>` : ''}
                    ${coTien ? `<div class="mota tien-thu">${thuTruocKhiGiao ? '💵 Đã thu cước lúc gửi' : 'Đã thu'}: ${formatMoney(k.tien_thu)}${k.hinh_thuc_thu ? ` (${k.hinh_thuc_thu === 'tien_mat' ? 'Tiền mặt' : 'Chuyển khoản'})` : ''}</div>` : ''}
                </div>
                <span class="badge ${k.trang_thai}">${daGiao ? 'Đã giao' : 'Chưa giao'}</span>
                <div class="kien-actions">
                    ${daGiao ? '' : '<button class="btn-primary-action" type="button">Hoàn thành</button>'}
                    <button class="btn-menu-more" type="button" aria-label="Thêm thao tác">⋯</button>
                    <div class="kien-menu">
                        <button type="button" class="menu-sua">Sửa</button>
                        ${daGiao ? '<button type="button" class="menu-huygiao">Hủy giao</button>' : ''}
                        ${daGiao ? `<button type="button" class="menu-thutien">${coTien ? 'Sửa tiền' : 'Thu tiền'}</button>` : ''}
                        ${!daGiao ? '<button type="button" class="menu-huydon">Hủy đơn</button>' : ''}
                    </div>
                </div>
            `
            const btnPrimary = row.querySelector('.btn-primary-action')
            if (btnPrimary) btnPrimary.addEventListener('click', () => toggleDaGiao(row, k))
            row.querySelector('.menu-sua').addEventListener('click', () => renderKienRowEdit(row, k))
            row.querySelector('.menu-huygiao')?.addEventListener('click', () => toggleDaGiao(row, k))
            row.querySelector('.menu-thutien')?.addEventListener('click', () => renderKienRowThuTien(row, k))
            row.querySelector('.menu-huydon')?.addEventListener('click', () => huyDon(row, k))
            row.querySelector('.btn-menu-more').addEventListener('click', (e) => {
                e.stopPropagation()
                const menu = row.querySelector('.kien-menu')
                const wasOpen = menu.classList.contains('open')
                document.querySelectorAll('.kien-menu.open').forEach(m => m.classList.remove('open'))
                if (!wasOpen) openKienMenu(e.currentTarget, menu)
            })
            const img = row.querySelector('img')
            if (img) img.addEventListener('click', () => openLightbox(k.anh_url))
        }

        // Sửa tay lat/lng của diem — dự phòng khi GPS lúc "Đã giao" bị từ chối/lỗi,
        // hoặc toạ độ bắt sai. Tính lại km_moc luôn khi lưu.
        function renderKienRowViTri(row, k) {
            row.classList.add('kien-row-edit')
            const diem = k.diem || {}
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info" style="display:flex; flex-direction:column; gap:6px;">
                    <div class="diem">${diem.ten || '(không rõ điểm)'}</div>
                    <input type="number" step="any" class="edit-lat" placeholder="Vĩ độ (lat)" value="${diem.lat ?? ''}">
                    <input type="number" step="any" class="edit-lng" placeholder="Kinh độ (lng)" value="${diem.lng ?? ''}">
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button">Lưu</button>
                    <button class="btn-sm btn-cancel" type="button">Hủy</button>
                </div>
            `
            row.querySelector('.btn-save').addEventListener('click', async () => {
                const lat = Number(row.querySelector('.edit-lat').value)
                const lng = Number(row.querySelector('.edit-lng').value)
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) { showToast('Toạ độ không hợp lệ', 'error'); return }
                const { tuyenChuan, tinhKmRange } = await loadTuyenChuanData()
                const km_moc = tinhKmMoc(lat, lng, diem.tinh_ma, tuyenChuan, tinhKmRange)
                const { error } = await sb.from('diem').update({ lat, lng, km_moc }).eq('id', diem.id)
                if (error) { showToast('Lỗi lưu vị trí: ' + error.message, 'error'); return }
                diem.lat = lat; diem.lng = lng; diem.km_moc = km_moc
                showToast('Đã lưu vị trí điểm', 'success')
                renderKienRowView(row, k)
            })
            row.querySelector('.btn-cancel').addEventListener('click', () => renderKienRowView(row, k))
        }

        function renderKienRowThuTien(row, k) {
            row.classList.add('kien-row-edit')
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                    ${k.tien_thu_ho != null && k.tien_thu_ho > 0 ? `<div class="mota cod">💰 Cần thu hộ: ${formatMoney(k.tien_thu_ho)}</div>` : ''}
                    <input type="number" inputmode="numeric" class="edit-tien" placeholder="Nhập theo nghìn đồng, vd 200 = 200.000đ" value="${k.tien_thu != null ? k.tien_thu / 1000 : ''}">
                    <div class="mota tien-chu"></div>
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button" data-hinh-thuc="tien_mat">💵 Tiền mặt</button>
                    <button class="btn-sm btn-save" type="button" data-hinh-thuc="chuyen_khoan">🏦 Chuyển khoản</button>
                </div>
            `
            const inputTien = row.querySelector('.edit-tien')
            const chuTien = row.querySelector('.tien-chu')
            function capNhatTienChu() {
                const raw = inputTien.value.trim()
                const so = raw === '' ? null : Number(raw) * 1000
                chuTien.textContent = so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
            }
            inputTien.addEventListener('input', capNhatTienChu)
            capNhatTienChu()
            row.querySelectorAll('.btn-save').forEach(btn => btn.addEventListener('click', async () => {
                const hinhThuc = btn.dataset.hinhThuc
                const raw = inputTien.value.trim()
                const tien = raw === '' ? null : Number(raw) * 1000
                if (tien !== null && (!Number.isFinite(tien) || tien < 0)) { showToast('Số tiền không hợp lệ', 'error'); return }
                const { error } = await sb.from('kien').update({ tien_thu: tien, hinh_thuc_thu: tien === null ? null : hinhThuc }).eq('id', k.id)
                if (error) { showToast('Lỗi lưu tiền thu: ' + error.message, 'error'); return }
                k.tien_thu = tien
                k.hinh_thuc_thu = tien === null ? null : hinhThuc
                showToast('Đã lưu tiền thu', 'success')
                renderKienRowView(row, k)
            }))
        }

        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url
            document.getElementById('lightbox').classList.add('show')
        }
        document.getElementById('lightbox').addEventListener('click', () => {
            document.getElementById('lightbox').classList.remove('show')
        })

        // Đóng menu "⋯" của dòng kiện khi bấm ra ngoài — đăng ký 1 lần ở đây thay vì
        // trong renderKienRowView (hàm đó chạy lại mỗi lần render 1 dòng).
        document.addEventListener('click', () => {
            document.querySelectorAll('.kien-menu.open').forEach(m => m.classList.remove('open'))
        })

        function renderKienRowEdit(row, k) {
            row.classList.add('kien-row-edit')
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info" style="display:flex; flex-direction:column; gap:6px;">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                    <input type="tel" class="edit-sdt" placeholder="SĐT người nhận" value="${k.nguoi_nhan_sdt || ''}">
                    <textarea class="edit-ghichu" placeholder="Ghi chú" rows="2">${k.ghi_chu || ''}</textarea>
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button">Lưu</button>
                    <button class="btn-sm btn-cancel" type="button">Hủy</button>
                </div>
            `
            row.querySelector('.btn-save').addEventListener('click', async () => {
                const sdt = row.querySelector('.edit-sdt').value.trim() || null
                const ghichu = row.querySelector('.edit-ghichu').value.trim() || null
                const { error } = await sb.from('kien').update({ nguoi_nhan_sdt: sdt, ghi_chu: ghichu }).eq('id', k.id)
                if (error) { showToast('Lỗi lưu: ' + error.message, 'error'); return }
                k.nguoi_nhan_sdt = sdt
                k.ghi_chu = ghichu
                showToast('Đã lưu', 'success')
                renderKienRowView(row, k)
            })
            row.querySelector('.btn-cancel').addEventListener('click', () => renderKienRowView(row, k))
        }

        async function toggleDaGiao(row, k) {
            const newStatus = k.trang_thai === 'da_giao' ? 'chua_giao' : 'da_giao'

            if (newStatus === 'chua_giao') {
                const { error } = await sb.from('kien').update({ trang_thai: newStatus }).eq('id', k.id)
                if (error) { showToast('Lỗi cập nhật: ' + error.message, 'error'); return }
                k.trang_thai = newStatus
                showToast('Đã hủy đánh dấu giao', 'success')
                renderKienRowView(row, k)
                refreshEndTripButton()
                return
            }

            // Chuyển ngay sang ô thu tiền — không chờ GPS/DB (GPS có thể mất tới 15s).
            // Trạng thái + toạ độ cập nhật ngầm phía sau; nếu update trang_thai lỗi thì
            // revert UI về lại view và báo lỗi. Nếu tien_thu đã có sẵn (khách trả cước
            // ngay lúc gửi ở hang.html) thì bỏ qua bước hỏi lại, tránh thu 2 lần.
            k.trang_thai = newStatus
            refreshEndTripButton()
            const daCoTienSan = k.tien_thu !== null && k.tien_thu !== undefined
            if (daCoTienSan) {
                renderKienRowView(row, k)
                showToast('Đã đánh dấu giao xong (cước đã thu lúc gửi)', 'success')
            } else {
                renderKienRowThuTien(row, k)
                showToast('Đã đánh dấu giao xong', 'success')
            }

            // Bắt GPS + tính km_moc — không cần mạng (GPS offline, km_moc tính tại client từ
            // dữ liệu tuyến đã cache). Chỉ làm khi điểm chưa từng có toạ độ, không ghi đè.
            let toaDoMoi = null
            if (k.diem && (k.diem.lat == null || k.diem.lng == null)) {
                const pos = await batGpsDiemGiao()
                if (pos && pos.accuracy <= 50) {
                    const { tuyenChuan, tinhKmRange } = await loadTuyenChuanData()
                    const km_moc = tinhKmMoc(pos.lat, pos.lng, k.diem.tinh_ma, tuyenChuan, tinhKmRange)
                    toaDoMoi = { lat: pos.lat, lng: pos.lng, km_moc }
                }
                // Không bắt được (từ chối quyền/lỗi/timeout/độ chính xác kém) → bỏ qua,
                // không chặn luồng "Đã giao" chính, điểm chờ lần giao sau hoặc sửa tay.
            }

            const { error } = await sb.from('kien').update({ trang_thai: newStatus }).eq('id', k.id)
            if (error) {
                showToast('Lỗi cập nhật: ' + error.message, 'error')
                k.trang_thai = 'chua_giao'
                renderKienRowView(row, k)
                refreshEndTripButton()
                return
            }

            // Cập nhật toạ độ điểm SAU khi trạng thái kiện đã lưu thành công — 2 lệnh UPDATE
            // tách rời (PostgREST không hỗ trợ transaction đa bảng từ client). Nếu bước này lỗi,
            // kiện vẫn được đánh dấu giao xong bình thường, điểm rơi về nhánh sửa tay.
            if (toaDoMoi && k.diem?.id) {
                const { error: diemErr } = await sb.from('diem').update(toaDoMoi).eq('id', k.diem.id)
                if (!diemErr) Object.assign(k.diem, toaDoMoi)
            }
        }

        // Hủy hẳn 1 kiện vì khách đổi ý không gửi nữa — khác "Hủy giao" (chỉ đảo trang_thai
        // giữa chua_giao/da_giao). Chỉ cho hủy khi chưa giao (xem điều kiện hiện nút ở
        // renderKienRowView). Không xoá bản ghi, set trang_thai = 'huy' để đối chiếu sau,
        // ẩn khỏi manifest qua .neq('trang_thai', 'huy') ở loadManifest. Gọi lại loadManifest
        // thay vì chỉ row.remove() để tự ẩn tiêu đề tỉnh nếu đó là kiện cuối cùng của tỉnh đó.
        async function huyDon(row, k) {
            if (!(await confirmDialog(`Hủy đơn kiện tại "${k.diem?.ten || '(không rõ điểm)'}"? Không thể hoàn tác qua giao diện.`, { danger: true, okText: 'Hủy đơn' }))) return
            const { error } = await sb.from('kien').update({ trang_thai: 'huy' }).eq('id', k.id)
            if (error) { showToast('Lỗi hủy đơn: ' + error.message, 'error'); return }
            showToast('Đã hủy đơn', 'success')
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (chuyen) loadManifest(chuyen)
        }

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            await loadChuyenOptions()
        }

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
