<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Danh sách kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-select-wrap { padding: 16px; }
        .chuyen-select-wrap select#chuyen-select { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tinh-group { margin: 0 16px 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .tinh-group h3 { margin: 0; padding: 12px 16px; background: var(--bg); font-size: 16px; }
        .kien-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            border-top: 1px solid var(--border); font-size: 14px;
        }
        .kien-row.kien-row-da-giao { background: var(--success-light); }
        .kien-row.kien-row-tra-lai { background: #f2ede6; }
        .kien-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: pointer; }
        .lightbox {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 1000; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out;
        }
        .lightbox.show { display: flex; }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; cursor: default; }
        .kien-row .info { flex: 1; min-width: 0; }
        .kien-row .diem { font-weight: 600; }
        .kien-row .so-luong { color: var(--primary); font-weight: 600; font-size: 13px; }
        .kien-row .mota { color: var(--text-muted); font-size: 13px; white-space: pre-line; }
        .sdt-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--text-muted); }
        .sdt-num-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; flex: 1 1 auto; justify-content: space-between; }
        .sdt-so { font-size: 29px; font-weight: 600; color: var(--text); white-space: nowrap; }
        .sdt-so-gui { font-size: 29px; font-weight: 600; color: #7b3fa0; white-space: nowrap; }
        .btn-goi {
            display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
            border: 1px solid var(--primary); color: var(--primary); border-radius: 14px;
            font-size: 14px; font-weight: 600; text-decoration: none; background: #fff;
            flex-shrink: 0;
        }
        .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
        .badge.chua_giao { background: #fdecea; color: var(--danger); }
        .badge.da_giao { background: #eafaf1; color: var(--success); }
        .badge.tra_lai { background: #e9e2d6; color: #8a6d3b; }
        .kien-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
        .btn-sm {
            padding: 6px 10px; font-size: 12px; border-radius: 6px;
            border: 1.5px solid var(--border); background: var(--white); cursor: pointer; white-space: nowrap;
        }
        .btn-sm.btn-done { border-color: var(--success); color: var(--success); }
        .btn-sm.btn-undone { border-color: var(--text-muted); color: var(--text-muted); }
        .btn-sm.btn-save { border-color: var(--success); background: var(--success); color: #fff; }
        .btn-sm.btn-thu { border-color: var(--primary); color: var(--primary); }
        .btn-sm.btn-vitri { border-color: var(--text-muted); color: var(--text-muted); }
        /* Hành động chính (1 nút to, hay bấm nhất) + menu "⋯" gộp hành động phụ ít dùng —
           tránh nhồi nhiều nút cùng cỡ dễ bấm nhầm khi crew thao tác 1 tay trên xe rung lắc. */
        .btn-primary-action {
            padding: 10px 16px; min-height: 44px; font-size: 14px; font-weight: 600;
            border-radius: 8px; border: none; background: var(--success); color: #fff;
            cursor: pointer; white-space: nowrap;
        }
        .btn-menu-more {
            width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px;
            border: 1.5px solid var(--border); background: var(--white);
            font-size: 20px; line-height: 1; cursor: pointer; color: var(--text-muted);
        }
        /* position:fixed + toạ độ tính bằng JS (xem openKienMenu) thay vì absolute/top/right
           tương đối theo .kien-actions — .tinh-group cha có overflow:hidden (bo góc header)
           sẽ cắt mất menu nếu dùng absolute thông thường. */
        .kien-menu {
            display: none; position: fixed; z-index: 20;
            background: var(--white); border: 1px solid var(--border); border-radius: 8px;
            box-shadow: var(--shadow); min-width: 150px; overflow: hidden;
        }
        .kien-menu.open { display: block; }
        .kien-menu button {
            display: block; width: 100%; text-align: left; padding: 12px 14px; min-height: 44px;
            border: none; background: none; font-size: 14px; cursor: pointer; color: var(--text);
            white-space: nowrap; font-family: inherit;
        }
        .kien-menu button:hover { background: var(--bg); }
        .mota.tien-thu { color: var(--success); font-weight: 600; }
        .mota.cod { color: var(--warning); font-weight: 600; }
        .cod-summary {
            display: none; margin: 0 16px 16px; padding: 12px 16px; border-radius: var(--radius-sm);
            background: #fdf3e5; border: 1.5px solid var(--warning); color: var(--warning);
            font-size: 14px; font-weight: 600;
        }
        .kien-row-edit input, .kien-row-edit textarea {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 16px; font-family: inherit;
        }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }
        .doichieu-summary {
            margin: 0 16px 16px; padding: 12px 16px; border-radius: var(--radius-sm);
            background: var(--white); border: 1.5px solid var(--border); box-shadow: var(--shadow);
        }
        .doichieu-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
        .doichieu-row:first-child { border-top: none; }
        .doichieu-row img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .doichieu-row .info { flex: 1; min-width: 0; font-size: 13px; }
        .doichieu-row .sdt-cu { color: var(--text-muted); }
        .doichieu-row .sdt-ai { color: var(--danger); font-weight: 600; }
        .doichieu-row .sdt-goi-y { color: var(--primary); font-weight: 600; }

        /* Dưới 600px: img+info+badge dùng chung 1 hàng, nút hành động (kể cả nút chính +
           menu "⋯" của renderKienRowView, kể cả form Lưu/Hủy) luôn xuống hàng riêng chiếm
           hết chiều rộng — .info có flex:1 + min-width:0 nên nếu để kien-actions chung
           hàng với info, info sẽ bị bóp gần như bằng 0 thay vì tự xuống dòng (flex-wrap chỉ
           ngắt dòng theo từng flex-item, không cứu được item co giãn được), khiến tên
           điểm/SĐT/ghi chú vỡ chữ chồng chéo lên nhau. */
        @media (max-width: 600px) {
            .kien-row { flex-wrap: wrap; align-items: flex-start; gap: 10px 12px; padding: 14px 16px; }
            .kien-row img { width: 56px; height: 56px; }
            .kien-actions { flex-basis: 100%; flex-wrap: wrap; gap: 8px; }
            .btn-primary-action { flex: 1; padding: 12px 14px; font-size: 15px; }
            .btn-menu-more { width: 48px; height: 48px; font-size: 22px; }
            .kien-row-edit .btn-sm { flex: 1 1 calc(50% - 4px); padding: 12px 8px; font-size: 14px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📋 Danh sách kiện hàng</span>
        </h2>
        <div></div>
    </div>

    <div class="chuyen-select-wrap">
        <select id="chuyen-select" style="width:100%; padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:#1a1a2e;background:white"></select>
    </div>

    <div class="cod-summary" id="cod-summary"></div>

    <div id="list-wrap"></div>

    <div class="doichieu-summary" id="doichieu-summary" style="display:none;"></div>

    <div style="padding:8px 16px 16px; display:flex; flex-direction:column; gap:8px;">
        <button id="btn-doi-chieu-sdt" type="button" class="btn-sm" style="display:none; width:100%; padding:12px 14px; font-size:14px;">🔍 Đối chiếu SĐT bằng AI</button>
        <button id="btn-ket-thuc-chuyen" type="button" class="btn-sm btn-undone" style="display:none; width:100%; padding:12px 14px; font-size:14px;">🏁 Kết thúc chuyến</button>
    </div>

    <div class="toast" id="toast"></div>
    <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script src="km-moc.js"></script>
    <script>
        const sb = createSb()
        let chuyenList = []
        let currentKienList = []   // kiện của chuyến đang chọn — dùng để bật/ẩn nút "Kết thúc chuyến" khi trạng thái giao đổi tại chỗ
        let chuyenDaXong = false   // chuyến đang chọn đã trang_thai = 'xong' — khoá mọi thao tác sửa kiện, xem renderKienRowView

        // Gọi lại sau mỗi lần đổi trạng thái 1 kiện tại chỗ (không reload cả manifest) để nút
        // "Kết thúc chuyến" cập nhật đúng ngay, không phải đợi F5/đổi chuyến.
        function refreshEndTripButton() {
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            updateEndTripButton(chuyen, currentKienList)
        }
        loadTuyenChuanData().catch(() => {}) // nạp trước để cache sẵn cho khi bấm "Đã giao"

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        // chuyen(id, chieu, khoi_hanh, trang_thai, ghi_chu, tao_boi, created_at)
        async function loadChuyenOptions() {
            const { data, error } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .order('created_at', { ascending: false })
                .limit(50)
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            chuyenList = data || []
            const sel = document.getElementById('chuyen-select')
            sel.textContent = ''
            if (!chuyenList.length) {
                sel.innerHTML = '<option value="">Chưa có chuyến nào</option>'
                document.getElementById('list-wrap').innerHTML = '<div class="empty">Chưa có chuyến nào</div>'
                return
            }
            chuyenList.forEach(c => {
                const chieuLabel = c.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
                const opt = document.createElement('option')
                opt.value = c.id
                opt.textContent = `${chieuLabel} — ${formatDate(c.khoi_hanh)}${c.trang_thai === 'xong' ? ' (đã xong)' : ''}`
                sel.appendChild(opt)
            })
            // Cho phép trang lịch-sử-chuyến điều hướng thẳng tới 1 chuyến cụ thể qua ?chuyen_id=
            const preselectId = new URLSearchParams(location.search).get('chuyen_id')
            const preselect = preselectId && chuyenList.find(c => c.id === preselectId)
            const initial = preselect || chuyenList[0]
            sel.value = initial.id
            loadManifest(initial)
        }

        document.getElementById('chuyen-select').addEventListener('change', e => {
            const chuyen = chuyenList.find(c => c.id === e.target.value)
            if (chuyen) loadManifest(chuyen)
        })

        // Nút luôn hiển thị (không ẩn hẳn) nhưng chỉ BẤM ĐƯỢC khi chuyến chưa xong VÀ không
        // còn kiện nào ở trạng thái 'chua_giao' — ép giao hết hàng rồi mới kết thúc được
        // chuyến, tránh bấm nhầm khi còn hàng chưa giao xong, nhưng crew vẫn thấy nút ở đó
        // để biết còn thao tác gì cần làm (khác bản trước ẩn hẳn, dễ gây cảm giác "mất nút").
        // `kienList` optional: khi gọi sớm lúc chưa kịp tải kiện thì khoá nút, chờ
        // `loadManifest` gọi lại lần 2 kèm kienList thật. Chuyến đã 'xong' thì ẩn hẳn — không
        // còn gì để kết thúc nữa.
        function updateEndTripButton(chuyen, kienList) {
            const btn = document.getElementById('btn-ket-thuc-chuyen')
            if (!chuyen || chuyen.trang_thai === 'xong') { btn.style.display = 'none'; return }
            btn.style.display = 'block'
            // 'tra_lai' tính là đã xử lý xong (không còn chờ giao) — không chặn kết thúc chuyến.
            const daXongHet = !!(kienList && kienList.every(k => k.trang_thai === 'da_giao' || k.trang_thai === 'tra_lai'))
            btn.disabled = !daXongHet
            btn.style.opacity = daXongHet ? '1' : '0.5'
            btn.style.cursor = daXongHet ? 'pointer' : 'not-allowed'
            btn.title = daXongHet ? '' : 'Còn kiện hàng chưa giao — giao hết mới kết thúc được chuyến'
        }

        document.getElementById('btn-ket-thuc-chuyen').addEventListener('click', async () => {
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (!chuyen) return
            if (chuyen.trang_thai !== 'xong' && !currentKienList.every(k => k.trang_thai === 'da_giao' || k.trang_thai === 'tra_lai')) {
                showToast('Còn kiện hàng chưa giao — giao hết mới kết thúc được chuyến', 'error')
                return
            }
            if (!(await confirmDialog('Kết thúc chuyến này? Sẽ không thể nhập thêm kiện mới cho chuyến này ở trang "Nhập kiện" nữa.'))) return

            // Tự động điền SĐT người gửi còn thiếu trước khi đóng chuyến — KHÔNG PHẢI checkpoint
            // làm tăng độ tin cậy đọc số: "chuyến xong" là mốc nghiệp vụ, không liên quan gì tới
            // việc model đọc đúng chữ viết tay hay không, rủi ro đọc nhầm 1 chữ số ra số khác vẫn
            // hợp lệ (vd 4↔9) không giảm đi chút nào so với tự ghi giữa chuyến. Đây THUẦN là
            // quyết định "giảm phiền cho crew, chấp nhận rủi ro còn lại giống hệt cơ chế '⚡ Điền
            // tất cả' của người nhận" — KHÔNG mở rộng nguyên tắc "không tự ghi DB cho
            // nguoi_gui_sdt" ra bất kỳ nơi nào khác (nút "🔍 Đối chiếu SĐT bằng AI"/khối "📇 gợi ý"
            // giữa chuyến vẫn giữ nguyên hành vi cũ, chỉ gợi ý qua "Sửa").
            const btnKetThuc = document.getElementById('btn-ket-thuc-chuyen')
            const labelGocKetThuc = btnKetThuc.textContent
            btnKetThuc.disabled = true
            btnKetThuc.textContent = 'Đang kiểm tra SĐT người gửi...'
            try {
                const { data: thieuNguoiGui, error: loiTaiThieu } = await sb
                    .from('kien')
                    .select('id, anh_url, ghi_chu')
                    .eq('chuyen_id', chuyen.id)
                    .neq('trang_thai', 'huy')
                    .not('anh_url', 'is', null)
                    .is('nguoi_gui_sdt', null)
                if (!loiTaiThieu && thieuNguoiGui?.length) {
                    const ketQuaNguoiGui = await goiTheoLo(thieuNguoiGui, lo => ({
                        mode: 'read',
                        items: lo.map(k => ({ kien_id: k.id, anh_url: k.anh_url }))
                    }))
                    const kienMapNguoiGui = new Map(thieuNguoiGui.map(k => [k.id, k]))
                    for (const r of ketQuaNguoiGui) {
                        if (r.loi || !r.nguoi_gui?.sdt_ai_doc) continue
                        const k = kienMapNguoiGui.get(r.kien_id)
                        if (!k) continue
                        // Guard .is('nguoi_gui_sdt', null) — phòng crew vừa gõ tay đúng lúc quét
                        // đang chạy, không ghi đè giá trị crew vừa nhập.
                        const { data: rowsCapNhat, error: loiCapNhat } = await sb.from('kien')
                            .update({ nguoi_gui_sdt: r.nguoi_gui.sdt_ai_doc })
                            .eq('id', k.id)
                            .is('nguoi_gui_sdt', null)
                            .select('id')
                        if (loiCapNhat || !rowsCapNhat?.length) continue
                        // Cố ý khác câu chữ audit của "⚡ Điền tất cả" (người nhận) để sau này
                        // truy được đúng nguồn gốc + thời điểm 1 số bị ghi tự động.
                        const dongAudit = `[${formatNowStamp()}] AI tự điền SĐT người gửi lúc kết thúc chuyến: ${r.nguoi_gui.sdt_ai_doc}`
                        const ghiChuMoi = k.ghi_chu ? `${k.ghi_chu}\n${dongAudit}` : dongAudit
                        sb.from('kien').update({ ghi_chu: ghiChuMoi }).eq('id', k.id).then(() => {}) // best-effort, không chặn
                    }
                }
            } catch (err) {
                console.error('[ket-thuc-chuyen: tự điền SĐT người gửi]', err)
                // Lỗi ở bước quét không được chặn việc kết thúc chuyến — bỏ qua, tiếp tục bình thường.
            }
            btnKetThuc.disabled = false
            btnKetThuc.textContent = labelGocKetThuc

            const { error } = await sb.from('chuyen').update({ trang_thai: 'xong' }).eq('id', chuyen.id)
            if (error) { showToast('Lỗi kết thúc chuyến: ' + error.message, 'error'); return }
            chuyen.trang_thai = 'xong'
            const opt = document.querySelector(`#chuyen-select option[value="${chuyen.id}"]`)
            if (opt) {
                const chieuLabel = chuyen.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
                opt.textContent = `${chieuLabel} — ${formatDate(chuyen.khoi_hanh)} (đã xong)`
            }
            updateEndTripButton(chuyen)
            showToast('Đã kết thúc chuyến', 'success')
        })

        // tinh_tuyen(ma PK, ten, thu_tu). diem(id, ten, tinh_ma). kien(id, chuyen_id, diem_id,
        // anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at).
        // Chiều bac = ASC thu_tu, nam = DESC thu_tu.
        async function loadManifest(chuyen) {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''
            chuyenDaXong = chuyen.trang_thai === 'xong'
            updateEndTripButton(chuyen)   // ẩn nút trong lúc chờ tải kiện — bật lại đúng điều kiện bên dưới khi có kienList
            // Chuyến đã xong khoá luôn nút đối chiếu — nút "Sửa" trong banner lệch gọi thẳng
            // renderKienRowEdit, không đi qua .kien-actions nên không tự động bị khoá bởi
            // chuyenDaXong như các thao tác khác; ẩn hẳn nút kích hoạt là cách đơn giản nhất để
            // không mở lại đường sửa kiện của 1 chuyến đã chốt số liệu.
            document.getElementById('btn-doi-chieu-sdt').style.display = chuyenDaXong ? 'none' : 'block'
            document.getElementById('doichieu-summary').style.display = 'none'

            const { data: tinhList, error: tinhErr } = await sb
                .from('tinh_tuyen')
                .select('ma, ten, thu_tu')
                .order('thu_tu', { ascending: chuyen.chieu === 'bac' })
            if (tinhErr) { showToast('Lỗi tải tỉnh: ' + tinhErr.message, 'error'); return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('id, diem_id, anh_url, nguoi_nhan_sdt, nguoi_gui_sdt, trang_thai, ghi_chu, so_luong, loai_hang, tien_thu, hinh_thuc_thu, tien_thu_ho, created_at, diem(id, ten, tinh_ma, lat, lng, km_moc)')
                .eq('chuyen_id', chuyen.id)
                .neq('trang_thai', 'huy')
                .order('created_at', { ascending: true })
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }
            currentKienList = kienList
            updateEndTripButton(chuyen, kienList)

            // Dùng chung 1 object diem cho mọi kiện cùng diem_id — cập nhật 1 lần (vd sau khi
            // bắt GPS) thì mọi dòng kiện cùng điểm tự thấy giá trị mới ngay, tránh xin quyền
            // GPS lặp lại nhiều lần trong 1 phiên khi bấm "Đã giao" liên tiếp cùng 1 điểm.
            const diemMap = new Map()
            kienList.forEach(k => {
                if (!k.diem) return
                if (diemMap.has(k.diem_id)) k.diem = diemMap.get(k.diem_id)
                else diemMap.set(k.diem_id, k.diem)
            })

            renderCodSummary(kienList)

            let any = false
            tinhList.forEach(tinh => {
                const kiensCuaTinh = sapXepTrongTinh(kienList.filter(k => k.diem?.tinh_ma === tinh.ma), chuyen.chieu)
                if (!kiensCuaTinh.length) return
                any = true

                const group = document.createElement('div')
                group.className = 'tinh-group'
                const h3 = document.createElement('h3')
                h3.textContent = `${tinh.ten} (${kiensCuaTinh.length})`
                group.appendChild(h3)

                kiensCuaTinh.forEach(k => {
                    group.appendChild(createKienRow(k))
                })
                wrap.appendChild(group)
            })

            if (!any) wrap.innerHTML = '<div class="empty">Chuyến này chưa có kiện hàng nào</div>'
        }

        // Cảnh báo tổng tiền thu hộ (COD) của cả chuyến — kien.tien_thu_ho là số tiền người
        // gửi yêu cầu thu hộ khi giao, nhập lúc chụp ảnh ở hang.html. So với tien_thu (số tiền
        // thực thu, nhập lúc "Hoàn thành") để biết còn kiện nào thu hộ chưa thu đủ.
        function renderCodSummary(kienList) {
            const el = document.getElementById('cod-summary')
            // Kiện đã 'tra_lai' không còn khả năng thu COD nữa (hàng đã mang về) — loại khỏi
            // cảnh báo, dù vẫn hiện trong danh sách dạng "Hàng hoàn" ở createKienRow.
            const codKiens = kienList.filter(k => k.trang_thai !== 'tra_lai' && k.tien_thu_ho != null && k.tien_thu_ho > 0)
            const chuaThuDu = codKiens.filter(k => Number(k.tien_thu || 0) < Number(k.tien_thu_ho))
            // Chỉ cảnh báo khi còn kiện thu hộ chưa thu đủ — đã thu đủ hết thì tắt banner,
            // không còn gì để cảnh báo nữa.
            if (!chuaThuDu.length) { el.style.display = 'none'; return }
            const tongThuHo = codKiens.reduce((s, k) => s + Number(k.tien_thu_ho), 0)
            const tongDaThu = codKiens.reduce((s, k) => s + Number(k.tien_thu || 0), 0)
            el.style.display = 'block'
            el.textContent = `⚠️ ${codKiens.length} kiện thu hộ (COD) — cần thu ${formatMoney(tongThuHo)}, đã thu ${formatMoney(tongDaThu)}, còn ${chuaThuDu.length} kiện chưa thu đủ`
        }

        // kien(id, diem_id, anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at, diem(ten, tinh_ma))
        function createKienRow(k) {
            const row = document.createElement('div')
            row.className = 'kien-row'
            row.dataset.kienId = k.id
            renderKienRowView(row, k)
            return row
        }

        // Đặt .kien-menu (position:fixed) ngay dưới nút "⋯" vừa bấm, neo theo mép phải —
        // tính bằng getBoundingClientRect() vì .tinh-group cha có overflow:hidden, dùng
        // absolute thông thường sẽ bị cắt mất phần menu tràn ra ngoài khung.
        function openKienMenu(btn, menu) {
            // Hiện trước rồi mới đo offsetWidth/offsetHeight thật — trên mobile nút "⋯" đứng
            // 1 mình (flex-start) thường nằm sát mép trái, nếu chỉ neo theo mép phải của nút
            // (không kẹp trong viewport) menu sẽ bị đẩy tràn ra ngoài mép trái màn hình, nhìn
            // như 1 khối trắng trống không có chữ (đã gặp thực tế trên điện thoại).
            menu.classList.add('open')
            const rect = btn.getBoundingClientRect()
            const margin = 8
            let left = rect.right - menu.offsetWidth
            left = Math.max(margin, Math.min(left, window.innerWidth - menu.offsetWidth - margin))
            // Dòng kiện cuối cùng của danh sách thường nằm sát đáy màn hình — nếu mở menu
            // xuống dưới như bình thường sẽ bị tràn khỏi viewport (chữ "Hủy giao" bị cắt nửa
            // dòng, cũng đã gặp thực tế). Không đủ chỗ phía dưới thì mở ngược lên trên nút.
            let top = rect.bottom + 4
            if (top + menu.offsetHeight > window.innerHeight - margin) {
                top = rect.top - menu.offsetHeight - 4
            }
            top = Math.max(margin, top)
            menu.style.left = left + 'px'
            menu.style.top = top + 'px'
        }

        // Mỗi dòng chỉ 1 hành động chính (to, dễ bấm 1 tay khi xe đang chạy) — hành động
        // phụ ít dùng hơn gộp vào menu "⋯" thay vì nhồi nhiều nút cùng cỡ dễ bấm nhầm.
        // Chưa giao: chính = "Hoàn thành", menu chỉ có "Sửa". Đã giao: không có hành động
        // gấp nào (mọi thao tác ở đây là sửa sai, tần suất thấp) nên chỉ còn menu, gộp cả
        // "Sửa" / "Hủy giao" / "Sửa tiền".
        // Đếm số dòng "[HH:mm dd/MM] ..." đã append vào ghi_chu qua "Ghi nhận đã gọi" — chỉ
        // gợi ý hiển thị cho crew cân nhắc lúc nào bấm "Trả hàng", KHÔNG chặn hành động nào,
        // KHÔNG giới hạn số lần thử (quyết định nghiệp vụ: để crew tự quyết).
        function demSoLanThuLienLac(ghiChu) {
            if (!ghiChu) return 0
            return ghiChu.split('\n').filter(dong => dong.trimStart().startsWith('[')).length
        }

        // Ẩn dòng audit "AI tự điền SĐT: ..." (append lúc bấm "⚡ Điền tất cả") khỏi hiển thị —
        // SĐT đã hiện sẵn ở dòng riêng ngay bên trên nên dòng này chỉ lặp lại thông tin, không
        // cần crew đọc thêm. Dòng vẫn giữ nguyên trong ghi_chu thật (DB, ô sửa ghi chú) để còn
        // truy lại nguồn gốc số nếu cần sau này, xem CLAUDE.md mục audit trail.
        function locGhiChuHienThi(ghiChu) {
            if (!ghiChu) return ghiChu
            return ghiChu.split('\n').filter(dong => !dong.trimStart().startsWith('[') || !dong.includes('AI tự điền SĐT:')).join('\n')
        }

        function renderKienRowView(row, k) {
            row.classList.remove('kien-row-edit')
            const daGiao = k.trang_thai === 'da_giao'
            const traLai = k.trang_thai === 'tra_lai'
            const chuaGiao = !daGiao && !traLai
            row.classList.toggle('kien-row-da-giao', daGiao)
            row.classList.toggle('kien-row-tra-lai', traLai)
            const ghiChuHienThi = locGhiChuHienThi(k.ghi_chu)
            const coTien = k.tien_thu !== null && k.tien_thu !== undefined
            const thuTruocKhiGiao = coTien && chuaGiao
            const coThuHo = k.tien_thu_ho != null && k.tien_thu_ho > 0
            const thuHoConThieu = coThuHo && !traLai && Number(k.tien_thu || 0) < Number(k.tien_thu_ho)
            const badgeLabel = daGiao ? 'Đã giao' : traLai ? 'Hàng hoàn' : 'Chưa giao'
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}${k.so_luong > 1 && !k.loai_hang ? ` <span class="so-luong">×${k.so_luong}</span>` : ''}</div>
                    ${k.loai_hang ? `<div class="mota">${k.loai_hang}</div>` : ''}
                    ${k.nguoi_nhan_sdt ? `<div class="mota sdt-row">SĐT người nhận: <span class="sdt-num-wrap"><span class="sdt-so">${k.nguoi_nhan_sdt}</span><a class="btn-goi" href="tel:${k.nguoi_nhan_sdt}">📞 Gọi</a></span></div>` : ''}
                    ${k.nguoi_gui_sdt ? `<div class="mota sdt-row">SĐT người gửi: <span class="sdt-num-wrap"><span class="sdt-so-gui">${k.nguoi_gui_sdt}</span><a class="btn-goi" href="tel:${k.nguoi_gui_sdt}">📞 Gọi</a></span></div>` : ''}
                    ${ghiChuHienThi ? `<div class="mota">${ghiChuHienThi}</div>` : ''}
                    ${coThuHo ? `<div class="mota cod">💰 Thu hộ: ${formatMoney(k.tien_thu_ho)}${thuHoConThieu ? ' ⚠ chưa thu đủ' : traLai ? ' (đã hoàn, không thu nữa)' : ''}</div>` : ''}
                    ${coTien ? `<div class="mota tien-thu">${thuTruocKhiGiao ? '💵 Đã thu cước lúc gửi' : 'Đã thu'}: ${formatMoney(k.tien_thu)}${k.hinh_thuc_thu ? ` (${k.hinh_thuc_thu === 'tien_mat' ? 'Tiền mặt' : 'Chuyển khoản'})` : ''}</div>` : ''}
                </div>
                <span class="badge ${k.trang_thai}">${badgeLabel}</span>
                ${chuyenDaXong ? '' : `
                <div class="kien-actions">
                    ${chuaGiao ? '<button class="btn-primary-action" type="button">Hoàn thành</button>' : ''}
                    <button class="btn-menu-more" type="button" aria-label="Thêm thao tác">⋯</button>
                    <div class="kien-menu">
                        <button type="button" class="menu-sua">Sửa</button>
                        ${daGiao ? '<button type="button" class="menu-huygiao">Hủy giao</button>' : ''}
                        ${daGiao ? `<button type="button" class="menu-thutien">${coTien ? 'Sửa tiền' : 'Thu tiền'}</button>` : ''}
                        ${chuaGiao ? '<button type="button" class="menu-dagoi">📞 Ghi nhận đã gọi</button>' : ''}
                        ${chuaGiao ? '<button type="button" class="menu-tralai">↩️ Trả hàng</button>' : ''}
                        ${chuaGiao ? '<button type="button" class="menu-huydon">Hủy đơn</button>' : ''}
                        ${traLai ? '<button type="button" class="menu-khoiphuc">↺ Khôi phục (bỏ trả hàng)</button>' : ''}
                    </div>
                </div>
                `}
            `
            // chuyenDaXong: không render .kien-actions ở trên nên không có gì để gắn listener
            // — mọi querySelector bên dưới trả về null, ?. tự bỏ qua an toàn.
            const btnPrimary = row.querySelector('.btn-primary-action')
            if (btnPrimary) btnPrimary.addEventListener('click', () => toggleDaGiao(row, k))
            row.querySelector('.menu-sua')?.addEventListener('click', () => renderKienRowEdit(row, k))
            row.querySelector('.menu-huygiao')?.addEventListener('click', () => toggleDaGiao(row, k))
            row.querySelector('.menu-thutien')?.addEventListener('click', () => renderKienRowThuTien(row, k))
            row.querySelector('.menu-dagoi')?.addEventListener('click', () => ghiNhanDaGoi(row, k))
            row.querySelector('.menu-tralai')?.addEventListener('click', () => traHang(row, k))
            row.querySelector('.menu-huydon')?.addEventListener('click', () => huyDon(row, k))
            row.querySelector('.menu-khoiphuc')?.addEventListener('click', () => khoiPhucTraLai(row, k))
            row.querySelector('.btn-menu-more')?.addEventListener('click', (e) => {
                e.stopPropagation()
                const menu = row.querySelector('.kien-menu')
                const wasOpen = menu.classList.contains('open')
                document.querySelectorAll('.kien-menu.open').forEach(m => m.classList.remove('open'))
                if (!wasOpen) openKienMenu(e.currentTarget, menu)
            })
            const img = row.querySelector('img')
            if (img) img.addEventListener('click', () => openLightbox(k.anh_url))
        }

        // Sửa tay lat/lng của diem — dự phòng khi GPS lúc "Đã giao" bị từ chối/lỗi,
        // hoặc toạ độ bắt sai. Tính lại km_moc luôn khi lưu.
        function renderKienRowViTri(row, k) {
            row.classList.add('kien-row-edit')
            const diem = k.diem || {}
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info" style="display:flex; flex-direction:column; gap:6px;">
                    <div class="diem">${diem.ten || '(không rõ điểm)'}</div>
                    <input type="number" step="any" class="edit-lat" placeholder="Vĩ độ (lat)" value="${diem.lat ?? ''}">
                    <input type="number" step="any" class="edit-lng" placeholder="Kinh độ (lng)" value="${diem.lng ?? ''}">
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button">Lưu</button>
                    <button class="btn-sm btn-cancel" type="button">Hủy</button>
                </div>
            `
            row.querySelector('.btn-save').addEventListener('click', async () => {
                const lat = Number(row.querySelector('.edit-lat').value)
                const lng = Number(row.querySelector('.edit-lng').value)
                if (!Number.isFinite(lat) || !Number.isFinite(lng)) { showToast('Toạ độ không hợp lệ', 'error'); return }
                const { tuyenChuan, tinhKmRange } = await loadTuyenChuanData()
                const km_moc = tinhKmMoc(lat, lng, diem.tinh_ma, tuyenChuan, tinhKmRange)
                const { error } = await sb.from('diem').update({ lat, lng, km_moc }).eq('id', diem.id)
                if (error) { showToast('Lỗi lưu vị trí: ' + error.message, 'error'); return }
                diem.lat = lat; diem.lng = lng; diem.km_moc = km_moc
                showToast('Đã lưu vị trí điểm', 'success')
                renderKienRowView(row, k)
            })
            row.querySelector('.btn-cancel').addEventListener('click', () => renderKienRowView(row, k))
        }

        function renderKienRowThuTien(row, k) {
            row.classList.add('kien-row-edit')
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                    ${k.tien_thu_ho != null && k.tien_thu_ho > 0 ? `<div class="mota cod">💰 Cần thu hộ: ${formatMoney(k.tien_thu_ho)}</div>` : ''}
                    <input type="number" inputmode="numeric" class="edit-tien" placeholder="Nhập theo nghìn đồng, vd 200 = 200.000đ" value="${k.tien_thu != null ? k.tien_thu / 1000 : ''}">
                    <div class="mota tien-chu"></div>
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button" data-hinh-thuc="tien_mat">💵 Tiền mặt</button>
                    <button class="btn-sm btn-save" type="button" data-hinh-thuc="chuyen_khoan">🏦 Chuyển khoản</button>
                </div>
            `
            const inputTien = row.querySelector('.edit-tien')
            const chuTien = row.querySelector('.tien-chu')
            function capNhatTienChu() {
                const raw = inputTien.value.trim()
                const so = raw === '' ? null : Number(raw) * 1000
                chuTien.textContent = so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
            }
            inputTien.addEventListener('input', capNhatTienChu)
            capNhatTienChu()
            row.querySelectorAll('.btn-save').forEach(btn => btn.addEventListener('click', async () => {
                const hinhThuc = btn.dataset.hinhThuc
                const raw = inputTien.value.trim()
                const tien = raw === '' ? null : Number(raw) * 1000
                if (tien !== null && (!Number.isFinite(tien) || tien < 0)) { showToast('Số tiền không hợp lệ', 'error'); return }
                const { error } = await sb.from('kien').update({ tien_thu: tien, hinh_thuc_thu: tien === null ? null : hinhThuc }).eq('id', k.id)
                if (error) { showToast('Lỗi lưu tiền thu: ' + error.message, 'error'); return }
                k.tien_thu = tien
                k.hinh_thuc_thu = tien === null ? null : hinhThuc
                showToast('Đã lưu tiền thu', 'success')
                renderKienRowView(row, k)
            }))
        }

        // Lightbox tự push 1 history entry khi mở — không có entry này thì bấm Back/vuốt
        // gesture Android lúc đang xem ảnh phóng to sẽ thoát thẳng khỏi PWA (đóng lightbox
        // không tính là 1 điều hướng thật nên trình duyệt không có gì để lùi lại), thay vì
        // chỉ đóng ảnh như crew mong đợi. Cùng pattern history-guard với hang.html nhưng đơn
        // giản hơn vì chỉ có 1 trạng thái mở/đóng (không phải nhiều bước).
        let lightboxOpen = false
        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url
            document.getElementById('lightbox').classList.add('show')
            if (!lightboxOpen) history.pushState({ lightbox: true }, '', location.href)
            lightboxOpen = true
        }
        function closeLightboxUI() {
            document.getElementById('lightbox').classList.remove('show')
            lightboxOpen = false
        }
        document.getElementById('lightbox').addEventListener('click', () => {
            if (!lightboxOpen) return
            closeLightboxUI()
            history.back()   // tiêu thụ entry vừa push lúc mở, tránh phải bấm Back 2 lần khi rời trang sau đó
        })
        window.addEventListener('popstate', () => {
            if (lightboxOpen) closeLightboxUI()
        })

        // Đóng menu "⋯" của dòng kiện khi bấm ra ngoài — đăng ký 1 lần ở đây thay vì
        // trong renderKienRowView (hàm đó chạy lại mỗi lần render 1 dòng).
        document.addEventListener('click', () => {
            document.querySelectorAll('.kien-menu.open').forEach(m => m.classList.remove('open'))
        })

        function renderKienRowEdit(row, k) {
            row.classList.add('kien-row-edit')
            row.innerHTML = `
                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                <div class="info" style="display:flex; flex-direction:column; gap:6px;">
                    <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                    <input type="tel" class="edit-sdt" placeholder="SĐT người nhận" value="${k.nguoi_nhan_sdt || ''}">
                    <input type="tel" class="edit-gui-sdt" placeholder="SĐT người gửi" value="${k.nguoi_gui_sdt || ''}">
                    <textarea class="edit-ghichu" placeholder="Ghi chú" rows="2">${k.ghi_chu || ''}</textarea>
                </div>
                <div class="kien-actions">
                    <button class="btn-sm btn-save" type="button">Lưu</button>
                    <button class="btn-sm btn-cancel" type="button">Hủy</button>
                </div>
            `
            row.querySelector('.btn-save').addEventListener('click', async () => {
                const sdt = row.querySelector('.edit-sdt').value.trim() || null
                const guiSdt = row.querySelector('.edit-gui-sdt').value.trim() || null
                const ghichu = row.querySelector('.edit-ghichu').value.trim() || null
                const { error } = await sb.from('kien').update({ nguoi_nhan_sdt: sdt, nguoi_gui_sdt: guiSdt, ghi_chu: ghichu }).eq('id', k.id)
                if (error) { showToast('Lỗi lưu: ' + error.message, 'error'); return }
                k.nguoi_nhan_sdt = sdt
                k.nguoi_gui_sdt = guiSdt
                k.ghi_chu = ghichu
                showToast('Đã lưu', 'success')
                renderKienRowView(row, k)
            })
            row.querySelector('.btn-cancel').addEventListener('click', () => renderKienRowView(row, k))
        }

        async function toggleDaGiao(row, k) {
            const newStatus = k.trang_thai === 'da_giao' ? 'chua_giao' : 'da_giao'

            if (newStatus === 'chua_giao') {
                const { error } = await sb.from('kien').update({ trang_thai: newStatus }).eq('id', k.id)
                if (error) { showToast('Lỗi cập nhật: ' + error.message, 'error'); return }
                k.trang_thai = newStatus
                showToast('Đã hủy đánh dấu giao', 'success')
                renderKienRowView(row, k)
                refreshEndTripButton()
                return
            }

            // Chuyển ngay sang ô thu tiền — không chờ GPS/DB (GPS có thể mất tới 15s).
            // Trạng thái + toạ độ cập nhật ngầm phía sau; nếu update trang_thai lỗi thì
            // revert UI về lại view và báo lỗi. Nếu tien_thu đã có sẵn (khách trả cước
            // ngay lúc gửi ở hang.html) thì bỏ qua bước hỏi lại, tránh thu 2 lần.
            k.trang_thai = newStatus
            refreshEndTripButton()
            const daCoTienSan = k.tien_thu !== null && k.tien_thu !== undefined
            if (daCoTienSan) {
                renderKienRowView(row, k)
                showToast('Đã đánh dấu giao xong (cước đã thu lúc gửi)', 'success')
            } else {
                renderKienRowThuTien(row, k)
                showToast('Đã đánh dấu giao xong', 'success')
            }

            // Bắt GPS + tính km_moc — không cần mạng (GPS offline, km_moc tính tại client từ
            // dữ liệu tuyến đã cache). Chỉ làm khi điểm chưa từng có toạ độ, không ghi đè.
            let toaDoMoi = null
            if (k.diem && (k.diem.lat == null || k.diem.lng == null)) {
                const pos = await batGpsDiemGiao()
                if (pos && pos.accuracy <= 50) {
                    const { tuyenChuan, tinhKmRange } = await loadTuyenChuanData()
                    const km_moc = tinhKmMoc(pos.lat, pos.lng, k.diem.tinh_ma, tuyenChuan, tinhKmRange)
                    toaDoMoi = { lat: pos.lat, lng: pos.lng, km_moc }
                }
                // Không bắt được (từ chối quyền/lỗi/timeout/độ chính xác kém) → bỏ qua,
                // không chặn luồng "Đã giao" chính, điểm chờ lần giao sau hoặc sửa tay.
            }

            const { error } = await sb.from('kien').update({ trang_thai: newStatus }).eq('id', k.id)
            if (error) {
                showToast('Lỗi cập nhật: ' + error.message, 'error')
                k.trang_thai = 'chua_giao'
                renderKienRowView(row, k)
                refreshEndTripButton()
                return
            }

            // Cập nhật toạ độ điểm SAU khi trạng thái kiện đã lưu thành công — 2 lệnh UPDATE
            // tách rời (PostgREST không hỗ trợ transaction đa bảng từ client). Nếu bước này lỗi,
            // kiện vẫn được đánh dấu giao xong bình thường, điểm rơi về nhánh sửa tay.
            if (toaDoMoi && k.diem?.id) {
                const { error: diemErr } = await sb.from('diem').update(toaDoMoi).eq('id', k.diem.id)
                if (!diemErr) Object.assign(k.diem, toaDoMoi)
            }
        }

        // Hủy hẳn 1 kiện vì khách đổi ý không gửi nữa — khác "Hủy giao" (chỉ đảo trang_thai
        // giữa chua_giao/da_giao). Chỉ cho hủy khi chưa giao (xem điều kiện hiện nút ở
        // renderKienRowView). Không xoá bản ghi, set trang_thai = 'huy' để đối chiếu sau,
        // ẩn khỏi manifest qua filter ở loadManifest. Gọi lại loadManifest thay vì chỉ
        // row.remove() để tự ẩn tiêu đề tỉnh nếu đó là kiện cuối cùng của tỉnh đó.
        async function huyDon(row, k) {
            if (!(await confirmDialog(`Hủy đơn kiện tại "${k.diem?.ten || '(không rõ điểm)'}"? Không thể hoàn tác qua giao diện.`, { danger: true, okText: 'Hủy đơn' }))) return
            const { error } = await sb.from('kien').update({ trang_thai: 'huy' }).eq('id', k.id)
            if (error) { showToast('Lỗi hủy đơn: ' + error.message, 'error'); return }
            showToast('Đã hủy đơn', 'success')
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (chuyen) loadManifest(chuyen)
        }

        // "Trả hàng" — crew đã tới điểm giao nhưng KHÔNG giao được (người nhận từ chối/không
        // liên lạc được), khác hẳn "huy" (huy = hàng chưa từng rời điểm gửi). Hàng đã đi hết
        // tuyến nên phải mang NGƯỢC LẠI trên chuyến chiều đối diện gần nhất — không có cơ chế
        // tự động chuyển kiện qua chuyến khác trong v1, crew tự tạo kiện mới ở hang.html khi
        // chuyến ngược bắt đầu chạy (xem kien_goc_id/"Liên kết kiện trả lại" ở hang.html).
        // Không giới hạn số lần thử liên lạc bằng code (quyết định nghiệp vụ) — chỉ cảnh báo
        // mềm nếu chưa "Ghi nhận đã gọi" lần nào, để tránh bấm nhầm ngay từ chuyến đi đầu.
        function formatNowStamp() {
            const now = new Date()
            const hh = String(now.getHours()).padStart(2, '0')
            const mm = String(now.getMinutes()).padStart(2, '0')
            const dd = String(now.getDate()).padStart(2, '0')
            const MM = String(now.getMonth() + 1).padStart(2, '0')
            return `${hh}:${mm} ${dd}/${MM}`
        }

        // Hỏi crew nhập 1 số tiền (đơn vị nghìn đồng, giống quy ước nhập ở hang.html), giới
        // hạn trong [0, max]. Trả về số tiền (đồng) hoặc undefined nếu crew bấm Hủy hộp thoại,
        // null nếu crew để trống (không tách phần tiền nào cho phần hoàn).
        function hoiSoTienHoan(label, maxDong) {
            const nhap = prompt(`${label} (đơn vị nghìn đồng, tối đa ${formatMoney(maxDong)}, để trống nếu không tách):`, '')
            if (nhap === null) return undefined
            if (nhap.trim() === '') return null
            const so = Number(nhap.trim()) * 1000
            if (!Number.isFinite(so) || so < 0 || so > maxDong) return NaN
            return so
        }

        // Trả hàng — hỗ trợ TÁCH 1 PHẦN khi kiện gộp nhiều số lượng (vd 4 thùng, khách chỉ trả
        // lại 1 thùng): kiện gốc giảm so_luong, tạo thêm 1 kiện mới ở trạng thái 'tra_lai' cho
        // phần bị hoàn. Kiện chỉ có so_luong = 1 (đa số trường hợp) thì trả nguyên kiện như cũ,
        // không hỏi số lượng. Tiền COD/cước gắn với cả kiện không tự chia theo tỷ lệ số lượng
        // (hệ thống không có đơn giá/thùng) — hỏi tay số tiền tương ứng phần hoàn nếu có.
        async function traHang(row, k) {
            const soLan = demSoLanThuLienLac(k.ghi_chu)
            const canhBaoGoi = soLan === 0 ? '\n\n⚠ Chưa ghi nhận lần gọi nào cho kiện này.' : ''

            let soLuongHoan = k.so_luong || 1
            if (k.so_luong > 1) {
                const nhap = prompt(`Kiện này gồm ${k.so_luong} kiện. Nhập số lượng muốn đánh dấu trả hàng (để trống = trả hết ${k.so_luong}):`, '')
                if (nhap === null) return
                if (nhap.trim() !== '') {
                    const n = parseInt(nhap.trim(), 10)
                    if (!Number.isFinite(n) || n < 1 || n > k.so_luong) { showToast('Số lượng không hợp lệ', 'error'); return }
                    soLuongHoan = n
                }
            }
            const traHetKien = soLuongHoan >= k.so_luong

            if (!(await confirmDialog(
                traHetKien
                    ? `Đánh dấu TRẢ HÀNG kiện tại "${k.diem?.ten || '(không rõ điểm)'}"? Kiện sẽ chuyển sang trạng thái "Hàng hoàn" trong danh sách chuyến này, cần tạo kiện mới ở chuyến chiều ngược để mang về.${canhBaoGoi}`
                    : `Tách ${soLuongHoan}/${k.so_luong} kiện tại "${k.diem?.ten || '(không rõ điểm)'}" sang trạng thái "Hàng hoàn"? Kiện gốc còn lại ${k.so_luong - soLuongHoan}.${canhBaoGoi}`,
                { danger: true, okText: 'Trả hàng' }
            ))) return

            let tienThuHoHoan = null, tienThuHoan = null
            if (!traHetKien) {
                if (k.tien_thu_ho != null && k.tien_thu_ho > 0) {
                    const so = hoiSoTienHoan('Số tiền thu hộ (COD) tương ứng phần hoàn', k.tien_thu_ho)
                    if (so === undefined) return
                    if (Number.isNaN(so)) { showToast('Số tiền thu hộ không hợp lệ', 'error'); return }
                    tienThuHoHoan = so
                }
                if (k.tien_thu != null) {
                    const so = hoiSoTienHoan('Số tiền cước/đã thu tương ứng phần hoàn', k.tien_thu)
                    if (so === undefined) return
                    if (Number.isNaN(so)) { showToast('Số tiền không hợp lệ', 'error'); return }
                    tienThuHoan = so
                }
            }

            if (traHetKien) {
                const { error } = await sb.from('kien').update({ trang_thai: 'tra_lai' }).eq('id', k.id)
                if (error) { showToast('Lỗi trả hàng: ' + error.message, 'error'); return }
            } else {
                const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
                const { error: insErr } = await sb.from('kien').insert({
                    id: crypto.randomUUID(),
                    chuyen_id: chuyen.id,
                    diem_id: k.diem_id,
                    anh_url: k.anh_url,
                    nguoi_nhan_sdt: k.nguoi_nhan_sdt,
                    nguoi_gui_sdt: k.nguoi_gui_sdt,
                    trang_thai: 'tra_lai',
                    ghi_chu: k.ghi_chu,
                    so_luong: soLuongHoan,
                    loai_hang: k.loai_hang,
                    tien_thu: tienThuHoan,
                    tien_thu_ho: tienThuHoHoan,
                    created_at: new Date().toISOString()
                })
                if (insErr) { showToast('Lỗi tách kiện: ' + insErr.message, 'error'); return }

                const ghiChuGhiNhan = `Đã tách ${soLuongHoan} kiện sang trạng thái trả hàng lúc ${formatNowStamp()}`
                const { error: updErr } = await sb.from('kien').update({
                    so_luong: k.so_luong - soLuongHoan,
                    ghi_chu: k.ghi_chu ? `${k.ghi_chu}\n${ghiChuGhiNhan}` : ghiChuGhiNhan,
                    tien_thu_ho: tienThuHoHoan != null ? (k.tien_thu_ho - tienThuHoHoan || null) : k.tien_thu_ho,
                    tien_thu: tienThuHoan != null ? (k.tien_thu - tienThuHoan) : k.tien_thu
                }).eq('id', k.id)
                if (updErr) { showToast('Lỗi cập nhật kiện gốc: ' + updErr.message, 'error'); return }
            }

            showToast(traHetKien ? 'Đã đánh dấu trả hàng' : `Đã tách ${soLuongHoan} kiện sang trạng thái trả hàng`, 'success')
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (chuyen) loadManifest(chuyen)
        }

        // "Khôi phục (bỏ trả hàng)" — đảo ngược traHang khi bấm nhầm, đưa kiện về 'chua_giao'
        // để crew xử lý lại bình thường. Không có ràng buộc gì đặc biệt (khác toggleDaGiao
        // không cần GPS ở chiều này).
        async function khoiPhucTraLai(row, k) {
            if (!(await confirmDialog(`Bỏ đánh dấu trả hàng cho kiện tại "${k.diem?.ten || '(không rõ điểm)'}"? Kiện sẽ quay lại trạng thái "Chưa giao".`))) return
            const { error } = await sb.from('kien').update({ trang_thai: 'chua_giao' }).eq('id', k.id)
            if (error) { showToast('Lỗi khôi phục: ' + error.message, 'error'); return }
            showToast('Đã khôi phục', 'success')
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (chuyen) loadManifest(chuyen)
        }

        // "Ghi nhận đã gọi" — append 1 dòng timestamp vào ghi_chu hiện có (KHÔNG ghi đè, KHÔNG
        // thêm cột DB mới) mỗi lần crew thử liên lạc người nhận mà không được, để có căn cứ
        // trước khi quyết định "Trả hàng". Chỉ là gợi ý hiển thị (xem demSoLanThuLienLac),
        // không chặn/bắt buộc gì.
        async function ghiNhanDaGoi(row, k) {
            const dong = `[${formatNowStamp()}] Thử liên lạc - không nghe máy`
            const ghiChuMoi = k.ghi_chu ? `${k.ghi_chu}\n${dong}` : dong
            const { error } = await sb.from('kien').update({ ghi_chu: ghiChuMoi }).eq('id', k.id)
            if (error) { showToast('Lỗi ghi nhận: ' + error.message, 'error'); return }
            k.ghi_chu = ghiChuMoi
            showToast('Đã ghi nhận', 'success')
            renderKienRowView(row, k)
        }

        // "🔍 Đối chiếu SĐT bằng AI" — lớp kiểm tra chéo SĐT gõ tay (#kien-sdt ở hang.html) với
        // số viết tay đọc lại từ ảnh kiện hàng qua qwen-vl-ocr (api/doi-chieu-sdt.js). KHÔNG lưu
        // persistent — tính lại mỗi lần bấm, đóng trang là mất, chấp nhận được cho v1.
        // Kích thước lô nhỏ (BATCH_SIZE) để né rủi ro timeout serverless (repo chưa có
        // vercel.json/maxDuration, chưa xác minh Fluid Compute có bật cho project này hay
        // không) — khởi điểm thận trọng, điều chỉnh sau khi đo latency thật của qwen-vl-ocr.
        const BATCH_SIZE = 3

        // Gọi /api/doi-chieu-sdt theo LÔ (BATCH_SIZE), tuần tự từng lô — dùng chung cho cả 2
        // nhánh compare/read bên dưới. Lô nào cả request lỗi (không phải lỗi 1 item) → đánh dấu
        // toàn bộ kiện trong lô `loi: true`, tiếp tục lô kế tiếp, không mất kết quả lô đã xong.
        async function goiTheoLo(items, body, onProgress) {
            const ketQua = []
            for (let i = 0; i < items.length; i += BATCH_SIZE) {
                const lo = items.slice(i, i + BATCH_SIZE)
                try {
                    const res = await fetch('/api/doi-chieu-sdt', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body(lo))
                    })
                    if (!res.ok) throw new Error('HTTP ' + res.status)
                    const data = await res.json()
                    ketQua.push(...(data.ketQua || []))
                } catch (err) {
                    ketQua.push(...lo.map(k => ({ kien_id: k.id, loi: true })))
                }
                onProgress?.(lo.length)
            }
            return ketQua
        }

        async function chayDoiChieuSdt() {
            const chuyen = chuyenList.find(c => c.id === document.getElementById('chuyen-select').value)
            if (!chuyen) return
            const btn = document.getElementById('btn-doi-chieu-sdt')
            const summaryEl = document.getElementById('doichieu-summary')

            // Query riêng, KHÔNG dùng lại currentKienList (chỉ loại 'huy', kiện 'tra_lai' vẫn
            // nằm trong đó) — ở đây cũng chỉ loại 'huy', giữ nguyên chua_giao/da_giao/tra_lai,
            // vì SĐT sai có thể chính là lý do 1 kiện bị "Trả hàng", đáng để đối chiếu lại.
            // KHÔNG đòi nguoi_nhan_sdt khác null (khác bản trước) — kiện thiếu hẳn SĐT (crew
            // quên gõ) vẫn đủ điều kiện, xử lý ở nhánh 'read' bên dưới thay vì bị loại thẳng.
            // Có `nguoi_gui_sdt` để biết kiện nào ĐÃ có (crew gõ tay trước) — ẩn khỏi khối gợi ý
            // SĐT người gửi bên dưới, không đọc đè cái đã có.
            const { data: dsKien, error } = await sb
                .from('kien')
                .select('id, anh_url, nguoi_nhan_sdt, nguoi_gui_sdt')
                .eq('chuyen_id', chuyen.id)
                .neq('trang_thai', 'huy')
                .not('anh_url', 'is', null)
            if (error) { showToast('Lỗi tải danh sách đối chiếu: ' + error.message, 'error'); return }
            if (!dsKien.length) { showToast('Không có kiện nào có ảnh để đối chiếu', 'error'); return }

            const coSdt = dsKien.filter(k => k.nguoi_nhan_sdt)
            const thieuSdt = dsKien.filter(k => !k.nguoi_nhan_sdt)

            btn.disabled = true
            let daXong = 0
            const tongSo = dsKien.length
            btn.textContent = `🔍 Đang đối chiếu 0/${tongSo}...`
            const capNhatTienDo = n => { daXong += n; btn.textContent = `🔍 Đang đối chiếu ${daXong}/${tongSo}...` }
            const kienMap = new Map(dsKien.map(k => [k.id, k]))

            const [ketQuaCompare, ketQuaRead] = await Promise.all([
                goiTheoLo(coSdt, lo => ({ items: lo.map(k => ({ kien_id: k.id, anh_url: k.anh_url, sdt_da_nhap: k.nguoi_nhan_sdt })) }), capNhatTienDo),
                goiTheoLo(thieuSdt, lo => ({ mode: 'read', items: lo.map(k => ({ kien_id: k.id, anh_url: k.anh_url })) }), capNhatTienDo)
            ])

            btn.disabled = false
            btn.textContent = '🔍 Đối chiếu SĐT bằng AI'

            // response shape mới: mỗi kết quả là { kien_id, nguoi_nhan: <role-result>, nguoi_gui:
            // <role-result> } (hoặc { kien_id, loi: true } nếu cả lô lỗi mạng) — <role-result> là
            // { sdt_ai_doc } | { khong_doc_duoc: true } | { khong_chac, sdt_lan_1, sdt_lan_2 }.
            // Chỉ `nguoi_nhan` có thêm `khop` (từ nhánh compare). Khối SĐT người nhận (lệch/gợi
            // ý/không chắc) giữ nguyên logic cũ, chỉ đổi chỗ đọc field sang r.nguoi_nhan.*.
            const lech = ketQuaCompare.filter(r => r.loi || r.nguoi_nhan?.khong_doc_duoc || !r.nguoi_nhan?.khop)
            // Chỉ gợi ý kiện AI đọc RA được số hợp lệ VÀ đọc nhất quán (2 lần gọi khớp nhau) —
            // đọc không được/lỗi/không chắc thì không có gì đáng tin để gợi ý.
            const goiY = ketQuaRead.filter(r => !r.loi && !r.nguoi_nhan?.khong_doc_duoc && !r.nguoi_nhan?.khong_chac && r.nguoi_nhan?.sdt_ai_doc)
            // "Không chắc" — 2 lần gọi model ra 2 kết quả khác nhau (hoặc chỉ 1 lần đọc ra số) —
            // không đủ tin cậy để tự chọn 1 bên, hiện riêng cả 2 lần đọc để crew tự xem ảnh gốc.
            // Riêng nhánh compare, "không chắc" đã được gộp vào `lech` ở trên (API set khop:false
            // cho case này) nên chỉ lọc từ ketQuaRead ở đây để tránh trùng.
            const khongChac = ketQuaRead.filter(r => r.nguoi_nhan?.khong_chac)

            // Gợi ý SĐT NGƯỜI GỬI — đọc từ CẢ 2 nhánh compare và read (đa số kiện thật đã có sẵn
            // nguoi_nhan_sdt nên đi qua nhánh compare, không phải read — nếu chỉ đọc từ read thì
            // bỏ sót phần lớn kiện). Chỉ gợi ý khi AI đọc được + nhất quán VÀ kiện CHƯA có sẵn
            // nguoi_gui_sdt (không đọc đè giá trị crew đã gõ tay) — KHÔNG có cơ chế tự động ghi,
            // xem CLAUDE.md.
            const goiYNguoiGui = [...ketQuaCompare, ...ketQuaRead].filter(r => {
                if (r.loi || !r.nguoi_gui?.sdt_ai_doc) return false
                const k = kienMap.get(r.kien_id)
                return k && !k.nguoi_gui_sdt
            })

            if (!lech.length && !goiY.length && !khongChac.length && !goiYNguoiGui.length) {
                summaryEl.style.display = 'block'
                summaryEl.innerHTML = `<div>✅ Đã đối chiếu ${coSdt.length} kiện, không phát hiện sai lệch${thieuSdt.length ? ` (${thieuSdt.length} kiện thiếu SĐT, AI không đọc được số nào)` : ''}.</div>`
                return
            }

            let html = ''
            if (lech.length) {
                html += `<div style="font-weight:600; margin-bottom:8px;">⚠️ ${lech.length}/${coSdt.length} kiện có thể lệch SĐT — kiểm tra lại:</div>` +
                    lech.map(r => {
                        const k = kienMap.get(r.kien_id)
                        if (!k) return ''
                        const nn = r.nguoi_nhan
                        const nhan = r.loi ? 'Lỗi khi đọc' : nn?.khong_doc_duoc ? 'Không đọc được' : nn?.khong_chac ? `Không chắc (${nn.sdt_lan_1 || '?'} / ${nn.sdt_lan_2 || '?'})` : nn?.sdt_ai_doc
                        return `
                            <div class="doichieu-row" data-kien-id="${k.id}">
                                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                                <div class="info">
                                    <div class="sdt-cu">Đã gõ: ${k.nguoi_nhan_sdt}</div>
                                    <div class="sdt-ai">AI đọc: ${nhan}</div>
                                </div>
                                <button type="button" class="btn-sm btn-sua-lech">Sửa</button>
                            </div>
                        `
                    }).join('')
            }
            if (goiY.length) {
                html += `<div style="font-weight:600; margin:${lech.length ? '14px' : '0'} 0 8px;">🆕 ${goiY.length} kiện thiếu SĐT — AI gợi ý số:</div>` +
                    goiY.map(r => {
                        const k = kienMap.get(r.kien_id)
                        if (!k) return ''
                        return `
                            <div class="doichieu-row" data-kien-id="${k.id}" data-goi-y="${r.nguoi_nhan.sdt_ai_doc}">
                                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                                <div class="info">
                                    <div class="sdt-goi-y">AI đọc: ${r.nguoi_nhan.sdt_ai_doc}</div>
                                </div>
                            </div>
                        ` }).join('') +
                    `<button type="button" class="btn-sm" id="btn-dien-tat-ca" style="margin-top:8px; width:100%; padding:10px;">⚡ Điền tất cả ${goiY.length} số</button>`
            }
            if (khongChac.length) {
                html += `<div style="font-weight:600; margin:${(lech.length || goiY.length) ? '14px' : '0'} 0 8px;">🤔 ${khongChac.length} kiện AI đọc không chắc — cần xem ảnh gốc:</div>` +
                    khongChac.map(r => {
                        const k = kienMap.get(r.kien_id)
                        if (!k) return ''
                        return `
                            <div class="doichieu-row" data-kien-id="${k.id}">
                                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                                <div class="info">
                                    <div class="sdt-goi-y">2 lần đọc: ${r.nguoi_nhan.sdt_lan_1 || '?'} / ${r.nguoi_nhan.sdt_lan_2 || '?'}</div>
                                </div>
                                <button type="button" class="btn-sm btn-sua-lech">Sửa</button>
                            </div>
                        `
                    }).join('')
            }
            if (goiYNguoiGui.length) {
                // KHÔNG có nút "Điền tất cả"/tự động ghi — nguyên tắc cốt lõi của SĐT người gửi
                // (dữ liệu khách hàng tiềm năng): sai số nằm âm thầm trong DB, không ai phát hiện
                // cho tới khi thật sự gọi lại, nên luôn cần crew xác nhận bằng mắt qua nút "Sửa".
                html += `<div style="font-weight:600; margin:${(lech.length || goiY.length || khongChac.length) ? '14px' : '0'} 0 8px;">📇 ${goiYNguoiGui.length} SĐT người gửi AI gợi ý — xác nhận trước khi lưu:</div>` +
                    goiYNguoiGui.map(r => {
                        const k = kienMap.get(r.kien_id)
                        if (!k) return ''
                        return `
                            <div class="doichieu-row" data-kien-id="${k.id}">
                                ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                                <div class="info">
                                    <div class="sdt-goi-y">Người gửi — AI đọc: ${r.nguoi_gui.sdt_ai_doc}</div>
                                </div>
                                <button type="button" class="btn-sm btn-sua-lech">Sửa</button>
                            </div>
                        `
                    }).join('')
            }
            summaryEl.style.display = 'block'
            summaryEl.innerHTML = html

            // "Sửa" (lệch/không chắc) — mở form sửa bình thường, KHÔNG prefill (2 giá trị xung
            // đột nhau — SĐT đã gõ tay vs AI đọc, hoặc 2 lần AI đọc khác nhau — để trống tránh
            // chọn nhầm bên sai). Đây là kiện ĐÃ có SĐT (crew tự gõ) hoặc AI không đủ tin cậy,
            // khác hẳn khối "thiếu SĐT hoàn toàn" bên dưới nên KHÔNG tự động ghi.
            function moFormSua(btnEl) {
                const kienId = btnEl.closest('.doichieu-row').dataset.kienId
                const row = document.querySelector(`.kien-row[data-kien-id="${kienId}"]`)
                const k = currentKienList.find(kk => kk.id === kienId)
                if (!row || !k) { showToast('Không tìm thấy dòng kiện (có thể chưa tải trong danh sách hiện tại)', 'error'); return }
                row.scrollIntoView({ behavior: 'smooth', block: 'center' })
                renderKienRowEdit(row, k)
            }
            summaryEl.querySelectorAll('.btn-sua-lech').forEach(b => b.addEventListener('click', () => moFormSua(b)))

            // "⚡ Điền tất cả" — kiện HOÀN TOÀN THIẾU SĐT (khác khối lệch ở trên, không có gì để
            // xung đột) tự động ghi thẳng nguoi_nhan_sdt, theo quyết định owner (2026-09-10):
            // ưu tiên giảm thao tác, chấp nhận rủi ro còn lại của OCR chữ viết tay thay vì bắt
            // xác nhận tay từng kiện. 1 confirmDialog() duy nhất cho cả lô, không mở form Sửa.
            document.getElementById('btn-dien-tat-ca')?.addEventListener('click', async (e) => {
                const btnDien = e.currentTarget
                if (!(await confirmDialog(
                    `Tự động điền SĐT cho ${goiY.length} kiện bằng số AI đọc được? Đây là số do AI OCR đọc từ ảnh, không phải crew gõ tay xác nhận — vẫn có thể sai nếu chữ viết tay mờ, sửa lại tay từng kiện sau nếu phát hiện sai.`,
                    { danger: true, okText: 'Điền tất cả' }
                ))) return

                btnDien.disabled = true
                let thanhCong = 0
                for (const r of goiY) {
                    const k = kienMap.get(r.kien_id)
                    if (!k) continue
                    // Guard `.is('nguoi_nhan_sdt', null)` — phòng trường hợp crew đã tự gõ SĐT
                    // cho đúng kiện này (qua "Sửa" ở dòng kiện chính) trong lúc đang xem khối gợi
                    // ý này, tránh ghi đè giá trị crew vừa nhập bằng số AI đọc trong danh sách cũ.
                    const { data, error } = await sb.from('kien')
                        .update({ nguoi_nhan_sdt: r.nguoi_nhan.sdt_ai_doc })
                        .eq('id', k.id)
                        .is('nguoi_nhan_sdt', null)
                        .select('id')
                    if (error || !data?.length) continue
                    thanhCong++
                    const dongAudit = `[${formatNowStamp()}] AI tự điền SĐT: ${r.nguoi_nhan.sdt_ai_doc}`
                    const ghiChuMoi = k.ghi_chu ? `${k.ghi_chu}\n${dongAudit}` : dongAudit
                    sb.from('kien').update({ ghi_chu: ghiChuMoi }).eq('id', k.id).then(() => {}) // best-effort, không chặn
                }
                showToast(`Đã tự động điền SĐT cho ${thanhCong}/${goiY.length} kiện`, 'success')
                loadManifest(chuyen)
            })
        }

        document.getElementById('btn-doi-chieu-sdt').addEventListener('click', chayDoiChieuSdt)

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            await loadChuyenOptions()
        }

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
