<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .chuyen-select-wrap { padding: 16px; }
        .tinh-group { margin: 0 16px 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .tinh-group h3 { margin: 0; padding: 12px 16px; background: var(--bg); font-size: 16px; }
        .kien-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            border-top: 1px solid var(--border); font-size: 14px;
        }
        .kien-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .kien-row .info { flex: 1; }
        .kien-row .diem { font-weight: 600; }
        .kien-row .mota { color: var(--text-muted); font-size: 13px; }
        .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
        .badge.chua_giao { background: #fdecea; color: var(--danger); }
        .badge.da_giao { background: #eafaf1; color: var(--success); }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-nav-desktop"><a href="hang.html" style="color:inherit;text-decoration:none;">+ Nhập kiện</a></div>
        </div>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📋 Danh sách kiện hàng</span>
        </h2>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-nav-desktop"><a href="#" id="btn-logout" style="color:inherit;text-decoration:none;">Đăng xuất</a></div>
        </div>
    </div>

    <div class="chuyen-select-wrap">
        <select id="chuyen-select" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:#1a1a2e;background:white"></select>
    </div>

    <div id="list-wrap"></div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script>
        const sb = createSb()
        let chuyenList = []

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        // chuyen(id, chieu, khoi_hanh, trang_thai, ghi_chu, tao_boi, created_at)
        async function loadChuyenOptions() {
            const { data, error } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .order('created_at', { ascending: false })
                .limit(50)
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            chuyenList = data || []
            const sel = document.getElementById('chuyen-select')
            sel.textContent = ''
            if (!chuyenList.length) {
                sel.innerHTML = '<option value="">Chưa có chuyến nào</option>'
                document.getElementById('list-wrap').innerHTML = '<div class="empty">Chưa có chuyến nào</div>'
                return
            }
            chuyenList.forEach(c => {
                const chieuLabel = c.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
                const opt = document.createElement('option')
                opt.value = c.id
                opt.textContent = `${chieuLabel} — ${formatDate(c.khoi_hanh)}${c.trang_thai === 'xong' ? ' (đã xong)' : ''}`
                sel.appendChild(opt)
            })
            sel.value = chuyenList[0].id
            loadManifest(chuyenList[0])
        }

        document.getElementById('chuyen-select').addEventListener('change', e => {
            const chuyen = chuyenList.find(c => c.id === e.target.value)
            if (chuyen) loadManifest(chuyen)
        })

        // tinh_tuyen(ma PK, ten, thu_tu). diem(id, ten, tinh_ma). kien(id, chuyen_id, diem_id,
        // anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at).
        // Chiều bac = ASC thu_tu, nam = DESC thu_tu.
        async function loadManifest(chuyen) {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''

            const { data: tinhList, error: tinhErr } = await sb
                .from('tinh_tuyen')
                .select('ma, ten, thu_tu')
                .order('thu_tu', { ascending: chuyen.chieu === 'bac' })
            if (tinhErr) { showToast('Lỗi tải tỉnh: ' + tinhErr.message, 'error'); return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('id, diem_id, anh_url, nguoi_nhan_sdt, trang_thai, ghi_chu, created_at, diem(ten, tinh_ma)')
                .eq('chuyen_id', chuyen.id)
                .order('created_at', { ascending: true })
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }

            let any = false
            tinhList.forEach(tinh => {
                const kiensCuaTinh = kienList.filter(k => k.diem?.tinh_ma === tinh.ma)
                if (!kiensCuaTinh.length) return
                any = true

                const group = document.createElement('div')
                group.className = 'tinh-group'
                const h3 = document.createElement('h3')
                h3.textContent = `${tinh.ten} (${kiensCuaTinh.length})`
                group.appendChild(h3)

                kiensCuaTinh.forEach(k => {
                    const row = document.createElement('div')
                    row.className = 'kien-row'
                    row.innerHTML = `
                        ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                        <div class="info">
                            <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                            ${k.nguoi_nhan_sdt ? `<div class="mota">SĐT: ${k.nguoi_nhan_sdt}</div>` : ''}
                            ${k.ghi_chu ? `<div class="mota">${k.ghi_chu}</div>` : ''}
                        </div>
                        <span class="badge ${k.trang_thai}">${k.trang_thai === 'da_giao' ? 'Đã giao' : 'Chưa giao'}</span>
                    `
                    group.appendChild(row)
                })
                wrap.appendChild(group)
            })

            if (!any) wrap.innerHTML = '<div class="empty">Chuyến này chưa có kiện hàng nào</div>'
        }

        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault()
            await sb.auth.signOut()
            window.location.href = 'login.html'
        })

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            await loadChuyenOptions()
        }

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
