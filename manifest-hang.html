<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .dir-toggle { display: flex; gap: 8px; padding: 16px; }
        .dir-btn {
            flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
            background: var(--white); cursor: pointer; font-size: 15px; text-align: center;
        }
        .dir-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tinh-group { margin: 0 16px 16px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .tinh-group h3 { margin: 0; padding: 12px 16px; background: var(--bg); font-size: 16px; }
        .kien-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            border-top: 1px solid var(--border); font-size: 14px;
        }
        .kien-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
        .kien-row .info { flex: 1; }
        .kien-row .diem { font-weight: 600; }
        .kien-row .mota { color: var(--text-muted); font-size: 13px; }
        .empty { padding: 24px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-nav-desktop"><a href="hang.html" style="color:inherit;text-decoration:none;">+ Nhập kiện</a></div>
        </div>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📋 Danh sách kiện hàng</span>
        </h2>
        <div style="display:flex; align-items:center; gap:8px;">
            <div class="header-nav-desktop"><a href="#" id="btn-logout" style="color:inherit;text-decoration:none;">Đăng xuất</a></div>
        </div>
    </div>

    <div class="dir-toggle">
        <div class="dir-btn active" id="dir-bac" data-dir="bac">⬆️ Chiều Bắc (ĐL → HD)</div>
        <div class="dir-btn" id="dir-nam" data-dir="nam">⬇️ Chiều Nam (HD → ĐL)</div>
    </div>

    <div id="list-wrap"></div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script>
        const sb = createSb()
        let currentDir = 'bac'

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        // GIẢ ĐỊNH SCHEMA: kien(id, tinh_id, diem_id, mo_ta, anh_url, created_at),
        // diem(id, tinh_id, ten), tinh_tuyen(id, ten, thu_tu).
        // Chiều bắc = ASC thu_tu, chiều nam = DESC thu_tu — đối chiếu eakar_hang_v1.sql khi có.
        async function loadManifest() {
            const wrap = document.getElementById('list-wrap')
            wrap.textContent = ''

            const { data: tinhList, error: tinhErr } = await sb
                .from('tinh_tuyen')
                .select('id, ten, thu_tu')
                .order('thu_tu', { ascending: currentDir === 'bac' })
            if (tinhErr) { showToast('Lỗi tải tỉnh: ' + tinhErr.message, 'error'); return }

            if (!tinhList.length) { wrap.innerHTML = '<div class="empty">Chưa có dữ liệu tỉnh/tuyến</div>'; return }

            const { data: kienList, error: kienErr } = await sb
                .from('kien')
                .select('id, tinh_id, diem_id, mo_ta, anh_url, created_at, diem(ten)')
                .order('created_at', { ascending: true })
            if (kienErr) { showToast('Lỗi tải kiện: ' + kienErr.message, 'error'); return }

            let any = false
            tinhList.forEach(tinh => {
                const kiensCuaTinh = kienList.filter(k => k.tinh_id === tinh.id)
                if (!kiensCuaTinh.length) return
                any = true

                const group = document.createElement('div')
                group.className = 'tinh-group'
                const h3 = document.createElement('h3')
                h3.textContent = `${tinh.ten} (${kiensCuaTinh.length})`
                group.appendChild(h3)

                kiensCuaTinh.forEach(k => {
                    const row = document.createElement('div')
                    row.className = 'kien-row'
                    row.innerHTML = `
                        ${k.anh_url ? `<img src="${k.anh_url}" alt="">` : ''}
                        <div class="info">
                            <div class="diem">${k.diem?.ten || '(không rõ điểm)'}</div>
                            ${k.mo_ta ? `<div class="mota">${k.mo_ta}</div>` : ''}
                        </div>
                        <div class="mota">${formatDate(k.created_at)}</div>
                    `
                    group.appendChild(row)
                })
                wrap.appendChild(group)
            })

            if (!any) wrap.innerHTML = '<div class="empty">Chưa có kiện hàng nào</div>'
        }

        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'))
                btn.classList.add('active')
                currentDir = btn.dataset.dir
                loadManifest()
            })
        })

        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault()
            localStorage.removeItem('driver_token')
            await sb.auth.signOut()
            window.location.href = 'login-sdt.html'
        })

        async function initPage() {
            const auth = await requireRole(sb, ['driver', 'owner'])
            if (!auth) return
            await loadManifest()
        }

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
