<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .step { display: none; }
        .step.active { display: block; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
        .chip {
            padding: 10px 16px; border-radius: 20px; border: 1.5px solid var(--border);
            background: var(--white); cursor: pointer; font-size: 15px; color: var(--text);
        }
        .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        #btn-toggle-new-chuyen:disabled { opacity: 0.5; cursor: not-allowed; }
        .diem-list, .chuyen-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .diem-item, .chuyen-item {
            padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--white); cursor: pointer;
        }
        .diem-item.selected, .chuyen-item.selected { border-color: var(--primary); background: #eaf2fc; }
        .chuyen-item .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .chuyen-item-xong { opacity: 0.7; }
        .chuyen-item-xong .sub::after { content: ' · xem lại'; color: var(--text-muted); }
        .camera-box {
            margin: 16px; padding: 24px; border: 2px dashed var(--border); border-radius: var(--radius);
            text-align: center; background: var(--white); cursor: pointer;
        }
        #kien-preview { display: none; margin: 0 16px 16px; }
        #kien-preview img { width: 100%; border-radius: var(--radius-sm); }
        .form-actions { padding: 16px; display: flex; gap: 8px; }
        #queue-status { padding: 8px 16px; font-size: 13px; color: var(--text-muted); }
        .current-chuyen-bar {
            padding: 10px 16px; background: var(--white); border-bottom: 1px solid var(--border);
            font-size: 13px; color: var(--text-muted); display: none;
        }
        .btn-cod-toggle {
            padding: 10px 16px; border-radius: 20px; border: 1.5px solid var(--warning);
            background: var(--white); cursor: pointer; font-size: 15px; color: var(--warning); font-weight: 600;
        }
        .btn-cod-toggle.active { background: var(--warning); color: #fff; }
        #kien-thu-ho-wrap { display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <div></div>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📦 Nhập kiện hàng</span>
        </h2>
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
    </div>

    <div class="current-chuyen-bar" id="current-chuyen-bar"></div>
    <div id="queue-status"></div>

    <!-- Step 0: chọn / tạo chuyến -->
    <div class="step active" id="step-chuyen">
        <p style="padding:16px 16px 0; font-weight:600;">0. Chọn chuyến đang chạy</p>
        <div class="chuyen-list" id="chuyen-list"></div>
        <div style="padding:8px 16px;">
            <button class="btn btn-full" id="btn-toggle-new-chuyen" type="button">+ Tạo chuyến mới</button>
            <div id="new-chuyen-blocked-note" style="display:none; color:var(--text-muted); font-size:13px; margin-top:6px;">
                Đang có chuyến chạy — chọn chuyến ở trên để tiếp tục, không tạo chuyến mới khi chuyến cũ chưa xong.
            </div>
        </div>
        <div id="new-chuyen-form" style="display:none; padding:0 16px;">
            <div class="form-group">
                <label>Chiều</label>
                <select id="new-chuyen-chieu" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;color:#1a1a2e;background:white">
                    <option value="bac">Bắc (Đắk Lắk → Hải Dương)</option>
                    <option value="nam">Nam (Hải Dương → Đắk Lắk)</option>
                </select>
            </div>
            <button class="btn btn-full btn-success" id="btn-save-chuyen" type="button">Tạo chuyến</button>
        </div>
    </div>

    <!-- Step 1: chọn tỉnh -->
    <div class="step" id="step-tinh">
        <p style="padding:16px 16px 0; font-weight:600;">1. Chọn tỉnh</p>
        <div class="chip-row" id="tinh-chips"></div>
    </div>

    <!-- Step 2: chọn / tạo điểm -->
    <div class="step" id="step-diem">
        <p style="padding:16px 16px 0; font-weight:600;">2. Chọn điểm nhận/giao</p>
        <div style="padding:8px 16px;">
            <input type="text" id="diem-search" placeholder="Gõ tên điểm..." style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;">
        </div>
        <div class="diem-list" id="diem-list"></div>
        <div style="padding:8px 16px;">
            <button class="btn btn-full" id="btn-new-diem" type="button">+ Tạo điểm mới</button>
        </div>
    </div>

    <!-- Step 3: ảnh + thông tin kiện -->
    <div class="step" id="step-anh">
        <p style="padding:16px 16px 0; font-weight:600;">3. Chụp ảnh kiện hàng</p>
        <div class="camera-box" id="camera-box">
            <input type="file" accept="image/*" capture="environment" id="kien-camera-input" style="display:none;">
            <div>📷 Chạm để chụp ảnh</div>
        </div>
        <div id="kien-preview"><img id="kien-preview-img" alt=""></div>
        <div style="padding:0 16px;">
            <div class="form-group">
                <label>SĐT người nhận</label>
                <input type="tel" id="kien-sdt" placeholder="SĐT người nhận (tùy chọn)">
            </div>
            <div class="form-group">
                <label>Ghi chú</label>
                <textarea id="kien-ghichu" placeholder="Ghi chú kiện hàng (tùy chọn)" rows="3" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;"></textarea>
            </div>
            <div class="form-group">
                <button class="btn-cod-toggle" id="btn-thu-ho-toggle" type="button">💰 Thu hộ (COD)</button>
                <div id="kien-thu-ho-wrap">
                    <input type="number" inputmode="numeric" id="kien-thu-ho" placeholder="Số tiền cần thu hộ (đ)" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:15px;">
                </div>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-full btn-success" id="btn-save-kien" type="button">Lưu kiện hàng</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script src="point-match.js"></script>
    <script src="idb-queue.js"></script>
    <script>
        const sb = createSb()
        let currentUser = null
        let currentChuyen = null  // { id, chieu, khoi_hanh, ghi_chu }
        let selectedTinh = null   // { ma, ten, thu_tu }
        let selectedDiem = null   // { id, ten, tinh_ma }
        let allDiemInTinh = []
        let activePhotoBlob = null

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        function goToStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'))
            document.getElementById(id).classList.add('active')
        }

        function updateChuyenBar() {
            const bar = document.getElementById('current-chuyen-bar')
            if (!currentChuyen) { bar.style.display = 'none'; return }
            const chieuLabel = currentChuyen.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
            bar.textContent = `Chuyến: ${chieuLabel}${currentChuyen.ghi_chu ? ' — ' + currentChuyen.ghi_chu : ''}`
            bar.style.display = 'block'
        }

        function renderChuyenItem(c) {
            const item = document.createElement('div')
            item.className = 'chuyen-item'
            const chieuLabel = c.chieu === 'bac' ? 'Bắc (ĐL → HD)' : 'Nam (HD → ĐL)'
            const trangThaiLabel = c.trang_thai === 'xong' ? ' (đã xong)' : ''
            item.innerHTML = `<div>${chieuLabel}${trangThaiLabel}</div><div class="sub">${formatDate(c.khoi_hanh)}${c.ghi_chu ? ' — ' + c.ghi_chu : ''}</div>`
            return item
        }

        function renderChuyenGroupHeader(text) {
            const h = document.createElement('p')
            h.style.cssText = 'padding:12px 16px 4px; font-weight:600; font-size:13px; color:var(--text-muted);'
            h.textContent = text
            return h
        }

        // Hiện cả chuyến đang chạy (bấm để chọn rồi nhập kiện mới) lẫn chuyến đã xong
        // (bấm để XEM lại ở manifest-hang.html, không cho nhập thêm kiện) — 50 chuyến gần
        // nhất, cùng giới hạn với lich-su-chuyen.html.
        async function loadChuyenList() {
            const { data, error } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .order('created_at', { ascending: false })
                .limit(50)
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            const wrap = document.getElementById('chuyen-list')
            wrap.textContent = ''

            const dangChay = data.filter(c => c.trang_thai === 'dang_chay')
            const daXong = data.filter(c => c.trang_thai === 'xong')

            const btnNewChuyen = document.getElementById('btn-toggle-new-chuyen')
            const blockedNote = document.getElementById('new-chuyen-blocked-note')
            const hasActive = dangChay.length > 0
            btnNewChuyen.disabled = hasActive
            blockedNote.style.display = hasActive ? 'block' : 'none'
            if (hasActive) document.getElementById('new-chuyen-form').style.display = 'none'

            if (!dangChay.length && !daXong.length) {
                wrap.innerHTML = '<div style="color:var(--text-muted); font-size:14px; padding:0 16px;">Chưa có chuyến nào, tạo chuyến mới bên dưới.</div>'
                return
            }

            if (dangChay.length) {
                wrap.appendChild(renderChuyenGroupHeader('Chuyến đang chạy'))
                dangChay.forEach(c => {
                    const item = renderChuyenItem(c)
                    item.addEventListener('click', () => selectChuyen(c, item))
                    wrap.appendChild(item)
                })
            }

            if (daXong.length) {
                wrap.appendChild(renderChuyenGroupHeader('Chuyến đã hoàn thành'))
                daXong.forEach(c => {
                    const item = renderChuyenItem(c)
                    item.classList.add('chuyen-item-xong')
                    item.addEventListener('click', () => {
                        location.href = `manifest-hang.html?chuyen_id=${c.id}`
                    })
                    wrap.appendChild(item)
                })
            }
        }

        function selectChuyen(chuyen, itemEl) {
            document.querySelectorAll('#chuyen-list .chuyen-item').forEach(i => i.classList.remove('selected'))
            if (itemEl) itemEl.classList.add('selected')
            currentChuyen = chuyen
            updateChuyenBar()
            loadTinh()
            goToStep('step-tinh')
        }

        document.getElementById('btn-toggle-new-chuyen').addEventListener('click', () => {
            const form = document.getElementById('new-chuyen-form')
            form.style.display = form.style.display === 'none' ? 'block' : 'none'
        })

        document.getElementById('btn-save-chuyen').addEventListener('click', async () => {
            const chieu = document.getElementById('new-chuyen-chieu').value
            // tao_boi có default auth.uid() ở DB — không cần gửi từ client. khoi_hanh = giờ
            // tạo chuyến luôn (không cho nhập tay) — chuyến luôn tạo ngay lúc xe chuẩn bị chạy.
            const { data, error } = await sb.from('chuyen').insert({
                chieu,
                khoi_hanh: new Date().toISOString(),
                trang_thai: 'dang_chay'
            }).select().single()
            if (error) { showToast('Lỗi tạo chuyến: ' + error.message, 'error'); return }
            showToast('Đã tạo chuyến mới', 'success')
            selectChuyen(data, null)
        })

        // tinh_tuyen(ma PK, ten, ten_moi, thu_tu). Chiều bac = ASC thu_tu, nam = DESC thu_tu.
        async function loadTinh() {
            const { data, error } = await sb
                .from('tinh_tuyen')
                .select('ma, ten, thu_tu')
                .order('thu_tu', { ascending: currentChuyen.chieu === 'bac' })
            if (error) { showToast('Lỗi tải danh sách tỉnh: ' + error.message, 'error'); return }
            const wrap = document.getElementById('tinh-chips')
            wrap.textContent = ''
            // Đắk Lắk luôn là điểm bốc hàng (không phải điểm giao); Khánh Hòa không chạy tuyến này — loại khỏi danh sách chọn
            data.filter(t => t.ma !== 'DLK' && t.ten !== 'Khánh Hòa').forEach(t => {
                const chip = document.createElement('div')
                chip.className = 'chip'
                chip.textContent = t.ten
                chip.addEventListener('click', () => selectTinh(t, chip))
                wrap.appendChild(chip)
            })
        }

        function selectTinh(tinh, chipEl) {
            document.querySelectorAll('#tinh-chips .chip').forEach(c => c.classList.remove('selected'))
            chipEl.classList.add('selected')
            selectedTinh = tinh
            loadDiem(tinh.ma)
            goToStep('step-diem')
        }

        // diem(id, ten, ten_norm, tinh_ma FK, huyen_cu, lat, lng, km_moc, so_lan_giao, created_at)
        // UNIQUE(tinh_ma, ten_norm) — DB tự chặn trùng khi insert.
        async function loadDiem(tinhMa) {
            const { data, error } = await sb.from('diem').select('id, ten, ten_norm, tinh_ma').eq('tinh_ma', tinhMa).order('ten')
            if (error) { showToast('Lỗi tải điểm: ' + error.message, 'error'); return }
            allDiemInTinh = data || []
            renderDiemList(allDiemInTinh)
        }

        function renderDiemList(list) {
            const wrap = document.getElementById('diem-list')
            wrap.textContent = ''
            list.forEach(d => {
                const item = document.createElement('div')
                item.className = 'diem-item'
                item.textContent = d.ten
                item.addEventListener('click', () => selectDiem(d, item))
                wrap.appendChild(item)
            })
        }

        function selectDiem(diem, itemEl) {
            document.querySelectorAll('#diem-list .diem-item').forEach(i => i.classList.remove('selected'))
            itemEl.classList.add('selected')
            selectedDiem = diem
            goToStep('step-anh')
        }

        document.getElementById('diem-search').addEventListener('input', e => {
            const q = e.target.value
            if (!q) { renderDiemList(allDiemInTinh); return }
            renderDiemList(timDiemTrung(allDiemInTinh, q))
        })

        document.getElementById('btn-new-diem').addEventListener('click', async () => {
            const ten = document.getElementById('diem-search').value.trim()
            if (!ten) { showToast('Nhập tên điểm trước', 'error'); return }
            const trung = timDiemTrung(allDiemInTinh, ten)
            if (trung.length && !confirm(`Đã có điểm gần giống: "${trung[0].ten}". Vẫn tạo điểm mới?`)) return
            const { data, error } = await sb.from('diem').insert({
                tinh_ma: selectedTinh.ma,
                ten,
                ten_norm: boDau(ten)
            }).select().single()
            if (error) {
                if (error.code === '23505') {
                    // UNIQUE(tinh_ma, ten_norm) đụng — điểm đã tồn tại, refetch rồi chọn lại
                    showToast('Điểm này đã tồn tại, đang chọn điểm có sẵn...', '')
                    await loadDiem(selectedTinh.ma)
                    const existed = allDiemInTinh.find(d => d.ten_norm === boDau(ten))
                    if (existed) { selectedDiem = existed; goToStep('step-anh'); return }
                }
                showToast('Lỗi tạo điểm: ' + error.message, 'error')
                return
            }
            allDiemInTinh.push(data)
            selectedDiem = data
            goToStep('step-anh')
        })

        document.getElementById('btn-thu-ho-toggle').addEventListener('click', function () {
            const active = this.classList.toggle('active')
            const wrap = document.getElementById('kien-thu-ho-wrap')
            wrap.style.display = active ? 'block' : 'none'
            if (!active) document.getElementById('kien-thu-ho').value = ''
        })

        document.getElementById('camera-box').addEventListener('click', () => {
            document.getElementById('kien-camera-input').click()
        })
        document.getElementById('kien-camera-input').addEventListener('change', function () {
            if (!this.files || !this.files[0]) return
            activePhotoBlob = this.files[0]
            const reader = new FileReader()
            reader.onload = e => {
                document.getElementById('kien-preview-img').src = e.target.result
                document.getElementById('kien-preview').style.display = 'block'
            }
            reader.readAsDataURL(activePhotoBlob)
        })

        document.getElementById('btn-save-kien').addEventListener('click', async () => {
            if (!currentChuyen || !selectedTinh || !selectedDiem) { showToast('Thiếu chuyến/tỉnh/điểm', 'error'); return }
            const thuHoActive = document.getElementById('btn-thu-ho-toggle').classList.contains('active')
            let tienThuHo = null
            if (thuHoActive) {
                const raw = document.getElementById('kien-thu-ho').value.trim()
                tienThuHo = raw === '' ? NaN : Number(raw)
                if (!Number.isFinite(tienThuHo) || tienThuHo <= 0) { showToast('Nhập số tiền thu hộ hợp lệ', 'error'); return }
            }
            const record = {
                id: crypto.randomUUID(),
                chuyen_id: currentChuyen.id,
                diem_id: selectedDiem.id,
                nguoi_nhan_sdt: document.getElementById('kien-sdt').value.trim() || null,
                ghi_chu: document.getElementById('kien-ghichu').value.trim() || null,
                trang_thai: 'chua_giao',
                tien_thu_ho: tienThuHo,
                anh_blob: activePhotoBlob || null,
                created_at: new Date().toISOString(),
                da_sync: false
            }
            await queueKien(record)
            showToast('Đã lưu kiện hàng' + (navigator.onLine ? '' : ' (offline, sẽ tự đồng bộ)'), 'success')
            trySyncQueue(sb).then(updateQueueStatus)

            // reset về bước 1 (chọn tỉnh) để nhập kiện tiếp theo trong cùng chuyến
            activePhotoBlob = null
            document.getElementById('kien-preview').style.display = 'none'
            document.getElementById('kien-sdt').value = ''
            document.getElementById('kien-ghichu').value = ''
            document.getElementById('btn-thu-ho-toggle').classList.remove('active')
            document.getElementById('kien-thu-ho-wrap').style.display = 'none'
            document.getElementById('kien-thu-ho').value = ''
            goToStep('step-tinh')
        })

        async function updateQueueStatus() {
            const pending = await getUnsyncedKien()
            const el = document.getElementById('queue-status')
            el.textContent = pending.length ? `⏳ ${pending.length} kiện chưa đồng bộ` : ''
        }

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            currentUser = auth.user
            await loadChuyenList()
            setupQueueAutoSync(sb)
            updateQueueStatus()
            setInterval(updateQueueStatus, 5000)
        }

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        setupLogoutListener(sb)
        initPage()
    </script>
</body>
</html>
