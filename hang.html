<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1565c0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Nhập kiện hàng</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg); padding-bottom: 40px; }
        .step { display: none; }
        .step.active { display: block; }
        #review-card {
            margin: 16px; padding: 16px; background: var(--white); border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        #review-card img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; display: block; }
        #review-card .diem { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        #review-card .mota { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
        #review-card .cuoc { color: var(--success); font-weight: 600; font-size: 14px; margin-top: 6px; }
        #review-card .cod { color: var(--warning); font-weight: 600; font-size: 14px; margin-top: 6px; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px; }
        .chip {
            padding: 10px 16px; border-radius: 20px; border: 1.5px solid var(--border);
            background: var(--white); cursor: pointer; font-size: 15px; color: var(--text);
        }
        .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }
        .chuyen-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
        .diem-item, .chuyen-item {
            padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            background: var(--white); cursor: pointer;
        }
        .diem-item.selected, .chuyen-item.selected { border-color: var(--primary); background: #eaf2fc; }
        /* Danh sách gợi ý điểm bên dưới ô "Gõ tên điểm..." — thụt vào trong (margin-left) +
           nhỏ/nhạt hơn ô nhập (border mảnh hơn, nền xám nhạt, chữ mờ hơn) để phân biệt rõ đây
           là gợi ý phụ thuộc ô nhập phía trên, không phải 1 danh sách lựa chọn ngang hàng. */
        .diem-list { padding: 0 16px 16px 40px; display: flex; flex-direction: column; gap: 6px; }
        .diem-list .diem-item {
            padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: #f5f7fa; font-size: 14px; color: var(--text-muted);
        }
        .diem-list .diem-item.selected { border-color: var(--primary); background: #eaf2fc; color: var(--text); }
        .chuyen-item .sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .camera-box {
            margin: 16px; padding: 24px; border: 2px dashed var(--primary); border-radius: var(--radius);
            text-align: center; background: linear-gradient(135deg, #eaf2fc, #f5f9ff); cursor: pointer;
            color: var(--primary); font-weight: 600;
        }
        #kien-preview { display: none; margin: 0 16px 16px; }
        #camera-live { display: none; margin: 16px; }
        #camera-live video { width: 100%; border-radius: var(--radius); background: #000; display: block; }
        #camera-live .camera-live-actions { display: flex; gap: 8px; margin-top: 10px; }
        #kien-preview img { width: 100%; border-radius: var(--radius-sm); }
        .form-actions { padding: 16px; display: flex; gap: 8px; }
        #queue-status { padding: 8px 16px; font-size: 13px; color: var(--text-muted); }
        .current-chuyen-bar {
            padding: 10px 16px; background: var(--white); border-bottom: 1px solid var(--border);
            font-size: 13px; color: var(--text-muted); display: none;
            align-items: center; justify-content: space-between; gap: 8px;
        }
        .current-chuyen-bar.show { display: flex; }
        .btn-xem-manifest {
            flex-shrink: 0; padding: 6px 12px; border-radius: 14px; border: 1.5px solid var(--primary);
            background: var(--white); color: var(--primary); font-size: 12px; font-weight: 600;
            text-decoration: none; white-space: nowrap;
        }
        .btn-cod-toggle {
            padding: 10px 16px; border-radius: 20px; border: 1.5px solid var(--warning);
            background: var(--white); cursor: pointer; font-size: 15px; color: var(--warning); font-weight: 600;
        }
        .btn-cod-toggle.active { background: var(--warning); color: #fff; }
        #kien-thu-ho-wrap { display: none; margin-top: 10px; }
        .chip[data-loai="Thùng giấy"] { border-color: #c17a2e; color: #a3621f; background: #fdf3e7; }
        .chip[data-loai="Thùng xốp"]  { border-color: #2196c9; color: #1a7ba3; background: #e6f6fc; }
        .chip[data-loai="Bao"]        { border-color: var(--success); color: var(--success); background: var(--success-light); }
        .chip[data-loai="__khac__"]   { border-color: #8e5fd1; color: #7548b8; background: #f3edfc; }
        .loaihang-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-top: 8px;
            background: var(--white); border: 1.5px solid var(--border); border-left: 5px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .loaihang-item[data-loai="Thùng giấy"] { border-left-color: #c17a2e; }
        .loaihang-item[data-loai="Thùng xốp"]  { border-left-color: #2196c9; }
        .loaihang-item[data-loai="Bao"]        { border-left-color: var(--success); }
        .loaihang-item[data-loai="khac"]       { border-left-color: #8e5fd1; }
        .loaihang-item-icon { font-size: 18px; flex-shrink: 0; }
        .loaihang-item-ten { flex: 1; font-size: 15px; min-width: 0; }
        .loaihang-item .qty-stepper-sm { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .loaihang-item .btn-qty-sm {
            width: 32px; height: 32px; flex-shrink: 0; border-radius: 6px;
            border: 1.5px solid var(--border); background: var(--white);
            font-size: 16px; line-height: 1; cursor: pointer; color: var(--text);
        }
        .loaihang-item .btn-qty-sm.item-plus { border-color: var(--primary); color: var(--primary); }
        .loaihang-item .btn-qty-sm.item-minus { border-color: var(--danger); color: var(--danger); }
        .loaihang-item .item-qty-input {
            width: 48px; flex-shrink: 0; text-align: center; font-size: 16px; font-weight: 600;
            border: 1.5px solid var(--border); border-radius: 6px; padding: 6px 2px; color: var(--text);
        }
        .loaihang-item .item-qty-input::-webkit-outer-spin-button,
        .loaihang-item .item-qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .loaihang-item .item-qty-input[type=number] { -moz-appearance: textfield; }
        .loaihang-item .item-remove {
            flex-shrink: 0; width: 28px; height: 28px; border: none; background: none;
            color: var(--text-muted); font-size: 16px; cursor: pointer;
        }
        /* Tablet (2026-09-21) — container cap, CHỈ thêm rule mới, không sửa rule mobile hiện có.
           Áp thẳng lên <body> (không bọc thêm div nào — trang này vốn không có wrapper content,
           header/step đều là con trực tiếp của body) — cách ít đụng DOM nhất, cùng pattern
           body{max-width} đã có sẵn ở dat-ve.html. Điều kiện (min-height:480px) loại điện thoại
           xoay ngang (~844x390) khỏi rule này — xem CLAUDE.md mục "Tối ưu mobile / PWA". 720px vì
           đây là trang form/nhập liệu nhiều bước (khác trang danh sách dùng 960px). */
        @media (min-width: 768px) and (min-height: 480px) {
            body { max-width: 720px; margin: 0 auto; box-shadow: 0 0 0 1px var(--border); }
        }
    </style>
</head>
<body>
    <div class="header">
        <button id="btn-open-menu" class="btn-icon" aria-label="Menu" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">☰</button>
        <h2 style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
            <span class="header-text">📦 Nhập kiện hàng</span>
        </h2>
        <div></div>
    </div>

    <div class="current-chuyen-bar" id="current-chuyen-bar"></div>
    <div id="queue-status"></div>

    <!-- Step 0: chọn / tạo chuyến -->
    <div class="step active" id="step-chuyen">
        <p style="padding:16px 16px 0; font-weight:600;">0. Chọn chuyến đang chạy</p>
        <div class="chuyen-list" id="chuyen-list"></div>
        <div style="padding:8px 16px;">
            <button class="btn btn-full" id="btn-toggle-new-chuyen" type="button">+ Tạo chuyến mới</button>
        </div>
        <div id="new-chuyen-form" style="display:none; padding:0 16px;">
            <div class="form-group">
                <label>Chiều</label>
                <select id="new-chuyen-chieu" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:#1a1a2e;background:white">
                    <option value="bac">Ra Bắc (Đắk Lắk → Hải Dương)</option>
                    <option value="nam">Vào Nam (Hải Dương → Đắk Lắk)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Ngày giờ khởi hành</label>
                <input type="datetime-local" id="new-chuyen-khoi-hanh" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;color:#1a1a2e;background:white">
            </div>
            <button class="btn btn-full btn-success" id="btn-save-chuyen" type="button">Tạo chuyến</button>
        </div>
    </div>

    <!-- Step 1: chọn tỉnh -->
    <div class="step" id="step-tinh">
        <p style="padding:16px 16px 0; font-weight:600;">1. Giao đến</p>
        <div class="chip-row" id="tinh-chips"></div>
    </div>

    <!-- Step 2: chọn / tạo điểm -->
    <div class="step" id="step-diem">
        <p style="padding:16px 16px 0; font-weight:600;">2. Chọn điểm nhận/giao</p>
        <div style="padding:8px 16px;">
            <input type="text" id="diem-search" placeholder="Gõ tên điểm..." style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;">
        </div>
        <div class="diem-list" id="diem-list"></div>
        <div style="padding:8px 16px;">
            <button class="btn btn-full" id="btn-new-diem" type="button">+ Tạo điểm mới</button>
        </div>
    </div>

    <!-- Step 3: ảnh + thông tin kiện -->
    <div class="step" id="step-anh">
        <p style="padding:16px 16px 0; font-weight:600;">3. Chụp ảnh kiện hàng</p>
        <div id="anh-diem-info" style="margin:8px 16px 0; padding:10px 14px; border-radius:var(--radius-sm); background:#eaf2fc; color:var(--primary); font-weight:600; font-size:14px;"></div>
        <div class="camera-box" id="camera-box">
            <input type="file" accept="image/*" capture="environment" id="kien-camera-input" style="display:none;">
            <div id="camera-box-label">📷 Chạm để chụp ảnh</div>
        </div>
        <button type="button" id="btn-chon-thu-vien" class="btn" style="display:block; margin:0 16px; background:var(--white); color:var(--text); border:1.5px solid var(--border);">🖼️ Chọn ảnh có sẵn</button>
        <input type="file" accept="image/*" id="kien-thuvien-input" style="display:none;">
        <div id="camera-live">
            <video id="camera-video" autoplay playsinline muted></video>
            <div class="camera-live-actions">
                <button class="btn btn-full" id="btn-camera-cancel" type="button">Hủy</button>
                <button class="btn btn-full btn-success" id="btn-camera-capture" type="button">📸 Chụp</button>
            </div>
        </div>
        <canvas id="camera-canvas" style="display:none;"></canvas>
        <div id="kien-preview"><img id="kien-preview-img" alt=""></div>
        <div style="padding:0 16px;">
            <div class="form-group">
                <label>Số lượng / Loại hàng</label>
                <div class="chip-row" id="loaihang-chips" style="padding:0;">
                    <div class="chip" data-loai="Thùng giấy">📦 + Thùng giấy</div>
                    <div class="chip" data-loai="Thùng xốp">🧊 + Thùng xốp</div>
                    <div class="chip" data-loai="Bao">🛍️ + Bao</div>
                    <div class="chip" data-loai="__khac__">✨ + Khác...</div>
                </div>
                <div id="loaihang-items"></div>
            </div>
            <div class="form-group">
                <label>SĐT người nhận</label>
                <input type="tel" id="kien-sdt" placeholder="SĐT người nhận (tùy chọn)" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;">
                <div id="sdt-ai-hint" style="display:none; font-size:13px; color:var(--text-muted); margin-top:4px;">✨ AI đọc từ ảnh — kiểm tra lại trước khi lưu</div>
            </div>
            <div class="form-group">
                <label>SĐT người gửi</label>
                <input type="tel" id="kien-nguoi-gui-sdt" placeholder="SĐT người gửi (tùy chọn)" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;">
                <div id="nguoi-gui-sdt-ai-hint" style="display:none; font-size:13px; color:var(--text-muted); margin-top:4px;">✨ AI đọc từ ảnh — kiểm tra lại trước khi lưu</div>
            </div>
            <div class="form-group">
                <label>Ghi chú</label>
                <textarea id="kien-ghichu" placeholder="Ghi chú kiện hàng (tùy chọn)" rows="3" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;"></textarea>
            </div>
            <div class="form-group">
                <button class="btn-cod-toggle" id="btn-thu-ho-toggle" type="button">💰 Thu hộ (COD)</button>
                <div id="kien-thu-ho-wrap">
                    <input type="number" inputmode="numeric" id="kien-thu-ho" placeholder="Nhập theo nghìn đồng, vd 200 = 200.000đ" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;">
                    <div id="kien-thu-ho-chu" style="font-size:13px;color:var(--text-muted);margin-top:4px;"></div>
                </div>
                <button class="btn-cod-toggle" id="btn-cuoc-toggle" type="button" style="margin-top:8px;">✅ Đã thu cước</button>
                <div id="kien-cuoc-wrap" style="display:none; margin-top:10px;">
                    <input type="number" inputmode="numeric" id="kien-cuoc" placeholder="Nhập theo nghìn đồng, vd 200 = 200.000đ" style="width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;">
                    <div id="kien-cuoc-chu" style="font-size:13px;color:var(--text-muted);margin-top:4px;"></div>
                </div>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-full btn-success" id="btn-save-kien" type="button">Lưu kiện hàng</button>
        </div>
    </div>

    <!-- Step 4: xem lại kiện vừa lưu, trước khi nhập kiện tiếp theo -->
    <div class="step" id="step-review">
        <p style="padding:16px 16px 0; font-weight:600;">✅ Đã lưu kiện hàng</p>
        <div id="review-card"></div>
        <div class="form-actions" style="flex-direction:column;">
            <button class="btn btn-full btn-success" id="btn-review-next" type="button">+ Nhập kiện tiếp theo</button>
            <button class="btn btn-full" id="btn-review-edit" type="button" style="background:var(--white); color:var(--text); border:1.5px solid var(--border);">← Sửa lại kiện này</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="shared.js"></script>
    <script src="point-match.js"></script>
    <script src="idb-queue.js"></script>
    <script>
        const sb = createSb()
        let currentUser = null
        let currentNhaXeId = null  // resolveNhaXeId(sb, user.id) — xem CLAUDE.md mục "Multi-tenant"
        let currentChuyen = null  // { id, chieu, khoi_hanh, ghi_chu }
        let selectedTinh = null   // { ma, ten, thu_tu }
        let selectedDiem = null   // { id, ten, tinh_ma }
        let allDiemInTinh = []
        let activePhotoBlob = null
        let loaiHangItems = []   // [{ ten, soLuong }] — danh sách loại hàng + số lượng riêng từng loại
        let reviewPreviewUrl = null   // object URL của ảnh kiện vừa lưu, hiện ở step-review
        let lastSaved = null   // snapshot kiện vừa lưu, dùng để khôi phục form khi bấm "Sửa lại"

        // Token đại diện cho "phiên kiện đang nhập" — KHÔNG phải chỉ riêng ảnh — dùng để chặn
        // race-condition khi AI đọc SĐT ngầm (tryAutoReadSdt) trả về CHẬM, sau khi crew đã lưu
        // kiện và chuyển sang kiện KHÁC (chưa kịp chụp ảnh mới cho kiện đó). Nếu chỉ so token
        // theo ảnh (bump lúc chụp ảnh mới) thì không đủ: giữa lúc "lưu kiện A" và "chụp ảnh cho
        // kiện B" chưa có ảnh mới nào nên token đó không đổi, kết quả AI trễ của ảnh A vẫn khớp
        // token và có thể điền nhầm vào #kien-sdt đang trống chờ nhập cho kiện B. Vì vậy phải
        // bump ở MỌI điểm làm mới ngữ cảnh nhập liệu (chụp ảnh mới, sau khi lưu, "+ Nhập kiện
        // tiếp theo", "← Sửa lại kiện này"), không chỉ lúc có ảnh mới.
        let kienSessionToken = 0

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast')
            toast.textContent = msg
            toast.className = 'toast show ' + type
            setTimeout(() => toast.className = 'toast', 3000)
        }

        // Xử lý phím Back Android / vuốt back trong luồng nhiều bước: các bước chuyển bằng
        // JS thuần (show/hide .step), không đổi URL nên mặc định KHÔNG có history entry nào
        // để trình duyệt lùi lại — bấm Back sẽ thoát thẳng ra khỏi PWA thay vì lùi bước. Dùng
        // pattern "1 history entry giả (guard) tái tạo mỗi lần" thay vì push 1 entry thật cho
        // MỖI bước: chỉ cần tối đa 1 entry thừa trong history thật bất kể đang sâu bao nhiêu
        // bước — nguồn sự thật duy nhất về "đang ở bước nào/lùi về đâu" là mảng `stepStack`
        // tự quản lý trong JS, KHÔNG đọc từ `event.state` (tránh lệch nếu bấm Back nhanh liên
        // tiếp). Guard được giữ ở MỌI bước kể cả bước gốc (`step-chuyen`) — theo yêu cầu Back
        // không bao giờ thoát PWA, chỉ lùi bước trong app; ở bước gốc thì Back coi như no-op
        // (render lại chính bước gốc, tái lập guard) thay vì rơi về hành vi mặc định của
        // trình duyệt.
        let stepStack = ['step-chuyen']
        let backGuardActive = false

        function pushBackGuard() {
            if (backGuardActive) return
            history.pushState({ hangGuard: true }, '', location.href)
            backGuardActive = true
        }

        function renderStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'))
            document.getElementById(id).classList.add('active')
            // Bước 3 (chụp ảnh) cách xa bước chọn điểm 1 màn hình — crew dễ quên đang nhập
            // cho điểm nào, nhất là sau khi cuộn xuống lâu để chụp ảnh/nhập tiền. Hiện lại
            // tỉnh + tên điểm đã chọn ngay trên khung chụp ảnh để đối chiếu tại chỗ, không
            // cần lùi lại bước 2. Cập nhật ở đây (thay vì tại từng nơi gọi goToStep('step-anh'))
            // vì mọi đường vào step-anh (chọn điểm có sẵn, tạo điểm mới, "Sửa lại kiện này")
            // đều đã set xong selectedTinh/selectedDiem trước khi renderStep chạy.
            if (id === 'step-anh') {
                const info = document.getElementById('anh-diem-info')
                info.textContent = selectedTinh && selectedDiem ? `📍 ${selectedDiem.ten} — ${selectedTinh.ten}` : ''
            }
        }

        // Crew tự sửa tay sau khi AI điền — bỏ nhãn "AI đọc từ ảnh", giá trị hiện tại không còn
        // chắc chắn là do AI đọc nữa.
        document.getElementById('kien-sdt').addEventListener('input', e => {
            delete e.target.dataset.nguon
            document.getElementById('sdt-ai-hint').style.display = 'none'
        })
        document.getElementById('kien-nguoi-gui-sdt').addEventListener('input', e => {
            delete e.target.dataset.nguon
            document.getElementById('nguoi-gui-sdt-ai-hint').style.display = 'none'
        })

        // opts.stack: dùng cho các chuyển bước KHÔNG phải "tiến thêm 1 bước" mà là "khởi
        // động lại luồng từ 1 mốc giữa chừng" (vd "Nhập kiện tiếp theo" quay về bước 1 để
        // nhập kiện mới, "Sửa lại kiện này" quay về bước 3 với tỉnh/điểm đã chọn lại) — thay
        // hẳn stepStack thay vì push nối đuôi, để Back sau đó lùi đúng ngữ cảnh mới.
        function goToStep(id, opts = {}) {
            renderStep(id)
            if (opts.stack) {
                stepStack = opts.stack.slice()
            } else if (stepStack[stepStack.length - 1] !== id) {
                stepStack.push(id)
            }
            pushBackGuard()
        }
        pushBackGuard()   // giữ guard ngay từ lúc mở trang — bước gốc cũng không thoát PWA khi bấm Back

        window.addEventListener('popstate', () => {
            backGuardActive = false   // entry guard vừa bị "tiêu thụ" bởi lần back này
            if (stepStack.length > 1) stepStack.pop()   // ở bước gốc thì giữ nguyên, không pop nữa
            renderStep(stepStack[stepStack.length - 1])
            pushBackGuard()   // luôn tái lập bẫy — kể cả ở bước gốc — để Back lần sau vẫn không thoát app
        })

        function updateChuyenBar() {
            const bar = document.getElementById('current-chuyen-bar')
            if (!currentChuyen) { bar.classList.remove('show'); return }
            const chieuLabel = currentChuyen.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
            const label = `Chuyến: ${chieuLabel}${currentChuyen.ghi_chu ? ' — ' + currentChuyen.ghi_chu : ''}`
            bar.innerHTML = `
                <span>${label}</span>
                <a class="btn-xem-manifest" href="manifest-hang.html?chuyen_id=${currentChuyen.id}" target="_blank" rel="noopener">📋 Xem danh sách</a>
            `
            bar.classList.add('show')
        }

        function renderChuyenItem(c) {
            const item = document.createElement('div')
            item.className = 'chuyen-item'
            const chieuLabel = c.chieu === 'bac' ? 'Ra Bắc (ĐL → HD)' : 'Vào Nam (HD → ĐL)'
            const trangThaiLabel = c.trang_thai === 'xong' ? ' (đã xong)' : ''
            item.innerHTML = `<div>${chieuLabel}${trangThaiLabel}</div><div class="sub">${formatDate(c.khoi_hanh)}${c.ghi_chu ? ' — ' + c.ghi_chu : ''}</div>`
            return item
        }

        // Chỉ hiện chuyến đang chạy — nhập kiện mới không cần thấy chuyến đã xong (xem
        // lại chuyến cũ thì qua lich-su-chuyen.html thay vì lẫn ở đây).
        //
        // "+ Tạo chuyến mới" LUÔN hiện, KHÔNG còn tự ẩn khi đã có chuyến dang_chay (2026-09-17,
        // theo yêu cầu owner: cho khách chọn ngày đi trước ở dat-ve.html — cần crew tạo được
        // NHIỀU chuyến dang_chay cùng lúc, mỗi chuyến 1 ngày khởi hành khác nhau, để khách có gì
        // đó thật sự để chọn). Trước đây ẩn nút này khi có 1 chuyến dang_chay bất kỳ — giả định
        // "chỉ chạy 1 chuyến 1 lúc", giờ không còn đúng nữa.
        async function loadChuyenList() {
            const { data, error } = await sb
                .from('chuyen')
                .select('id, chieu, khoi_hanh, trang_thai, ghi_chu, created_at')
                .eq('nha_xe_id', currentNhaXeId)
                .eq('trang_thai', 'dang_chay')
                .order('khoi_hanh', { ascending: true })
            if (error) { showToast('Lỗi tải chuyến: ' + error.message, 'error'); return }
            const wrap = document.getElementById('chuyen-list')
            wrap.textContent = ''

            if (!data.length) {
                wrap.innerHTML = '<div style="color:var(--text-muted); font-size:14px; padding:0 16px;">Chưa có chuyến nào đang chạy, tạo chuyến mới bên dưới.</div>'
                return
            }

            data.forEach(c => {
                const item = renderChuyenItem(c)
                item.addEventListener('click', () => selectChuyen(c, item))
                wrap.appendChild(item)
            })
        }

        function selectChuyen(chuyen, itemEl) {
            document.querySelectorAll('#chuyen-list .chuyen-item').forEach(i => i.classList.remove('selected'))
            if (itemEl) itemEl.classList.add('selected')
            currentChuyen = chuyen
            updateChuyenBar()
            loadTinh()
            goToStep('step-tinh')
        }

        // Chuyển timestamp -> chuỗi "YYYY-MM-DDTHH:mm" mà <input type="datetime-local"> chấp nhận
        // — PHẢI dùng giờ ĐỊA PHƯƠNG (không phải toISOString(), vốn luôn ra UTC) để ô nhập hiện
        // đúng giờ crew đang xem, không lệch múi giờ.
        function toDatetimeLocalValue(date) {
            const pad = n => String(n).padStart(2, '0')
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`
        }

        document.getElementById('btn-toggle-new-chuyen').addEventListener('click', () => {
            const form = document.getElementById('new-chuyen-form')
            const dangMo = form.style.display !== 'none'
            form.style.display = dangMo ? 'none' : 'block'
            // Prefill = giờ hiện tại mỗi lần MỞ form (không phải chỉ 1 lần lúc trang tải) — nếu
            // crew mở form rồi để đó vài phút mới điền, "giờ hiện tại" cũ sẽ bị lệch.
            if (!dangMo) document.getElementById('new-chuyen-khoi-hanh').value = toDatetimeLocalValue(new Date())
        })

        document.getElementById('btn-save-chuyen').addEventListener('click', async () => {
            const chieu = document.getElementById('new-chuyen-chieu').value
            // 2026-09-17: cho crew TỰ CHỌN ngày giờ khởi hành (trước đây luôn = lúc bấm "Tạo
            // chuyến", không cho nhập tay) — để lên lịch được nhiều chuyến trước cho các ngày
            // khác nhau, phục vụ tính năng "chọn ngày đi" ở dat-ve.html. Để trống = coi như bây
            // giờ (giữ hành vi cũ làm fallback, phòng crew xoá trắng ô nhập).
            const khoiHanhRaw = document.getElementById('new-chuyen-khoi-hanh').value
            const khoiHanh = khoiHanhRaw ? new Date(khoiHanhRaw) : new Date()
            // tao_boi có default auth.uid() ở DB — không cần gửi từ client.
            const { data, error } = await sb.from('chuyen').insert({
                chieu,
                khoi_hanh: khoiHanh.toISOString(),
                trang_thai: 'dang_chay',
                nha_xe_id: currentNhaXeId
            }).select().single()

        // tuyen_tinh(nha_xe_id, tinh_ma FK -> tinh, thu_tu, gia_moc) join tinh(ma, ten) — thay
        // tinh_tuyen (bảng cũ, đơn-tenant) từ Giai đoạn 4 multi-tenant. Chiều bac = ASC thu_tu,
        // nam = DESC thu_tu.
        async function loadTinh() {
            const { data, error } = await sb
                .from('tuyen_tinh')
                .select('tinh_ma, thu_tu, tinh:tinh_ma(ma, ten)')
                .eq('nha_xe_id', currentNhaXeId)
                .order('thu_tu', { ascending: currentChuyen.chieu === 'bac' })
            if (error) { showToast('Lỗi tải danh sách tỉnh: ' + error.message, 'error'); return }
            const wrap = document.getElementById('tinh-chips')
            wrap.textContent = ''
            // Chiều bắc: Đắk Lắk là điểm bốc hàng (không phải điểm giao) — loại khỏi danh sách chọn.
            // Chiều nam: Đắk Lắk lại là điểm đến cuối cùng — giữ lại để chọn giao hàng.
            // Khánh Hòa không chạy tuyến này ở cả 2 chiều — luôn loại khỏi danh sách.
            data.map(r => ({ ma: r.tinh_ma, ten: r.tinh.ten, thu_tu: r.thu_tu }))
                .filter(t => (currentChuyen.chieu === 'nam' || t.ma !== 'DLK') && t.ten !== 'Khánh Hòa').forEach(t => {
                const chip = document.createElement('div')
                chip.className = 'chip'
                chip.textContent = t.ten
                chip.addEventListener('click', () => selectTinh(t, chip))
                wrap.appendChild(chip)
            })
        }

        function selectTinh(tinh, chipEl) {
            document.querySelectorAll('#tinh-chips .chip').forEach(c => c.classList.remove('selected'))
            chipEl.classList.add('selected')
            selectedTinh = tinh
            // Xoá sạch ô tìm kiếm + danh sách gợi ý của lượt chọn điểm TRƯỚC (nếu có) ngay khi
            // chọn tỉnh — trước đây cả 2 giữ nguyên giá trị cũ cho tới khi loadDiem() (async)
            // trả về, nên giữa lúc chờ mạng, "Nhập kiện tiếp theo" rồi chọn lại 1 tỉnh sẽ vẫn
            // hiện thấy text đã gõ + điểm đã chọn của kiện TRƯỚC, dễ nhầm là gợi ý cho kiện mới.
            document.getElementById('diem-search').value = ''
            allDiemInTinh = []
            renderDiemList([])
            loadDiem(tinh.ma)
            goToStep('step-diem')
        }

        // diem(id, ten, ten_norm, tinh_ma FK, huyen_cu, lat, lng, km_moc, so_lan_giao, created_at)
        // UNIQUE(tinh_ma, ten_norm) — DB tự chặn trùng khi insert.
        async function loadDiem(tinhMa) {
            const { data, error } = await sb.from('diem').select('id, ten, ten_norm, tinh_ma').eq('nha_xe_id', currentNhaXeId).eq('tinh_ma', tinhMa).order('ten')
            // Bấm đổi tỉnh liên tiếp nhanh có thể khiến request TRƯỚC trả về SAU request MỚI
            // (race condition) — chỉ áp dụng kết quả nếu vẫn đang chọn đúng tỉnh đã gọi, tránh
            // ghi đè danh sách của tỉnh đang chọn bằng dữ liệu của tỉnh đã rời khỏi.
            if (!selectedTinh || selectedTinh.ma !== tinhMa) return
            if (error) { showToast('Lỗi tải điểm: ' + error.message, 'error'); return }
            allDiemInTinh = data || []
            renderDiemList(allDiemInTinh)
        }

        function renderDiemList(list) {
            const wrap = document.getElementById('diem-list')
            wrap.textContent = ''
            list.forEach(d => {
                const item = document.createElement('div')
                item.className = 'diem-item'
                item.textContent = d.ten
                item.addEventListener('click', () => selectDiem(d, item))
                wrap.appendChild(item)
            })
        }

        function selectDiem(diem, itemEl) {
            document.querySelectorAll('#diem-list .diem-item').forEach(i => i.classList.remove('selected'))
            itemEl.classList.add('selected')
            selectedDiem = diem
            goToStep('step-anh')
        }

        document.getElementById('diem-search').addEventListener('input', e => {
            const q = e.target.value
            if (!q) { renderDiemList(allDiemInTinh); return }
            renderDiemList(timDiemTrung(allDiemInTinh, q))
        })

        document.getElementById('btn-new-diem').addEventListener('click', async () => {
            const ten = document.getElementById('diem-search').value.trim()
            if (!ten) { showToast('Nhập tên điểm trước', 'error'); return }
            const trung = timDiemTrung(allDiemInTinh, ten)
            if (trung.length && !(await confirmDialog(`Đã có điểm gần giống: "${trung[0].ten}". Vẫn tạo điểm mới?`))) return
            const { data, error } = await sb.from('diem').insert({
                tinh_ma: selectedTinh.ma,
                ten,
                ten_norm: boDau(ten),
                nha_xe_id: currentNhaXeId
            }).select().single()
            if (error) {
                if (error.code === '23505') {
                    // UNIQUE(tinh_ma, ten_norm) đụng — điểm đã tồn tại, refetch rồi chọn lại
                    showToast('Điểm này đã tồn tại, đang chọn điểm có sẵn...', '')
                    await loadDiem(selectedTinh.ma)
                    const existed = allDiemInTinh.find(d => d.ten_norm === boDau(ten))
                    if (existed) { selectedDiem = existed; goToStep('step-anh'); return }
                }
                showToast('Lỗi tạo điểm: ' + error.message, 'error')
                return
            }
            allDiemInTinh.push(data)
            selectedDiem = data
            goToStep('step-anh')
        })

        // Loại hàng — mỗi lần bấm chip thêm 1 dòng vào danh sách (hoặc +1 số lượng nếu loại
        // đó đã có trong danh sách), mỗi dòng có stepper riêng — cho trường hợp 1 kiện gồm
        // nhiều loại khác nhau (vd 2 thùng giấy + 3 thùng xốp cùng 1 khách gửi 1 lúc).
        // "Khác..." dùng prompt() để gõ tên tự do, đủ dùng cho trường hợp hiếm, không cần
        // thêm UI riêng. Không chọn loại nào (danh sách rỗng) → mặc định 1 kiện, không phân
        // loại, giống hành vi trước khi có tính năng này.
        const LOAI_HANG_ICON = { 'Thùng giấy': '📦', 'Thùng xốp': '🧊', 'Bao': '🛍️' }

        function renderLoaiHangItems() {
            const wrap = document.getElementById('loaihang-items')
            wrap.textContent = ''
            loaiHangItems.forEach((item, idx) => {
                const row = document.createElement('div')
                row.className = 'loaihang-item'
                row.dataset.loai = LOAI_HANG_ICON[item.ten] ? item.ten : 'khac'
                row.innerHTML = `
                    <span class="loaihang-item-icon">${LOAI_HANG_ICON[item.ten] || '✨'}</span>
                    <span class="loaihang-item-ten">${item.ten}</span>
                    <div class="qty-stepper-sm">
                        <button type="button" class="btn-qty-sm item-minus">−</button>
                        <input type="number" inputmode="numeric" class="item-qty-input" value="${item.soLuong}" min="1">
                        <button type="button" class="btn-qty-sm item-plus">+</button>
                    </div>
                    <button type="button" class="item-remove" aria-label="Xoá">✕</button>
                `
                const qtyInput = row.querySelector('.item-qty-input')
                row.querySelector('.item-minus').addEventListener('click', () => {
                    if (item.soLuong <= 1) loaiHangItems.splice(idx, 1)
                    else item.soLuong--
                    renderLoaiHangItems()
                })
                row.querySelector('.item-plus').addEventListener('click', () => {
                    item.soLuong++
                    renderLoaiHangItems()
                })
                // Gõ tay số lượng — không re-render khi đang gõ (mất focus/con trỏ giữa
                // chừng), chỉ chuẩn hoá (số nguyên dương, mặc định 1 nếu bỏ trống/không hợp
                // lệ) lúc rời khỏi ô (blur).
                qtyInput.addEventListener('input', () => {
                    const n = parseInt(qtyInput.value, 10)
                    if (Number.isFinite(n) && n > 0) item.soLuong = n
                })
                qtyInput.addEventListener('blur', () => {
                    const n = parseInt(qtyInput.value, 10)
                    item.soLuong = Number.isFinite(n) && n > 0 ? n : 1
                    qtyInput.value = item.soLuong
                })
                row.querySelector('.item-remove').addEventListener('click', () => {
                    loaiHangItems.splice(idx, 1)
                    renderLoaiHangItems()
                })
                wrap.appendChild(row)
            })
        }

        document.querySelectorAll('#loaihang-chips .chip').forEach(chip => {
            chip.addEventListener('click', () => {
                let ten = chip.dataset.loai
                if (ten === '__khac__') {
                    ten = (prompt('Nhập tên loại hàng:') || '').trim()
                    if (!ten) return
                }
                const existed = loaiHangItems.find(i => i.ten === ten)
                if (existed) existed.soLuong++
                else loaiHangItems.push({ ten, soLuong: 1 })
                renderLoaiHangItems()
            })
        })

        document.getElementById('btn-thu-ho-toggle').addEventListener('click', function () {
            const active = this.classList.toggle('active')
            const wrap = document.getElementById('kien-thu-ho-wrap')
            wrap.style.display = active ? 'block' : 'none'
            if (!active) {
                document.getElementById('kien-thu-ho').value = ''
                document.getElementById('kien-thu-ho-chu').textContent = ''

        document.getElementById('kien-thu-ho').addEventListener('input', function () {

            document.getElementById('kien-thu-ho-chu').textContent =

        document.getElementById('btn-cuoc-toggle').addEventListener('click', function () {

            const wrap = document.getElementById('kien-cuoc-wrap')
            wrap.style.display = active ? 'block' : 'none'
            if (!active) {
                document.getElementById('kien-cuoc').value = ''
                document.getElementById('kien-cuoc-chu').textContent = ''
            }
        })
        document.getElementById('kien-cuoc').addEventListener('input', function () {
            const raw = this.value.trim()
            const so = raw === '' ? null : Number(raw) * 1000
            document.getElementById('kien-cuoc-chu').textContent =
                so !== null && Number.isFinite(so) ? `= ${formatMoney(so)} — ${soTienBangChu(so)}` : ''
        })

        // Resize ảnh xuống tối đa maxSize (cạnh dài) trước khi lưu — ảnh gốc camera đời mới
        // thường 3000-4000px/vài MB, không cần giữ nguyên để nhìn rõ SĐT/tình trạng hàng.
        // Giảm dung lượng lưu IndexedDB + thời gian upload lên Supabase Storage sau này.
        function resizeImage(file, maxSize, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const img = new Image()
                img.onload = () => {
                    let { width, height } = img
                    if (width > maxSize || height > maxSize) {
                        if (width > height) { height = Math.round(height * maxSize / width); width = maxSize }
                        else { width = Math.round(width * maxSize / height); height = maxSize }
                    }
                    const canvas = document.createElement('canvas')
                    canvas.width = width
                    canvas.height = height
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height)
                    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/jpeg', quality)
                    URL.revokeObjectURL(img.src)
                }
                img.onerror = reject
                img.src = URL.createObjectURL(file)
            })
        }

        let activePreviewUrl = null

        // Pipeline xử lý ảnh dùng chung, không quan tâm nguồn ảnh đến từ đâu (file trả về từ
        // app Camera gốc trên iOS/fallback, hay Blob vẽ từ <canvas> của camera nhúng Android).
        // Đã có ảnh (preview đang hiện) thì đổi nhãn khung "Chạm để chụp ảnh" thành "Chạm để
        // chụp lại" — khung này KHÔNG tự ẩn đi sau khi chụp (vẫn đứng trên preview để bấm chụp
        // lại nếu ảnh chưa ưng ý), nhãn cũ giữ nguyên "chụp ảnh" gây hiểu lầm là chưa chụp được.
        function updateCameraBoxLabel() {
            document.getElementById('camera-box-label').textContent =
                activePreviewUrl ? '🔄 Chạm để chụp lại' : '📷 Chạm để chụp ảnh'
        }

        function handleNewPhotoBlob(fileOrBlob) {
            // Ảnh mới (chụp mới/chọn lại/chụp lại) — bump token trước tiên để bất kỳ kết quả
            // AI đọc SĐT nào đang chờ từ ảnh TRƯỚC đó (nếu có) bị loại ngay, không điền nhầm
            // vào ảnh này.
            kienSessionToken++
            document.getElementById('sdt-ai-hint').style.display = 'none'
            document.getElementById('nguoi-gui-sdt-ai-hint').style.display = 'none'

            // Hiện preview ngay bằng object URL — không đọc/encode base64 toàn bộ ảnh gốc
            // (FileReader.readAsDataURL mất 0.5-3s với ảnh camera vài MB chưa resize, đây
            // là nguyên nhân chính của độ trễ "chậm sau khi chụp" trước đây).
            if (activePreviewUrl) URL.revokeObjectURL(activePreviewUrl)
            activePreviewUrl = URL.createObjectURL(fileOrBlob)
            document.getElementById('kien-preview-img').src = activePreviewUrl
            document.getElementById('kien-preview').style.display = 'block'
            updateCameraBoxLabel()
            activePhotoBlob = fileOrBlob // fallback nếu resize lỗi (vd định dạng canvas không decode được)

            // Resize chạy ngầm phía sau, không chặn preview vừa hiện ở trên. Đọc SĐT bằng AI
            // CHỈ chạy sau khi có bản đã resize (payload nhỏ hơn gửi cho DashScope) — chấp
            // nhận đợi thêm <1s, không tự đọc từ ảnh gốc chưa resize.
            const tokenLucChup = kienSessionToken
            resizeImage(fileOrBlob, 1600)
                .then(blob => { activePhotoBlob = blob; tryAutoReadSdt(blob, tokenLucChup) })
                .catch(err => console.error('[resizeImage] lỗi, giữ ảnh gốc', err))
        }

        // Điền 1 ô SĐT (người nhận HOẶC người gửi) từ 1 role-result của API — dùng chung cho cả
        // 2 ô vì cùng nguyên tắc: chỉ điền nếu đọc được + tin cậy (không phải khong_doc_duoc/
        // khong_chac) + ô đang trống (không ghi đè crew đã gõ tay).
        function apDungKetQuaVaiTro(roleResult, inputId, hintId) {
            if (!roleResult || roleResult.khong_doc_duoc || roleResult.khong_chac || !roleResult.sdt_ai_doc) return
            const input = document.getElementById(inputId)
            if (input.value.trim()) return // crew đã gõ tay/bấm chip — không ghi đè
            const chuan = sdtDocDuocHopLe(roleResult.sdt_ai_doc)
            if (!chuan) return
            input.value = chuan
            input.dataset.nguon = 'ai'
            document.getElementById(hintId).style.display = 'block'
        }

        // Đọc SĐT trực tiếp từ ảnh (mode 'read', gửi base64 vì ảnh CHƯA upload lên Storage lúc
        // này — chỉ upload lúc idb-queue.js sync nền) để tự điền #kien-sdt VÀ #kien-nguoi-gui-sdt,
        // giảm phụ thuộc gõ tay. Tính năng phụ trợ chạy nền: lỗi mạng/model đọc không ra/ảnh mờ →
        // bỏ qua lặng lẽ, không toast, không console.error ồn ào (khác chayDoiChieuSdt ở
        // manifest-hang.html vốn là thao tác chủ động của crew nên có thể log lỗi chi tiết).
        async function tryAutoReadSdt(resizedBlob, token) {
            try {
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader()
                    reader.onload = () => resolve(reader.result)
                    reader.onerror = reject
                    reader.readAsDataURL(resizedBlob)
                })
                const res = await fetch('/api/doi-chieu-sdt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'read', anh_base64: base64, mime_type: 'image/jpeg' })
                })
                if (!res.ok) return
                const data = await res.json()
                if (data.loi) return

                // Guard race-condition: so token phiên kiện lúc gửi với hiện tại — lệch (đã
                // chụp ảnh khác, đã lưu kiện, đã sang kiện tiếp theo, hoặc đã "Sửa lại") thì bỏ
                // kết quả, không điền vào bất kỳ ô nào.
                if (token !== kienSessionToken) return

                // 2 vai trò độc lập — người nhận đọc tin cậy không có nghĩa người gửi cũng vậy
                // (và ngược lại), mỗi field tự quyết định điền hay bỏ qua.
                apDungKetQuaVaiTro(data.nguoi_nhan, 'kien-sdt', 'sdt-ai-hint')
                apDungKetQuaVaiTro(data.nguoi_gui, 'kien-nguoi-gui-sdt', 'nguoi-gui-sdt-ai-hint')
            } catch {
                // Lỗi mạng/parse — bỏ qua lặng lẽ, đây chỉ là tính năng phụ trợ.
            }
        }

        // Chuẩn hoá + validate cơ bản SĐT AI đọc được trước khi tự điền — chỉ chấp nhận dạng
        // số VN 10 số sau chuẩn hoá (04 dấu + \D), tránh điền rác nếu model trả về gì đó khác
        // định dạng dù đã dặn trong prompt.
        function sdtDocDuocHopLe(raw) {
            const d = (raw || '').replace(/\D/g, '')
            const daChuan = d.startsWith('84') ? '0' + d.slice(2).replace(/^0+/, '') : d
            return /^0\d{9}$/.test(daChuan) ? daChuan : null
        }

        // Chụp ảnh: input file (mở app Camera gốc) luôn dùng trên iOS — PWA standalone trên
        // iOS có lịch sử lỗi getUserMedia/WebRTC lặp lại qua nhiều bản cập nhật WebKit (gần
        // nhất iOS 18, vá ở 18.1.1), rủi ro app tự hỏng ngoài tầm kiểm soát nên KHÔNG dùng
        // camera nhúng ở đây dù về mặt kỹ thuật iOS vẫn "hỗ trợ" getUserMedia — đây là lựa
        // chọn theo độ tin cậy thực tế của nền tảng, không phải feature-detection thông
        // thường. Android dùng camera nhúng (nhanh hơn, không phải mở/đóng app riêng), có
        // fallback về input file nếu getUserMedia lỗi (từ chối quyền, máy/WebView không hỗ trợ).
        // iPadOS 13+ báo User-Agent GIỐNG macOS Safari (Apple đổi mặc định từ iOS 13 để web
        // "desktop-first" tương thích hơn) — regex UA thuần /iPad|iPhone|iPod/ KHÔNG bắt được
        // iPad thật nữa, khiến iPad lọt vào nhánh getUserMedia (camera nhúng) mà đoạn comment
        // trên vừa giải thích lý do CỐ TÌNH tránh trên iOS. Thêm điều kiện phụ: Mac thật không có
        // touchscreen multi-point (`maxTouchPoints <= 1`), iPad luôn > 1 — kết hợp
        // `platform === 'MacIntel'` phân biệt đúng iPad giả-dạng Mac với Mac thật. Chỉ đổi biến
        // này, không đổi luồng nào khác (tablet 2026-09-21).
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
        let cameraStream = null

        function stopCameraStream() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop())
                cameraStream = null
            }
        }

        function closeCameraLive() {
            stopCameraStream()
            document.getElementById('camera-live').style.display = 'none'
            document.getElementById('camera-box').style.display = 'block'
        }

        async function openCameraFlow() {
            if (isIOS || !navigator.mediaDevices?.getUserMedia) {
                document.getElementById('kien-camera-input').click()
                return
            }
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                document.getElementById('camera-video').srcObject = cameraStream
                document.getElementById('camera-box').style.display = 'none'
                document.getElementById('camera-live').style.display = 'block'
            } catch (err) {
                // Không để màn hình chụp đứng/trắng — rơi về input file như iOS.
                console.error('[camera] getUserMedia lỗi, dùng input file', err)
                document.getElementById('kien-camera-input').click()
            }
        }

        document.getElementById('camera-box').addEventListener('click', openCameraFlow)

        document.getElementById('btn-camera-capture').addEventListener('click', () => {
            const video = document.getElementById('camera-video')
            const canvas = document.getElementById('camera-canvas')
            canvas.width = video.videoWidth
            canvas.height = video.videoHeight
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height)
            canvas.toBlob(blob => {
                if (blob) handleNewPhotoBlob(blob)
                closeCameraLive()
            }, 'image/jpeg', 0.92)
        })

        document.getElementById('btn-camera-cancel').addEventListener('click', closeCameraLive)

        // Tắt camera khi rời tab/app (chuyển app khác, khoá màn hình...) — không tắt sẽ giữ
        // đèn camera sáng, tốn pin, có thể chặn app khác dùng camera.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) closeCameraLive()
        })

        document.getElementById('kien-camera-input').addEventListener('change', function () {
            if (!this.files || !this.files[0]) return
            handleNewPhotoBlob(this.files[0])
        })

        // "🖼️ Chọn ảnh có sẵn" — nút RIÊNG, độc lập với openCameraFlow(). Trên Android,
        // openCameraFlow() khi getUserMedia thành công (đa số trường hợp) mở thẳng camera nhúng
        // sống, không bao giờ đụng tới #kien-camera-input — nếu chỉ bỏ `capture` khỏi input đó,
        // crew Android sẽ không có cách nào bấm vào để chọn thư viện. Input ẩn riêng này KHÔNG
        // có attribute `capture` nên trình duyệt tự hiện picker "Chụp ảnh"/"Chọn từ thư viện".
        // Đi qua ĐÚNG pipeline handleNewPhotoBlob() như ảnh chụp trực tiếp — không viết luồng
        // preview/resize/race-guard riêng.
        document.getElementById('btn-chon-thu-vien').addEventListener('click', () => {
            document.getElementById('kien-thuvien-input').click()
        })
        document.getElementById('kien-thuvien-input').addEventListener('change', function () {
            if (!this.files || !this.files[0]) return
            handleNewPhotoBlob(this.files[0])
            this.value = '' // cho phép chọn lại đúng file đó lần nữa nếu cần
        })

        document.getElementById('btn-save-kien').addEventListener('click', async () => {
            if (!currentChuyen || !selectedTinh || !selectedDiem) { showToast('Thiếu chuyến/tỉnh/điểm', 'error'); return }
            if (!loaiHangItems.length) { showToast('Chọn ít nhất 1 loại hàng trước khi lưu', 'error'); return }
            const thuHoActive = document.getElementById('btn-thu-ho-toggle').classList.contains('active')
            let tienThuHo = null
            if (thuHoActive) {
                const raw = document.getElementById('kien-thu-ho').value.trim()
                tienThuHo = raw === '' ? NaN : Number(raw) * 1000
                if (!Number.isFinite(tienThuHo) || tienThuHo <= 0) { showToast('Nhập số tiền thu hộ hợp lệ', 'error'); return }
            }
            const cuocActive = document.getElementById('btn-cuoc-toggle').classList.contains('active')
            let cuocDaThu = null
            if (cuocActive) {
                const raw = document.getElementById('kien-cuoc').value.trim()
                cuocDaThu = raw === '' ? NaN : Number(raw) * 1000
                if (!Number.isFinite(cuocDaThu) || cuocDaThu <= 0) { showToast('Nhập số tiền cước hợp lệ', 'error'); return }
            }
            // so_luong = tổng số lượng mọi loại, loai_hang = liệt kê từng loại kèm số lượng
            // riêng, LUÔN ghi số ở đầu vd "1 Thùng xốp, 2 Thùng giấy" — trước đây chỉ thêm
            // "×N" khi N > 1 (ẩn số lúc N = 1), đổi theo yêu cầu để số lượng luôn hiện rõ.
            // loaiHangItems chắc chắn không rỗng ở đây nhờ validate bên trên.
            const tongSoLuong = loaiHangItems.reduce((s, i) => s + i.soLuong, 0)
            const loaiHangText = loaiHangItems.map(i => `${i.soLuong} ${i.ten}`).join(', ')
            const record = {
                id: crypto.randomUUID(),
                chuyen_id: currentChuyen.id,
                diem_id: selectedDiem.id,
                nha_xe_id: currentNhaXeId,
                nguoi_nhan_sdt: document.getElementById('kien-sdt').value.trim() || null,
                nguoi_gui_sdt: document.getElementById('kien-nguoi-gui-sdt').value.trim() || null,
                ghi_chu: document.getElementById('kien-ghichu').value.trim() || null,
                trang_thai: 'chua_giao',
                so_luong: tongSoLuong,
                loai_hang: loaiHangText,
                tien_thu: cuocDaThu,
                tien_thu_ho: tienThuHo,
                anh_blob: activePhotoBlob || null,
                created_at: new Date().toISOString(),
                da_sync: false
            }
            await queueKien(record)
            showToast('Đã lưu kiện hàng' + (navigator.onLine ? '' : ' (offline, sẽ tự đồng bộ)'), 'success')
            trySyncQueue(sb).then(updateQueueStatus)

            // Chuyển sang màn xem lại kiện vừa lưu (step-review) thay vì quay thẳng về
            // "1. Chọn tỉnh" — crew cần xác nhận đúng ảnh/thông tin trước khi nhập tiếp,
            // tránh phải rời sang manifest-hang.html mới biết vừa lưu đúng chưa.
            if (reviewPreviewUrl) { URL.revokeObjectURL(reviewPreviewUrl); reviewPreviewUrl = null }
            reviewPreviewUrl = activePreviewUrl   // chuyển quyền sở hữu URL sang review, không revoke ở dưới

            // Lưu lại toàn bộ thông tin vừa nhập (trước khi các field bị reset bên dưới) để
            // nút "Sửa lại kiện này" có thể khôi phục form nếu crew phát hiện nhập sai.
            lastSaved = {
                id: record.id,
                chuyen: currentChuyen,
                tinh: selectedTinh,
                diem: selectedDiem,
                loaiHangItems: loaiHangItems.map(i => ({ ...i })),
                sdt: record.nguoi_nhan_sdt,
                guiSdt: record.nguoi_gui_sdt,
                ghiChu: record.ghi_chu,
                thuHoActive,
                tienThuHo,
                cuocActive,
                cuocDaThu,
                photoBlob: record.anh_blob,
                previewUrl: reviewPreviewUrl
            }

            renderReviewCard({
                tenDiem: selectedDiem.ten,
                tenTinh: selectedTinh.ten,
                sdt: record.nguoi_nhan_sdt,
                guiSdt: record.nguoi_gui_sdt,
                ghiChu: record.ghi_chu,
                soLuong: record.so_luong,
                loaiHang: record.loai_hang,
                tienThu: record.tien_thu,
                tienThuHo: record.tien_thu_ho,
                photoUrl: reviewPreviewUrl
            })

            // reset các field nhập cho kiện tiếp theo — bump token phiên kiện ngay ở đây (KHÔNG
            // đợi tới "+ Nhập kiện tiếp theo"): từ thời điểm này #kien-sdt đã coi như thuộc
            // kiện MỚI (rỗng), nếu không bump thì kết quả AI trễ của ảnh kiện vừa lưu (token cũ
            // vẫn còn khớp vì chưa ai đổi) có thể điền nhầm vào đây trước khi crew kịp bấm "+
            // Nhập kiện tiếp theo" hay chụp ảnh mới.
            kienSessionToken++
            document.getElementById('sdt-ai-hint').style.display = 'none'
            document.getElementById('nguoi-gui-sdt-ai-hint').style.display = 'none'
            activePhotoBlob = null
            activePreviewUrl = null
            document.getElementById('kien-preview').style.display = 'none'
            updateCameraBoxLabel()
            loaiHangItems = []
            renderLoaiHangItems()
            document.getElementById('kien-sdt').value = ''
            document.getElementById('kien-nguoi-gui-sdt').value = ''
            document.getElementById('kien-ghichu').value = ''
            document.getElementById('btn-thu-ho-toggle').classList.remove('active')
            document.getElementById('kien-thu-ho-wrap').style.display = 'none'
            document.getElementById('kien-thu-ho').value = ''
            document.getElementById('kien-thu-ho-chu').textContent = ''
            document.getElementById('btn-cuoc-toggle').classList.remove('active')
            document.getElementById('kien-cuoc-wrap').style.display = 'none'
            document.getElementById('kien-cuoc').value = ''
            document.getElementById('kien-cuoc-chu').textContent = ''
            goToStep('step-review')
        })

        function renderReviewCard(data) {
            document.getElementById('review-card').innerHTML = `
                ${data.photoUrl ? `<img src="${data.photoUrl}" alt="">` : ''}
                <div class="diem">${data.tenDiem} — ${data.tenTinh}</div>
                ${data.sdt ? `<div class="mota">SĐT: ${data.sdt}</div>` : ''}
                ${data.guiSdt ? `<div class="mota">SĐT người gửi: ${data.guiSdt}</div>` : ''}
                ${data.ghiChu ? `<div class="mota">${data.ghiChu}</div>` : ''}
                ${data.loaiHang ? `<div class="mota">${data.loaiHang}</div>` : (data.soLuong > 1 ? `<div class="mota">Số lượng: ×${data.soLuong}</div>` : '')}
                ${data.tienThuHo != null && data.tienThuHo > 0 ? `<div class="cod">💰 Thu hộ: ${formatMoney(data.tienThuHo)}</div>` : ''}
                ${data.tienThu != null ? `<div class="cuoc">💵 Đã thu cước: ${formatMoney(data.tienThu)}</div>` : ''}
            `
        }

        document.getElementById('btn-review-next').addEventListener('click', () => {
            if (reviewPreviewUrl) { URL.revokeObjectURL(reviewPreviewUrl); reviewPreviewUrl = null }
            lastSaved = null
            kienSessionToken++   // đã bump lúc reset field sau khi lưu — bump lại ở đây cho chắc, vô hại
            goToStep('step-tinh', { stack: ['step-chuyen', 'step-tinh'] })
        })

        // "Sửa lại kiện này" — huỷ kiện vừa lưu (cả local queue lẫn Supabase nếu đã kịp
        // đồng bộ) rồi khôi phục lại toàn bộ form ở bước 3 với đúng dữ liệu vừa nhập, để
        // crew sửa và lưu lại thay vì phải rời sang manifest-hang.html sửa tay từng field.
        document.getElementById('btn-review-edit').addEventListener('click', async () => {
            if (!lastSaved) return
            const saved = lastSaved
            lastSaved = null
            kienSessionToken++   // chặn kết quả AI trễ từ 1 lần chụp-lại trước đó lúc đang sửa
            document.getElementById('sdt-ai-hint').style.display = 'none'
            document.getElementById('nguoi-gui-sdt-ai-hint').style.display = 'none'

            await deleteKienLocal(saved.id)
            sb.from('kien').delete().eq('id', saved.id).then(() => {})
            if (saved.photoBlob) sb.storage.from('kien').remove([`${saved.id}.jpg`]).then(() => {})

            currentChuyen = saved.chuyen
            selectedTinh = saved.tinh
            selectedDiem = saved.diem
            updateChuyenBar()

            loaiHangItems = saved.loaiHangItems
            renderLoaiHangItems()
            document.getElementById('kien-sdt').value = saved.sdt || ''
            delete document.getElementById('kien-sdt').dataset.nguon
            document.getElementById('kien-nguoi-gui-sdt').value = saved.guiSdt || ''
            delete document.getElementById('kien-nguoi-gui-sdt').dataset.nguon
            document.getElementById('kien-ghichu').value = saved.ghiChu || ''

            document.getElementById('btn-thu-ho-toggle').classList.toggle('active', saved.thuHoActive)
            document.getElementById('kien-thu-ho-wrap').style.display = saved.thuHoActive ? 'block' : 'none'
            document.getElementById('kien-thu-ho').value = saved.thuHoActive ? saved.tienThuHo / 1000 : ''
            document.getElementById('kien-thu-ho').dispatchEvent(new Event('input'))

            document.getElementById('btn-cuoc-toggle').classList.toggle('active', saved.cuocActive)
            document.getElementById('kien-cuoc-wrap').style.display = saved.cuocActive ? 'block' : 'none'
            document.getElementById('kien-cuoc').value = saved.cuocActive ? saved.cuocDaThu / 1000 : ''
            document.getElementById('kien-cuoc').dispatchEvent(new Event('input'))

            activePhotoBlob = saved.photoBlob
            activePreviewUrl = saved.previewUrl
            reviewPreviewUrl = null
            if (activePreviewUrl) {
                document.getElementById('kien-preview-img').src = activePreviewUrl
                document.getElementById('kien-preview').style.display = 'block'
            } else {
                document.getElementById('kien-preview').style.display = 'none'
            }
            updateCameraBoxLabel()

            goToStep('step-anh', { stack: ['step-chuyen', 'step-tinh', 'step-diem', 'step-anh'] })
        })

        async function updateQueueStatus() {
            const pending = await getUnsyncedKien()
            const el = document.getElementById('queue-status')
            el.textContent = pending.length ? `⏳ ${pending.length} kiện chưa đồng bộ` : ''
        }

        async function initPage() {
            const auth = await requireSession(sb)
            if (!auth) return
            currentUser = auth.user
            // Multi-tenant (2026-09-19, Giai đoạn 4) — resolveNhaXeId (shared.js) tra
            // nguoi_dung_nha_xe, RLS tầng DB đã chặn xem chéo nhà xe khác nhưng vẫn lọc TƯỜNG MINH
            // ở mọi query bên dưới (defense in depth). null = user chưa được owner gán vào nhà xe
            // nào — lỗi cấu hình, chặn hẳn trang thay vì để crash mù mờ ở các query sau.
            currentNhaXeId = await resolveNhaXeId(sb, currentUser.id)
            if (!currentNhaXeId) {
                showToast('Tài khoản chưa được gán vào nhà xe nào — liên hệ quản trị viên', 'error')
                return
            }
            await loadChuyenList()
            setupQueueAutoSync(sb)
            updateQueueStatus()
            setInterval(updateQueueStatus, 5000)
        }

        const { open: openMenu } = renderSideMenu(sb)
        document.getElementById('btn-open-menu').addEventListener('click', openMenu)

        setupLogoutListener(sb)
        initPage()
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW register failed:', err))
            })
        }
    </script>
